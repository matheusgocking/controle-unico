# Roda os testes automáticos (pasta testes/) a cada envio e a cada pedido de alteração.
# Eles abrem o app num Chromium sem tela, com dados inventados, e conferem as contas.
name: Testes
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
