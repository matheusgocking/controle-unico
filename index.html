<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Único</title>
<meta name="description" content="Controle Único: dinheiro, casa, clínica e carteira num lugar só, guardados no Google Drive de quem usa.">
<!-- instalar como app: Android pelo manifesto, iPhone por "Adicionar à Tela de Início" -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b2a82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png" type="image/png">
<style>
:root{
  --bg:#f1f0f4; --surface:#ffffff; --line:#d8d5e0;
  --text:#1a1920; --muted:#57545f;
  --accent:#7030A0; --accent-ink:#ffffff;
  --barra:#5b2a82; --barra-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161519; --surface:#1f1e24; --line:#38353f;
  --text:#eceaf0; --muted:#a8a4b1;
  --accent:#c8a4f2; --accent-ink:#1a1420;
  --barra:#2c1840; --barra-ink:#f2eaf9;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161519; --surface:#1f1e24; --line:#38353f;
  --text:#eceaf0; --muted:#a8a4b1;
  --accent:#c8a4f2; --accent-ink:#1a1420;
  --barra:#2c1840; --barra-ink:#f2eaf9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}
header{
  flex:none; background:var(--surface); border-bottom:1px solid var(--line);
  padding:8px 14px; padding-top:calc(8px + env(safe-area-inset-top,0px));
  display:flex; gap:8px 16px; align-items:center;
}
.marca{display:flex; align-items:center; gap:9px; font-weight:600}
.selo{width:28px; height:28px; border-radius:8px; background:var(--text); color:var(--bg);
  display:grid; place-items:center; font-size:13px; font-weight:700; flex:none}
.titulo{display:none; font-weight:600; font-size:17px}
nav{display:flex; gap:2px; overflow-x:auto; flex:none; scrollbar-width:thin; padding:6px 10px; background:var(--surface); border-bottom:1px solid var(--line)}
nav button{
  border:0; background:transparent; color:var(--muted); font:inherit; font-size:14px;
  padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:7px;
}
nav button svg{width:18px; height:18px; flex:none}
nav button:hover{color:var(--text)}
/* no computador, sem roxo (27/09/2026): a aba aberta é só destacada, como as abas da Clínica */
nav button[aria-pressed="true"]{background:var(--bg); color:var(--text); font-weight:600; box-shadow:inset 0 0 0 1px var(--line)}
.dir{display:flex; gap:8px; align-items:center; margin-left:auto; flex:none}
.bt{border:1px solid var(--line); background:transparent; color:var(--muted); font:inherit; font-size:13px;
  padding:6px 11px; border-radius:99px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px}
.bt:hover{color:var(--text)}
.bt.p{background:var(--text); color:var(--bg); border-color:var(--text)}
.bt[aria-pressed="true"]{color:var(--text); border-color:var(--text); font-weight:600}
.bt svg{width:16px; height:16px}
.nuvem{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:0}
.nuvem-ponto{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
.nuvem-ponto.ok{background:#2f9e5b} .nuvem-ponto.indo{background:#d49a1c} .nuvem-ponto.erro{background:#d0453a}
.hidden{display:none !important}
.palco{flex:1 1 auto; position:relative; min-height:0}
.palco iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg)}

/* ---------- celular: barra do app em cima, abas embaixo ---------- */
@media (max-width:700px){
  header{background:var(--barra); color:var(--barra-ink); border-bottom:0; padding:6px 12px; padding-top:calc(6px + env(safe-area-inset-top,0px)); min-height:48px}
  .marca{display:none}
  .titulo{display:block}
  .dir{gap:6px}
  .bt{border-color:rgba(255,255,255,.35); color:var(--barra-ink); padding:6px 9px}
  .bt .rot{display:none}
  .bt.p{background:#ffffff; color:#5b2a82; border-color:#ffffff}
  .bt[aria-pressed="true"]{background:rgba(255,255,255,.18); color:var(--barra-ink); border-color:rgba(255,255,255,.7)}
  .nuvem-ponto{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
  nav{
    order:3; flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:0; overflow:visible;
    background:var(--surface); border-top:1px solid var(--line); border-bottom:0;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
  }
  nav button{flex-direction:column; gap:2px; font-size:11px; padding:6px 2px; border-radius:10px; min-height:52px; justify-content:center}
  nav button svg{width:22px; height:22px}
  nav button[aria-pressed="true"]{background:transparent; color:var(--accent)}
  nav button[aria-pressed="true"] svg{background:color-mix(in srgb, var(--accent) 16%, transparent); border-radius:99px; padding:2px 12px; width:46px; box-sizing:content-box}
  .palco{order:2}
}
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="nuvem.js"></script>
</head>
<body>
<header>
  <div class="marca"><div class="selo">CU</div><span>Controle Único</span></div>
  <div class="titulo" id="titulo">Controle Único</div>
  <div class="dir">
    <p class="nuvem"><span class="nuvem-ponto" id="nuvem-ponto" title="Estado do Google Drive"></span><span id="nuvem-texto" class="hidden"></span>
      <button class="bt p" id="nuvem-entrar" type="button">Entrar com o Google</button></p>
    <button class="bt" id="conferir" type="button" title="Conferir o app com as planilhas" aria-label="Conferir o app com as planilhas" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg><span class="rot">Conferir</span></button>
    <button class="bt" id="tema" type="button" title="Tema claro ou escuro" aria-label="Tema claro ou escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/></svg><span class="rot">Tema</span></button>
    <a class="bt" href="privacidade.html" title="Privacidade" aria-label="Privacidade">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/></svg><span class="rot">Privacidade</span></a>
  </div>
</header>

<nav id="abas" aria-label="Módulos">
  <button data-p="tudo" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Tudo</span></button>
  <button data-p="dinheiro" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/></svg><span>Dinheiro</span></button>
  <button data-p="casa" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Casa</span></button>
  <button data-p="clinica" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Clínica</span></button>
  <button data-p="carteira" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 7l11-3v3"/><circle cx="16" cy="13.5" r="1.3" fill="currentColor"/></svg><span>Carteira</span></button>
</nav>

<main class="palco" id="palco"></main>

<script>
// Cada módulo é uma página própria, carregada dentro desta casca. Tudo, Dinheiro e Casa
// dividem o app.html e trocam de tela pelo endereço, sem recarregar os cadernos.
// Quem entra com o Google em qualquer uma passa o acesso para as outras (nuvem.js).
var PAGINAS = {
  tudo:     { quadro:"app",      src:"app.html#tudo" },
  dinheiro: { quadro:"app",      src:"app.html#dinheiro" },
  casa:     { quadro:"app",      src:"app.html#casa" },
  clinica:  { quadro:"clinica",  src:"clinica.html" },
  carteira: { quadro:"carteira", src:"carteira.html" },
  // o modo conferência: app contra as planilhas, um item por linha (decisão 4). Abre pelo botão do topo, não pelas abas.
  conferir: { quadro:"conferir", src:"conferir.html" }
};
var NOMES = { tudo:"Tudo", dinheiro:"Dinheiro", casa:"Casa", clinica:"Clínica", carteira:"Carteira", conferir:"Conferência" };

var palco = document.getElementById("palco");
var quadros = {};
var atual = null;

function quadro(k, src){
  if (quadros[k]) return quadros[k];
  var f = document.createElement("iframe");
  f.id = "q-" + k; f.title = k; f.src = src; f.hidden = true;
  palco.appendChild(f);
  quadros[k] = f;
  return f;
}

function mostrar(p){
  var cfg = PAGINAS[p]; if (!cfg) return;
  var novo = !quadros[cfg.quadro];
  var f = quadro(cfg.quadro, cfg.src);
  if (!novo && cfg.quadro === "app"){
    try { f.contentWindow.location.hash = p; } catch(e){ f.src = cfg.src; }
  }
  for (var q in quadros) quadros[q].hidden = (q !== cfg.quadro);
  f.title = NOMES[p];
  document.getElementById("titulo").textContent = NOMES[p];
  atual = p;
  // voltou para um módulo já aberto: ele confere se o Drive mudou em outro aparelho
  if (!novo) { try { f.contentWindow.Nuvem.aoMostrar(); } catch(e){} }
  var b = document.querySelectorAll("#abas button");
  for (var i = 0; i < b.length; i++) b[i].setAttribute("aria-pressed", String(b[i].dataset.p === p));
  document.getElementById("conferir").setAttribute("aria-pressed", String(p === "conferir"));
  // a conferência não vira a tela de abertura: ao voltar ao app ele cai no módulo de sempre
  if (p !== "conferir") { try { localStorage.setItem("cu-painel-aba", p); } catch(e){} }
  try { history.replaceState(null, "", "#" + p); } catch(e){}
}
var antesDeConferir = "tudo";
document.getElementById("conferir").addEventListener("click", function(){
  if (atual === "conferir") mostrar(antesDeConferir);
  else { antesDeConferir = atual || "tudo"; mostrar("conferir"); }
});

document.getElementById("abas").addEventListener("click", function(e){
  var b = e.target.closest("button[data-p]");
  if (b) mostrar(b.dataset.p);
});

/* o tema escolhido aqui vale para a casca e para os módulos abertos */
function aplicarTema(v){
  document.documentElement.dataset.theme = v;
  for (var q in quadros) { try { quadros[q].contentDocument.documentElement.setAttribute("data-theme", v); } catch(e){} }
}
document.getElementById("tema").addEventListener("click", function(){
  var r = document.documentElement;
  var escuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  var v = escuro ? "light" : "dark";
  aplicarTema(v);
  try { localStorage.setItem("cu-painel-tema", v); localStorage.setItem("cu-tema", v); } catch(e){}
});
try { var t = localStorage.getItem("cu-painel-tema"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
palco.addEventListener("load", function(e){
  var t = document.documentElement.dataset.theme;
  if (t && e.target.tagName === "IFRAME") { try { e.target.contentDocument.documentElement.setAttribute("data-theme", t); } catch(err){} }
}, true);

var inicial = (location.hash || "").replace("#", "");
if (!PAGINAS[inicial]) { try { inicial = localStorage.getItem("cu-painel-aba") || "tudo"; } catch(e){ inicial = "tudo"; } }
if (!PAGINAS[inicial]) inicial = "tudo";
mostrar(inicial);
// A aba Tudo pergunta os números do mês à Clínica: ela abre junto, escondida, desde o começo.
quadro("clinica", PAGINAS.clinica.src).addEventListener("load", function(){
  try { quadros.app && quadros.app.contentWindow.desenhar(); } catch(e){}
});

Nuvem.iniciar();
Nuvem.entrarSozinho();   // no app do iPhone, quem já entrou antes volta a entrar sozinho

// guarda a casca para abrir mais rápido e sem internet (sempre busca a versão nova primeiro)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
