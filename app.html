<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinheiro e Casa · Controle Único</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* Mesmo desenho da Clínica e da Carteira (27/09/2026): fundo cinza-azulado, painéis brancos
   de borda fina, números em negrito e gráficos em rosca. O jeito de app fica só no celular. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --line:#d3dae3; --text:#131820; --muted:#4d5766; --faint:#6f7a8a;
  --accent:#7030a0; --accent-soft:#f0e5fb;
  --pos:#1f6b4f; --pos-soft:#dcefe6; --neg:#a3241f; --neg-soft:#fbdedd; --warn:#8a4b12; --warn-soft:#fbe8d4;
  /* cores das roscas: a paleta validada para daltonismo, na ordem fixa; a oitava é "Outros" */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#8a94a3;
  --font:"IBM Plex Sans",system-ui,sans-serif; --radius:8px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10141a; --surface:#171c24; --surface-2:#1f252f; --line:#303845; --text:#eef2f7; --muted:#aab6c6; --faint:#818d9d;
  --accent:#c8a4f2; --accent-soft:#2e2140;
  --pos:#7fd3ac; --pos-soft:#183a2e; --neg:#f2a09b; --neg-soft:#3d1a18; --warn:#efb87c; --warn-soft:#3f2c15;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#818d9d;
}}
:root[data-theme="dark"]{
  --bg:#10141a; --surface:#171c24; --surface-2:#1f252f; --line:#303845; --text:#eef2f7; --muted:#aab6c6; --faint:#818d9d;
  --accent:#c8a4f2; --accent-soft:#2e2140;
  --pos:#7fd3ac; --pos-soft:#183a2e; --neg:#f2a09b; --neg-soft:#3d1a18; --warn:#efb87c; --warn-soft:#3f2c15;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#818d9d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:4px 24px 56px}
.hidden{display:none !important}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.nota{font-size:12.5px;color:var(--faint)}
.vazio{color:var(--muted);font-size:14px;padding:8px 0}

/* topo: marca, estado do Drive, tema */
.topo{max-width:1200px;margin:0 auto;padding:12px 24px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.marca{font-weight:700;margin-right:auto}
.nuvem{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.nuvem-ponto{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.nuvem-ponto.ok{background:#2f9e5b} .nuvem-ponto.indo{background:#d49a1c} .nuvem-ponto.erro{background:#d0453a}
#nuvem-acoes{display:flex;gap:6px;flex-wrap:wrap}
#nuvem-texto{flex:1 1 0;min-width:0}
nav.abas{display:flex;gap:4px;margin:12px 0 4px}
nav.abas button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer}
nav.abas button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}

/* botões */
.b{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-size:14px}
.b:hover{border-color:var(--faint)}
.b.p{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.b.s{font-size:13px;padding:5px 10px}
.redondo{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:17px}

/* mês */
.mes{display:flex;align-items:center;gap:10px;margin:10px 0 16px}
.mes h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;text-transform:capitalize;min-width:170px;text-align:center}
.mes h1 span{color:var(--faint);font-weight:400}

/* painéis */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.painel h2{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.painel h2 .dir{margin-left:auto;font-weight:400;font-size:13px;color:var(--faint)}
.duas{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-top:18px}
.duas.igual{grid-template-columns:1fr 1fr}
.duas.larga{grid-template-columns:1.75fr 1fr;align-items:start}
.coluna{display:grid;gap:18px;align-content:start;min-width:0}

/* situação do mês */
.situ{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:stretch}
.linha-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.linha-k + .linha-k{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.k span{display:block;color:var(--muted);font-size:13px}
.k b{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:2px;white-space:nowrap}
.k small{display:block;color:var(--faint);font-size:12px;margin-top:3px}
.k.destaque b{font-size:32px}
.veredito{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--surface-2)}
.veredito.pos{background:var(--pos-soft)} .veredito.neg{background:var(--neg-soft)} .veredito.warn{background:var(--warn-soft)}
.veredito .topo-v{display:flex;align-items:center;gap:12px}
.seta{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface)}
.seta svg{width:26px;height:26px}
.veredito b{font-size:19px;line-height:1.2}
.veredito p{margin:0;font-size:13.5px;color:var(--text)}
.veredito.pos b,.veredito.pos .seta{color:var(--pos)} .veredito.neg b,.veredito.neg .seta{color:var(--neg)} .veredito.warn b,.veredito.warn .seta{color:var(--warn)}

/* rosca */
.rosca{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
.rosca > svg{width:170px;height:170px;display:block}
.rosca .centro1{fill:var(--muted);font-size:11px;font-family:var(--font)}
.rosca .centro2{fill:var(--text);font-size:16px;font-weight:700;font-family:var(--font)}
.fatia{transition:opacity .12s}
.rosca > svg:hover .fatia:not(:hover),.rosca.foco .fatia:not(.on){opacity:.35}
.leg{list-style:none;margin:0;padding:0;font-size:14px}
.leg li{display:flex;gap:8px;align-items:baseline;padding:5px 4px;border-top:1px solid var(--line);border-radius:4px}
.leg li:first-child{border-top:0}
.leg li:hover{background:var(--surface-2)}
.leg i{width:10px;height:10px;border-radius:3px;flex:none;align-self:center}
.leg .n{flex:1;min-width:0}
.leg .n small{display:block;color:var(--faint);font-size:11.5px;white-space:normal}
.leg b{font-weight:600;white-space:nowrap}
.leg .pc{color:var(--faint);font-size:12px;min-width:44px;text-align:right}
/* rosca em painel estreito (coluna da direita): o gráfico em cima e a legenda embaixo */
.painel{container-type:inline-size}
@container (max-width:460px){ .rosca{grid-template-columns:minmax(0,1fr);justify-items:center} .leg{width:100%;min-width:0} }
.leg .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selo-b{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--text)}

/* números soltos (como na Clínica) */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-width:0}
.painel .stat{background:var(--surface-2);border-color:transparent}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;color:var(--faint);font-size:11.5px}
.stats.duas-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.trilho{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.painel .stat .trilho{background:var(--line)}
.trilho i{display:block;height:100%;background:var(--c3);border-radius:3px}

/* tabelas */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:0 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th:first-child,table.t td:first-child{padding-left:0}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t .dir{text-align:right;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface-2)}
td.c-data{color:var(--muted);white-space:nowrap;width:1%}
td.c-desc b{font-weight:500}
td.c-cat,td.c-forma{color:var(--muted)}
td.c-val{font-weight:600}
td.c-val.pos{color:var(--pos)}
td.c-x{width:1%}
table.t input{width:84px;padding:5px 8px;text-align:right}
table.t input.dia{width:58px}
.so-cel{display:none}
.quem{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.quem i{width:9px;height:9px;border-radius:50%}
.x{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
.x:hover{color:var(--neg)}

/* formulários atrás de um botão */
details.novo{margin:0 0 12px}
details.novo > summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--radius);font-size:14px}
details.novo > summary:hover{border-color:var(--faint)}
details.novo > summary::-webkit-details-marker{display:none}
details.novo[open] > summary{margin-bottom:10px}
form.linha{background:var(--surface-2);border-radius:var(--radius);padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}
/* a escolha Pessoal ou Casa dentro do formulário único de lançamento (01/10/2026) */
.chave{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.chave button{border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:7px;cursor:pointer;font-size:14px}
.chave button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
/* ordenar a lista: no computador pelo cabeçalho, no celular por uma caixa de escolha */
th .ord{border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer}
th .ord:hover{color:var(--text)}
th .ord[aria-pressed="true"]{color:var(--text);font-weight:700}
.ordem-cel{display:none;margin:0 0 6px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ordem-cel select{width:auto;flex:1;padding:6px 8px}
details.origem{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.6}
details.origem summary{cursor:pointer;color:var(--faint)}
.pe{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* dentro da casca: o botão de entrar, a marca, o tema e as abas ficam na barra de cima */
.na-casca #nuvem-entrar,.na-casca .marca,.na-casca #tema,.na-casca nav.abas{display:none !important}

@media (max-width:960px){
  .duas,.duas.igual,.duas.larga{grid-template-columns:1fr}
  .situ{grid-template-columns:1fr}
}
/* ---------- celular: aqui sim, jeito de app ---------- */
@media (max-width:700px){
  .topo{padding:6px 12px}
  .wrap{padding:0 12px 48px}
  .mes{justify-content:space-between;margin:8px 0 12px}
  .mes h1{font-size:19px;min-width:0}
  .painel{padding:14px}
  .duas{gap:12px;margin-top:12px}
  .coluna{gap:12px}
  .linha-k{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .linha-k .k.destaque{grid-column:1 / -1}
  .k b{font-size:21px} .k.destaque b{font-size:28px}
  .rosca{grid-template-columns:minmax(0,1fr);justify-items:center}
  .leg{width:100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat b{font-size:17px}
  table.t thead{display:none}
  .ordem-cel{display:flex}
  table.t tr{display:grid;grid-template-columns:38px minmax(0,1fr) auto 22px;gap:0 8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  table.t tr:last-child{border-bottom:0}
  table.t td{border:0;padding:0 !important}
  table.t tbody tr:hover td{background:transparent}
  td.c-cat,td.c-forma,td.c-quem{display:none}
  td.c-data{font-size:12.5px}
  .so-cel{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.c-desc{min-width:0} td.c-desc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.fixos tr{grid-template-columns:minmax(0,1fr) 54px 84px 22px}
  table.fixos input{width:100%}
  form.linha{grid-template-columns:repeat(2,minmax(0,1fr))}
  form.linha > div[style]{grid-column:1 / -1 !important}
  form.linha .b{width:100%}
  input,select{font-size:16px}   /* abaixo de 16px o iPhone dá zoom ao tocar no campo */
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="exportar-xlsx.js"></script>
<script src="categorias.js"></script>
<script src="grafico-meses.js"></script>
<script src="nuvem.js"></script>
<script>/* dentro da casca do Controle Único: a casca já mostra marca, abas e tema */ if (window.top !== window.self) document.documentElement.classList.add("na-casca");</script>
</head>
<body>

<header>
  <div class="topo">
    <div class="marca"><b>Controle Único</b></div>
    <p class="nuvem"><span class="nuvem-ponto" id="nuvem-ponto"></span><span id="nuvem-texto">Carregando…</span>
      <button class="b s" id="nuvem-entrar">Entrar com o Google</button><span id="nuvem-acoes"></span></p>
    <button class="b s" id="tema" title="Tema claro ou escuro">◐</button>
  </div>
</header>

<div class="wrap">
  <nav class="abas" id="abas"></nav>
  <main id="tela"></main>
  <div class="pe">
    <button class="b s" id="exportar">Baixar planilha</button>
    <button class="b s" id="exportarJson">Exportar dados</button>
    <button class="b s" id="importarJson">Importar dados</button>
    <input type="file" id="arquivoJson" accept="application/json" class="hidden">
  </div>
</div>

<script>
// ===================================================================
// Dinheiro e Casa. Dois cadernos, cada um num arquivo do Google Drive:
// "Controle Único - dinheiro.json" (só dele) e "Controle Único - casa.json"
// (dele e da pessoa com quem divide a casa). A aba Tudo junta os dois com a Clínica e a Carteira,
// que moram em páginas próprias dentro da mesma casca (index.html).
// As contas seguem os sistemas do Vault: Ciclo do Dinheiro do Mês e Ciclo da Sessão.
// Este arquivo é público: nenhum dado pessoal fica escrito aqui.
// ===================================================================

// Fora da casca, esta página não tem a Clínica ao lado para a aba Tudo: abre pela casca.
if (window.top === window.self) location.replace("index.html" + (location.hash || "#tudo"));

// As listas e a troca dos nomes antigos (com ponto final, como nas planilhas) moram em categorias.js.
const CATEGORIAS = Categorias.DINHEIRO;
const CAT_CASA   = Categorias.CASA;
const TIPOS      = Categorias.TIPOS;
const FORMAS     = Categorias.FORMAS;
// todo caderno que chega (do aparelho, do Drive ou de um arquivo) passa pela troca de nomes
const arrumar = { matheus: Categorias.cadernoDinheiro, casa: Categorias.cadernoCasa };

const VAZIO = {
  matheus: () => ({ versao:1, caderno:"dinheiro", atualizadoEm:null, lancamentos:[], gastosFixos:[],
                    reserva:{ saldoBase:0, dataBase:null, meta:0 } }),
  casa:    () => ({ versao:1, caderno:"casa", atualizadoEm:null, lancamentos:[], pessoas:["Pessoa 1","Pessoa 2"], divisao:0.5 })
};
const NOME_DRIVE = { matheus:"Controle Único - dinheiro.json", casa:"Controle Único - casa.json" };
const ID_NUVEM   = { matheus:"dinheiro", casa:"casa" };

// ---------- armazenamento: cache no navegador + caderno no Google Drive ----------
const chaveCache = c => "controle-unico-" + ID_NUVEM[c] + "-cache";
const armazem = {
  ler(c){ try { const t = localStorage.getItem(chaveCache(c)); return t ? JSON.parse(t) : null; } catch(e){ return null; } },
  gravar(c, d){ d.atualizadoEm = new Date().toISOString();
    try { localStorage.setItem(chaveCache(c), JSON.stringify(d)); } catch(e){}
    if (nuvem[c]) nuvem[c].mudou(); }
};

const livro = {};
for (const c of Object.keys(VAZIO)) livro[c] = arrumar[c](Object.assign(VAZIO[c](), armazem.ler(c) || {}));
function salvar(c){ armazem.gravar(c, livro[c]); desenhar(); }

// Dentro do controle da Ana (ana.html), esta página só serve a Casa: o caderno do dinheiro dele
// não é aberto nem criado no Google dela (30/09/2026).
const PERFIL = (() => { try { return window.top.PERFIL || ""; } catch(e){ return ""; } })();
const nuvem = {};
for (const c of (PERFIL === "ana" ? ["casa"] : Object.keys(VAZIO))) {
  nuvem[c] = Nuvem.caderno({
    id: ID_NUVEM[c], nome: NOME_DRIVE[c], rotulo: c === "casa" ? "o caderno da Casa" : "o caderno do Dinheiro",
    compartilhado: c === "casa",
    obter: () => livro[c],
    aplicar: d => { livro[c] = arrumar[c](Object.assign(VAZIO[c](), d)); try { localStorage.setItem(chaveCache(c), JSON.stringify(livro[c])); } catch(e){} desenhar(); },
    temDados: d => !!(d && ((d.lancamentos && d.lancamentos.length) || (d.gastosFixos && d.gastosFixos.length)))
  });
}

// ---------- utilidades ----------
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let aba = "tudo";
let ref = new Date(); ref.setDate(1);
const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const dinheiro = v => (Number(v) || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const chaveMes = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const noMes = l => (l.data || "").slice(0, 7) === chaveMes(ref);
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const soma = (a, f) => a.reduce((s, x) => s + (Number(f ? f(x) : x) || 0), 0);
const escH = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const dia = d => (d || "").slice(8,10) + "/" + (d || "").slice(5,7);
const primeiro = n => String(n || "").split(" ")[0];
// Gasto fixo guarda o valor de cada mês ("2026-07": 509), como a aba Gastos Fixos da planilha:
// há conta de todo mês e conta de um mês só (anuidade, assinatura anual).
const valorFixo = (g, chave) => g.valores ? (Number(g.valores[chave]) || 0) : (Number(g.valor) || 0);
const lerLocal = k => { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch(e){ return null; } };

// ---------- o que vem das outras páginas ----------
// A Clínica mora em clinica.html, carregada ao lado desta pela casca. A aba Tudo pergunta
// os números do mês à própria Clínica, para as duas telas nunca discordarem.
function janelaClinica(){
  try {
    const f = window.parent.document.getElementById("q-clinica");
    const w = f && f.contentWindow;
    if (w && typeof w.numerosDoMes === "function" && w.dados && w.dados.pacientes) return w;
  } catch(e){}
  return null;
}
function contasClinica(){
  const w = janelaClinica();
  // Regra de Matheus (27/09/2026): o que entrou no mês é tudo; o que falta receber compara
  // só pacientes com pacientes. Empréstimos e acertos vêm da planilha com origem Pendência. ou Extra.
  // no caderno da Clínica a origem do dinheiro fica em "receita" ("origem" diz de onde veio o registro)
  const dePaciente = g => !g.receita || g.receita === "Prática Clínica.";
  if (w) {
    const mes = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const n = w.numerosDoMes(mes), doMes = w.pagamentosDoMes(mes);
    const pacientes = soma(doMes.filter(dePaciente), g => g.valor);
    return { ok:true, ativos:w.dados.pacientes.length, previsto:n.previsto, previstoTriagem:n.previstoTriagem || 0, recebido:n.recebido, pacientes,
             falta:Math.max(n.previsto - pacientes, 0), sessoes:n.sessoes, aConfirmar:n.aConfirmar || 0 };
  }
  // Sem a Clínica aberta: o recebido sai do caderno guardado neste aparelho; o previsto não.
  const c = lerLocal("controle-unico-clinica-cache");
  const doMes = c ? (c.pagamentos || []).filter(noMes) : [];
  return { ok:false, ativos:c ? (c.pacientes || []).length : null, previsto:null, recebido:soma(doMes, g => g.valor),
           pacientes:soma(doMes.filter(dePaciente), g => g.valor), falta:null, sessoes:null };
}
// A Carteira grava o total de cada visita (cripto-v1-visita) neste mesmo navegador.
function carteiraAgora(){
  const v = lerLocal("cripto-v1-visita");
  return v && typeof v.total === "number" ? { total:v.total, t:v.t } : null;
}

// ---------- contas ----------
// Regra do sistema Ciclo do Dinheiro do Mês: a casa entra no financeiro
// dele só pelo que ELE pagou, no lugar da categoria Moradia.
function contasCasa(){
  const doMes = livro.casa.lancamentos.filter(noMes);
  const total = soma(doMes, l => l.valor);
  const metade = total * (Number(livro.casa.divisao) || 0.5);
  const pagou = {}, dif = {};
  for (const p of livro.casa.pessoas){
    pagou[p] = soma(doMes.filter(l => l.quem === p), l => l.valor);
    dif[p] = pagou[p] - metade;
  }
  return { total, metade, pagou, dif };
}

// Matheus, 25/09/2026: a metade serve para mostrar quem pagou mais e quem pagou menos,
// não para acertar contas. Quem ficou atrás costuma pagar mais nas compras seguintes.
function balanca(c, p1, p2){
  if (c.dif[p1] < -0.005) return `${primeiro(p1)} está ${dinheiro(-c.dif[p1])} atrás`;
  if (c.dif[p2] < -0.005) return `${primeiro(p2)} está ${dinheiro(-c.dif[p2])} atrás`;
  return "empatado";
}

function contasDinheiro(){
  const doMes = livro.matheus.lancamentos.filter(noMes);
  const cl = contasClinica();
  const casa = contasCasa();
  const minhaCasa = casa.pagou[livro.casa.pessoas[0]] || 0;

  const receitaSolta = soma(doMes.filter(l => l.tipo === "Receita"), l => l.valor);
  const entrou = receitaSolta + cl.recebido;
  // Moradia fica de fora para não contar duas vezes: ela vem da casa.
  // Os gastos fixos do mês contam como despesa do mês, como na planilha.
  const fixosDoMes = livro.matheus.gastosFixos.filter(g => valorFixo(g, chaveMes(ref)) > 0);
  const fixosMes = soma(fixosDoMes, g => valorFixo(g, chaveMes(ref)));
  const saiu = soma(doMes.filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia"), l => l.valor) + fixosMes + minhaCasa;

  const agora = new Date();
  const faltaSair = chaveMes(ref) === chaveMes(agora)
    ? soma(fixosDoMes.filter(g => Number(g.dia) > agora.getDate()), g => valorFixo(g, chaveMes(ref))) : null;
  const semDia = fixosDoMes.filter(g => !Number(g.dia)).length;

  // Aporte e resgate mexem sempre na reserva, seja qual for a categoria (01/10/2026).
  const r = livro.matheus.reserva;
  const desde = r.dataBase || "0000-00-00";
  const movReserva = livro.matheus.lancamentos.filter(l => (l.data || "") >= desde);
  const reserva = (Number(r.saldoBase) || 0)
    + soma(movReserva.filter(l => l.tipo === "Aporte"), l => l.valor)
    - soma(movReserva.filter(l => l.tipo === "Resgate"), l => l.valor);

  // Como na linha Total do painel da planilha: o que foi para a reserva saiu do caixa do mês,
  // o que voltou dela entrou. Assim, tirar da reserva e gastar deixa o saldo do mês no lugar.
  const aportesMes = soma(doMes.filter(l => l.tipo === "Aporte"), l => l.valor);
  const resgatesMes = soma(doMes.filter(l => l.tipo === "Resgate"), l => l.valor);
  const sobra = entrou - saiu - aportesMes + resgatesMes;
  return { entrou, receitaSolta, recebidoClinica: cl.recebido, dePacientes: cl.pacientes, saiu, minhaCasa, fixosMes, faltaSair, semDia, reserva,
           aportesMes, resgatesMes, sobra, falta: cl.falta, clinicaOk: cl.ok, fimDoMes: sobra + (cl.falta || 0) - (faltaSair || 0) };
}

// Entrou e saiu em cada mês, para o gráfico do Dinheiro (01/10/2026). As mesmas regras do mês
// aberto: entrou é receita solta mais tudo o que a Clínica recebeu; saiu é despesa lançada sem
// Moradia, mais os fixos do mês, mais o que ele pagou na casa.
function serieMeses(){
  const w = janelaClinica(), cache = w ? null : lerLocal("controle-unico-clinica-cache");
  const pags = w ? w.dados.pagamentos || [] : (cache && cache.pagamentos) || [];
  const eu = livro.casa.pessoas[0];
  const doK = k => l => (l.data || "").slice(0, 7) === k;
  return GraficoMeses.meses(12, chaveMes(ref)).map(k => ({ k,
    entrou: soma(livro.matheus.lancamentos.filter(doK(k)).filter(l => l.tipo === "Receita"), l => l.valor) + soma(pags.filter(doK(k)), g => g.valor),
    saiu: soma(livro.matheus.lancamentos.filter(doK(k)).filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia"), l => l.valor)
        + soma(livro.matheus.gastosFixos, g => valorFixo(g, k))
        + soma(livro.casa.lancamentos.filter(doK(k)).filter(l => l.quem === eu), l => l.valor) }));
}

// ---------- ordenar as listas ----------
// Clicar no cabeçalho (ou escolher na caixa, no celular) ordena por aquela coluna; clicar de
// novo inverte. Data e valor começam do maior; texto, de A a Z (pedido dele, 01/10/2026).
const ordem = { lanc:{ c:"data", d:-1 }, casa:{ c:"data", d:-1 } };
const COLUNAS = {
  lanc: [["data","Dia"],["descricao","Descrição"],["categoria","Categoria"],["forma","Forma"],["valor","Valor"]],
  casa: [["data","Dia"],["compra","Compra"],["quem","Quem"],["valor","Valor"]]
};
const valorDaColuna = (l, c) => c === "valor" ? Number(l.valor) || 0
  : c === "compra" ? semPonto(l.categoria) + " " + (l.descricao || "") : String(l[c] || "");
function ordenar(lista, qual){
  const { c, d } = ordem[qual];
  return lista.slice().sort((a, b) => {
    const x = valorDaColuna(a, c), y = valorDaColuna(b, c);
    const r = typeof x === "number" ? x - y : x.localeCompare(y, "pt-BR", { sensitivity:"base" });
    return (r || (b.data || "").localeCompare(a.data || "") * d) * d;
  });
}
function cabecalho(qual){
  const o = ordem[qual];
  return `<thead><tr>${COLUNAS[qual].map(([c, n]) => `<th${c === "valor" ? ' class="dir"' : ""}><button type="button" class="ord" data-ord="${qual}:${c}" aria-pressed="${o.c === c}"
    title="Ordenar por ${n.toLowerCase()}">${n}${o.c === c ? (o.d > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}<th></th></tr></thead>`;
}
function ordemCelular(qual){
  const o = ordem[qual], op = (c, d, n) => `<option value="${c}:${d}"${o.c === c && o.d === d ? " selected" : ""}>${n}</option>`;
  return `<label class="ordem-cel">Ordenar por <select data-ordsel="${qual}" aria-label="Ordenar a lista">
    ${op("data", -1, "mais recentes")}${op("data", 1, "mais antigos")}${op("valor", -1, "maior valor")}${op("valor", 1, "menor valor")}
    ${COLUNAS[qual].filter(([c]) => c !== "data" && c !== "valor").map(([c, n]) => op(c, 1, n.toLowerCase() + ", de A a Z")).join("")}</select></label>`;
}

// ---------- o formulário único de lançamento ----------
// Um botão só, e dentro dele a escolha: é Pessoal (caderno do Dinheiro) ou é da Casa (pedido
// dele, 01/10/2026). Dentro do controle da Ana esta página só tem a Casa, então não há escolha.
let ondeLanc = null;      // o que ele escolheu por último; sem escolha, vale a tela em que está
let rascunho = null;      // o que já estava digitado quando trocou de Pessoal para Casa
function formLancamento(padrao){
  const soCasa = PERFIL === "ana";
  const onde = soCasa ? "casa" : (ondeLanc || padrao);
  const p = onde === "pessoal", v = rascunho || {};
  const op = (lista, sel) => lista.map(t => `<option${t === sel ? " selected" : ""}>${escH(t)}</option>`).join("");
  return `<details class="novo"><summary>+ Novo lançamento</summary><form class="linha" id="fNovo" data-onde="${onde}">
    ${soCasa ? "" : `<div style="grid-column:1 / -1"><label>É de</label><div class="chave" role="group" aria-label="Pessoal ou da casa">
      <button type="button" data-onde="pessoal" aria-pressed="${p}">Pessoal</button><button type="button" data-onde="casa" aria-pressed="${!p}">Casa</button></div></div>`}
    <div><label>Data</label><input type="date" name="data" value="${escH(v.data || hojeISO())}" required></div>
    ${p ? `<div><label>Tipo</label><select name="tipo">${op(TIPOS)}</select></div>`
        : `<div><label>Quem comprou</label><select name="quem">${op(livro.casa.pessoas, soCasa ? (livro.casa.pessoas.find(x => /^ana/i.test(x)) || livro.casa.pessoas[1]) : livro.casa.pessoas[0])}</select></div>`}
    <div style="grid-column:span 2"><label>Descrição</label><input name="descricao" value="${escH(v.descricao || "")}" ${p ? 'placeholder="o que foi" required' : 'placeholder="opcional"'}></div>
    <div><label>Categoria</label><select name="categoria">${op(p ? CATEGORIAS : CAT_CASA)}</select></div>
    ${p ? `<div><label>Forma</label><select name="forma">${op(FORMAS)}</select></div>` : ""}
    <div><label>Valor</label><input type="number" name="valor" step="0.01" min="0" inputmode="decimal" value="${escH(v.valor || "")}" required></div>
    <div><button class="b p" type="submit">Lançar</button></div>
  </form>${p ? `<p class="nota">Aporte e resgate mexem sempre na reserva.</p>` : `<p class="nota">iFood pedido para os dois é da Casa; pedido só seu é Pessoal.</p>`}</details>`;
}

// ---------- telas ----------
// A Carteira juntou Dinheiro e cripto (28/09/2026): aqui ela é a visão do dinheiro; a cripto é outra página.
const ABAS = [["tudo","Tudo"],["carteira","Carteira"],["casa","Casa"]];

const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, (Number(a) || 0) / b * 100)) : 0;
const pctTxt = (a, b) => (b > 0 ? (a / b * 100) : 0).toLocaleString("pt-BR", { maximumFractionDigits:1 }) + "%";
const redondo = v => (v < 0 ? "−" : "") + "R$ " + Math.round(Math.abs(Number(v) || 0)).toLocaleString("pt-BR");
const sinalDin = v => (v < -0.005 ? "−" : "") + dinheiro(Math.abs(v));
const semPonto = s => String(s || "").replace(/\.$/, "").replace(". (", " (");
const dataCurta = d => (d || "").slice(8, 10) + "/" + (d || "").slice(5, 7);
const nd = motivo => `<b class="nota" style="font-size:22px">—</b><small>${motivo}</small>`;

function barraMes(){
  return `<div class="mes"><button class="b redondo" data-mes="-1" aria-label="Mês anterior">‹</button>
    <h1>${MESES[ref.getMonth()]} <span>${ref.getFullYear()}</span></h1>
    <button class="b redondo" data-mes="1" aria-label="Próximo mês">›</button></div>`;
}

// Rosca como a da Carteira ("Onde está"), porque é o gráfico que ele gosta para ver partes de um todo.
// itens: [rótulo, valor, cor, detalhe opcional]. A legenda ao lado leva o valor e a porcentagem.
function rosca(itens, centro, aria){
  itens = itens.filter(x => x[1] > 0.005);
  const total = soma(itens, x => x[1]);
  if (!total) return `<p class="vazio">Nada neste mês.</p>`;
  const R0 = 68, C = 2 * Math.PI * R0, gap = itens.length > 1 ? 2 : 0; let acum = 0;
  const fatias = itens.map(([rot, v, cor], i) => {
    const f = v / total, len = Math.max(0.5, f * C - gap);
    const s = `<circle class="fatia" data-i="${i}" cx="85" cy="85" r="${R0}" fill="none" stroke="${cor}" stroke-width="24"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acum).toFixed(2)}" transform="rotate(-90 85 85)">
      <title>${escH(rot)}: ${dinheiro(v)} (${pctTxt(v, total)})</title></circle>`;
    acum += f * C; return s;
  }).join("");
  const meio = `<text class="centro1" x="85" y="80" text-anchor="middle">${escH(centro)}</text>
    <text class="centro2" x="85" y="100" text-anchor="middle">${redondo(total)}</text>`;
  const leg = itens.map(([rot, v, cor, det], i) => `<li data-i="${i}"><i style="background:${cor}"></i>
    <span class="n">${escH(rot)}${det ? `<small>${escH(det)}</small>` : ""}</span><b>${dinheiro(v)}</b><span class="pc">${pctTxt(v, total)}</span></li>`).join("");
  return `<div class="rosca"><svg viewBox="0 0 170 170" role="img" aria-label="${escH(aria)}">${fatias}${meio}</svg><ul class="leg">${leg}</ul></div>`;
}

// para onde foi o dinheiro do mês: despesas lançadas e fixos por categoria, mais a casa.
// Sete fatias com cor e o resto junto em "Outros", para a rosca continuar legível.
function porCategoria(){
  const km = chaveMes(ref), s = {};
  livro.matheus.lancamentos.filter(noMes).filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia")
    .forEach(l => s[l.categoria] = (s[l.categoria] || 0) + (Number(l.valor) || 0));
  livro.matheus.gastosFixos.forEach(g => { const v = valorFixo(g, km); if (v) s[g.categoria] = (s[g.categoria] || 0) + v; });
  const casa = contasCasa().pagou[livro.casa.pessoas[0]] || 0;
  if (casa) s["Moradia (casa)"] = (s["Moradia (casa)"] || 0) + casa;
  return Object.entries(s).filter(e => e[1] > 0.005).sort((a, b) => b[1] - a[1]);
}
function roscaCategorias(){
  const cats = porCategoria();
  if (!cats.length) return `<p class="vazio">Nada saiu em ${MESES[ref.getMonth()]}.</p>`;
  const cabem = cats.length > 8 ? 7 : 8;
  const itens = cats.slice(0, cabem).map(([k, v], i) => [semPonto(k), v, `var(--c${i + 1})`]);
  const resto = cats.slice(cabem);
  if (resto.length) itens.push(["Outros", soma(resto, e => e[1]), "var(--c8)", resto.map(e => semPonto(e[0])).join(", ")]);
  return rosca(itens, "saiu", "Despesas do mês por categoria");
}

function roscaCasa(c){
  const [p1, p2] = livro.casa.pessoas;
  return rosca([[primeiro(p1), c.pagou[p1], "var(--c1)"], [primeiro(p2), c.pagou[p2], "var(--c2)"]], "casa no mês", "Quem pagou a casa");
}

// Situação do mês: primeiro o que de fato entrou e saiu, depois o que ainda vem,
// e a seta dizendo se dá para gastar (pedido dele, 27/09/2026).
function veredito(d){
  const agora = new Date(), km = chaveMes(ref), hoje = chaveMes(agora);
  const nome = MESES[ref.getMonth()];
  const seta = cima => `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${cima ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}</svg></span>`;
  const caixa = (cls, cima, titulo, texto) => `<div class="veredito ${cls}"><div class="topo-v">${seta(cima)}<b>${titulo}</b></div><p>${texto}</p></div>`;
  if (km < hoje) return d.sobra >= 0
    ? caixa("pos", true, "Fechou positivo", `${nome[0].toUpperCase() + nome.slice(1)} terminou com ${dinheiro(d.sobra)} de sobra.`)
    : caixa("neg", false, "Fechou negativo", `${nome[0].toUpperCase() + nome.slice(1)} terminou com ${sinalDin(d.sobra)}.`);
  const semPrevisto = d.falta === null ? " (sem o previsto da Clínica, que ainda não abriu neste aparelho)" : "";
  const fim = d.fimDoMes;
  if (fim < -0.005) return caixa("neg", false, "Não pode gastar",
    `Mesmo que entre tudo o que falta, ${nome} fecha em ${sinalDin(fim)}${semPrevisto}.`);
  if (d.sobra < -0.005) return caixa("warn", true, "Segure até entrar",
    `Hoje está em ${sinalDin(d.sobra)}. Se entrar o previsto, fecha em ${dinheiro(fim)}: dá para gastar isso, mas só depois que entrar${semPrevisto}.`);
  return caixa("pos", true, "Pode gastar", `Até ${dinheiro(fim)} sem fechar ${nome} no vermelho${semPrevisto}.`);
}

// O card do alto da aba Tudo: o que entrou e saiu, o que ainda vem e a seta. Também fica no alto da Carteira.
function cardSituacao(d){
  const outros = d.entrou - d.dePacientes;
  const lancado = d.saiu - d.fixosMes - d.minhaCasa;
  const corrente = chaveMes(ref) === chaveMes(new Date());
  return `
  <section class="painel"><h2>Situação do mês<span class="dir">${corrente ? "até hoje, " + dataCurta(hojeISO()) : ""}</span></h2>
    <div class="situ"><div>
      <div class="linha-k">
        <div class="k"><span>Recebi</span><b class="pos">${dinheiro(d.entrou)}</b><small>${dinheiro(d.dePacientes)} de pacientes${outros > 0.005 ? ` e ${dinheiro(outros)} de outras entradas` : ""}</small></div>
        <div class="k"><span>Gastei</span><b>${dinheiro(d.saiu)}</b><small>${dinheiro(lancado)} lançados, ${dinheiro(d.fixosMes)} de fixos e ${dinheiro(d.minhaCasa)} da casa</small></div>
        <div class="k destaque"><span>Saldo agora</span><b class="${d.sobra < -0.005 ? "neg" : "pos"}">${sinalDin(d.sobra)}</b><small>recebi menos gastei${d.aportesMes || d.resgatesMes ? ", ajustado pela reserva" : ""}</small></div>
      </div>
      <div class="linha-k">
        <div class="k"><span>Ainda vou receber</span>${d.falta === null ? nd("abra a Clínica para calcular") : `<b>${dinheiro(d.falta)}</b><small>previsto da agenda menos o que os pacientes já pagaram</small>`}</div>
        <div class="k"><span>Ainda vai sair</span>${d.faltaSair === null ? nd("só no mês corrente") : `<b>${dinheiro(d.faltaSair)}</b><small>fixos que vencem depois de hoje${d.semDia ? `, ${d.semDia} sem dia marcado` : ""}</small>`}</div>
        <div class="k destaque"><span>Fecha o mês em</span><b class="${d.fimDoMes < -0.005 ? "neg" : "pos"}">${sinalDin(d.fimDoMes)}</b><small>saldo mais o que vou receber, menos o que vai sair</small></div>
      </div>
    </div>${veredito(d)}</div>
  </section>
`;
}

function telaTudo(){
  const d = contasDinheiro(), c = contasCasa(), cl = contasClinica(), cart = carteiraAgora();
  const r = livro.matheus.reserva;
  const [p1, p2] = livro.casa.pessoas;
  const patrimonio = rosca([["Reserva", d.reserva, "var(--c3)", r.meta ? `${Math.round(pct(d.reserva, r.meta))}% da meta de ${dinheiro(r.meta)}` : ""],
                            ["Cripto", cart ? cart.total : 0, "var(--c4)", cart ? "lida em " + new Date(cart.t).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : ""]],
                           "patrimônio", "Patrimônio: reserva e cripto");

  return barraMes() + formLancamento("pessoal") + cardSituacao(d) + `

  <div class="duas">
    <section class="painel"><h2>Para onde foi</h2>${roscaCategorias()}</section>
    <section class="painel"><h2>Patrimônio</h2>${patrimonio}
      ${cart ? "" : `<p class="nota">Abra a Carteira cripto uma vez neste aparelho para o total dela entrar aqui.</p>`}</section>
  </div>

  <div class="duas igual">
    <section class="painel"><h2>Casa<span class="dir"><span class="selo-b">${escH(balanca(c, p1, p2))}</span></span></h2>${roscaCasa(c)}
      <p class="nota">A balança mostra quem pagou mais no mês, não uma conta a acertar.</p></section>
    <section class="painel"><h2>Clínica</h2>
      <div class="stats duas-col">
        <div class="stat"><span>Pacientes na agenda</span><b>${cl.ativos === null ? "—" : cl.ativos}</b></div>
        <div class="stat"><span>Sessões confirmadas</span><b>${cl.sessoes === null ? "—" : cl.sessoes}</b>${cl.aConfirmar ? `<small>${cl.aConfirmar} a confirmar</small>` : ""}</div>
        <div class="stat"><span>Previsto</span><b>${cl.previsto === null ? "—" : dinheiro(cl.previsto)}</b>${cl.previstoTriagem ? `<small>+ ${dinheiro(cl.previstoTriagem)} em triagem</small>` : `<small>só ativos</small>`}</div>
        <div class="stat"><span>Recebido</span><b>${dinheiro(cl.recebido)}</b>${cl.previsto ? `<div class="trilho"><i style="width:${pct(cl.pacientes, cl.previsto)}%"></i></div><small>${Math.round(pct(cl.pacientes, cl.previsto))}% do previsto, só pacientes</small>` : ""}</div>
      </div></section>
  </div>

  <details class="origem"><summary>De onde vem cada número</summary>
    Recebi: receitas soltas do Dinheiro mais os pagamentos da Clínica (pacientes e acertos). Gastei: despesas lançadas no mês,
    sem a categoria moradia, mais os gastos fixos do mês e o que você pagou na casa, como manda o sistema Ciclo do Dinheiro
    do Mês. Saldo agora: recebi menos gastei, menos o que foi para a reserva (aporte) e mais o que saiu dela (resgate), como a linha Total
    da planilha; o gasto feito com o dinheiro resgatado entra normalmente em Gastei. Ainda vou receber: a mesma conta do Painel da Clínica, pela agenda e pela cobrança de cada paciente, menos o que
    os pacientes já pagaram. Ainda vai sair: gastos fixos com dia depois de hoje. A seta compara o fim do mês com zero.
    Cripto: o total da última vez que a Carteira cripto abriu neste aparelho.
  </details>`;
}

function linhaLanc(l){
  const cls = l.tipo === "Receita" || l.tipo === "Resgate" ? "pos" : "";
  const sinal = cls ? "+ " : l.tipo === "Despesa" ? "− " : "";
  const tipo = l.tipo !== "Despesa" ? ` · ${semPonto(l.tipo)}` : "";
  return `<tr><td class="c-data">${dataCurta(l.data)}</td>
    <td class="c-desc"><b>${escH(l.descricao)}</b><span class="so-cel">${escH(semPonto(l.categoria))} · ${escH(semPonto(l.forma))}${tipo}</span></td>
    <td class="c-cat">${escH(semPonto(l.categoria))}${tipo}</td><td class="c-forma">${escH(semPonto(l.forma))}</td>
    <td class="c-val dir ${cls}">${sinal}${dinheiro(l.valor)}</td>
    <td class="c-x"><button class="x" data-apagar="matheus:lancamentos:${l.id}" aria-label="Apagar">×</button></td></tr>`;
}

// O card do alto da Casa, no mesmo desenho do card da aba Tudo (pedido dele, 28/09/2026):
// quem pagou quanto, o mês contra o anterior e a média, e a caixa dizendo se o mês está acima da média.
function totalCasaDoMes(d){
  const k = chaveMes(d);
  return soma(livro.casa.lancamentos.filter(l => (l.data || "").slice(0, 7) === k), l => l.valor);
}
function cardCasa(c){
  const [p1, p2] = livro.casa.pessoas;
  const parte = Number(livro.casa.divisao) || 0.5;
  const agora = new Date(), corrente = chaveMes(ref) === chaveMes(agora);
  const nome = MESES[ref.getMonth()], Nome = nome[0].toUpperCase() + nome.slice(1);
  const doMes = livro.casa.lancamentos.filter(noMes).length;
  const antes = totalCasaDoMes(new Date(ref.getFullYear(), ref.getMonth() - 1, 1));
  // média dos meses fechados do ano que tiveram compra (o mês aberto e o corrente ficam de fora)
  const meses = [];
  for (let m = 0; m < ref.getMonth(); m++){ const v = totalCasaDoMes(new Date(ref.getFullYear(), m, 1)); if (v > 0.005) meses.push(v); }
  const media = meses.length ? soma(meses) / meses.length : null;
  const dif = c.total - antes;
  const seta = cima => `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${cima ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}</svg></span>`;
  const caixa = (cls, cima, titulo, texto) => `<div class="veredito ${cls}"><div class="topo-v">${seta(cima)}<b>${titulo}</b></div><p>${texto}</p></div>`;
  let v;
  if (media === null) v = `<div class="veredito"><div class="topo-v"><b>Sem média ainda</b></div><p>A média aparece quando houver um mês fechado com compras neste ano.</p></div>`;
  else if (c.total > media + 0.005) v = caixa("warn", true, corrente ? "Já passou da média" : "Acima da média",
    `${corrente ? "Até hoje" : Nome} ${corrente ? "a casa gastou" : "gastou"} ${dinheiro(c.total - media)} a mais que a média de ${dinheiro(media)}.`);
  else v = caixa("pos", false, corrente ? "Dentro da média" : "Abaixo da média",
    corrente ? `Faltam ${dinheiro(media - c.total)} para chegar à média de ${dinheiro(media)}.`
             : `${Nome} ficou ${dinheiro(media - c.total)} abaixo da média de ${dinheiro(media)}.`);
  return `
  <section class="painel"><h2>Situação da casa<span class="dir">${corrente ? "até hoje, " + dataCurta(hojeISO()) : ""}</span></h2>
    <div class="situ"><div>
      <div class="linha-k">
        <div class="k"><span>${escH(primeiro(p1))} pagou</span><b>${dinheiro(c.pagou[p1])}</b><small>parte: ${dinheiro(c.total * parte)}</small></div>
        <div class="k"><span>${escH(primeiro(p2))} pagou</span><b>${dinheiro(c.pagou[p2])}</b><small>parte: ${dinheiro(c.total * (1 - parte))}</small></div>
        <div class="k destaque"><span>Total no mês</span><b>${dinheiro(c.total)}</b><small>${doMes} compra${doMes === 1 ? "" : "s"}</small></div>
      </div>
      <div class="linha-k">
        <div class="k"><span>Balança</span><b style="font-size:18px;white-space:normal">${escH(balanca(c, p1, p2))}</b><small>quem pagou mais no mês</small></div>
        <div class="k"><span>Mês passado</span><b>${dinheiro(antes)}</b><small>${antes > 0.005 ? (dif >= 0 ? dinheiro(dif) + " a menos que agora" : dinheiro(-dif) + " a mais que agora") : "sem compras"}</small></div>
        <div class="k destaque"><span>Média por mês</span>${media === null ? nd("nenhum mês fechado neste ano") : `<b>${dinheiro(media)}</b><small>${meses.length} ${meses.length === 1 ? "mês fechado" : "meses fechados"} de ${ref.getFullYear()}</small>`}</div>
      </div>
    </div>${v}</div>
  </section>
`;
}

function telaCasa(){
  const c = contasCasa();
  const doMes = ordenar(livro.casa.lancamentos.filter(noMes), "casa");
  const [p1, p2] = livro.casa.pessoas;
  const cor = q => q === p1 ? "var(--c1)" : "var(--c2)";
  const parte = Number(livro.casa.divisao) || 0.5;

  const porCat = {};
  doMes.forEach(l => porCat[l.categoria] = (porCat[l.categoria] || 0) + (Number(l.valor) || 0));
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const cabem = cats.length > 8 ? 7 : 8;
  const itensCat = cats.slice(0, cabem).map(([k, v], i) => [semPonto(k), v, `var(--c${i + 1})`]);
  if (cats.length > cabem) itensCat.push(["Outros", soma(cats.slice(cabem), e => e[1]), "var(--c8)", cats.slice(cabem).map(e => semPonto(e[0])).join(", ")]);


  const form = formLancamento("casa");

  const quem = q => `<span class="quem"><i style="background:${cor(q)}"></i>${escH(primeiro(q))}</span>`;
  const lista = doMes.length ? `${ordemCelular("casa")}<table class="t">${cabecalho("casa")}<tbody>
    ${doMes.map(l => `<tr><td class="c-data">${dataCurta(l.data)}</td>
      <td class="c-desc"><b>${escH(semPonto(l.categoria))}${l.descricao && l.descricao !== "-" ? " · " + escH(l.descricao) : ""}</b><span class="so-cel">${quem(l.quem)}</span></td>
      <td class="c-quem">${quem(l.quem)}</td>
      <td class="c-val dir">${dinheiro(l.valor)}</td>
      <td class="c-x"><button class="x" data-apagar="casa:lancamentos:${l.id}" aria-label="Apagar">×</button></td></tr>`).join("")}</tbody></table>`
    : `<p class="vazio">Nenhuma compra em ${MESES[ref.getMonth()]}.</p>`;

  const ajustes = `<details class="novo"><summary>Divisão e nomes</summary>
    <form class="linha" id="fDivisao">
      <div><label>Parte de ${escH(primeiro(p1))} (em %)</label>
        <input type="number" name="divisao" min="0" max="100" step="1" value="${Math.round(parte * 100)}"></div>
      <div><button class="b p" type="submit">Guardar</button></div>
    </form>
    <form class="linha" id="fPessoas" style="margin-top:10px">
      <div><label>Primeira pessoa (a do seu mês)</label><input name="p1" value="${escH(p1)}" required></div>
      <div><label>Segunda pessoa</label><input name="p2" value="${escH(p2)}" required></div>
      <div><button class="b p" type="submit">Guardar</button></div>
    </form><p class="nota">Os nomes ficam só no caderno da casa, no Drive.</p></details>`;

  return barraMes() + cardCasa(c) + `
  <div class="duas larga">
    <section class="painel"><h2>Compras<span class="dir">${doMes.length} no mês</span></h2>${form}${lista}</section>
    <div class="coluna">
      <section class="painel"><h2>Quem pagou</h2>${roscaCasa(c)}</section>
      <section class="painel"><h2>Por categoria</h2>${rosca(itensCat, "casa no mês", "Compras da casa por categoria")}</section>
      <section class="painel"><h2>Ajustes</h2>${ajustes}</section>
    </div>
  </div>`;
}

// ---------- desenho ----------
function desenhar(){
  document.getElementById("abas").innerHTML =
    ABAS.map(([k, n]) => `<button data-a="${k}" aria-pressed="${k === aba}">${n}</button>`).join("");
  const t = document.getElementById("tela");
  // redesenhar não fecha o formulário aberto na mesma tela (a Clínica pode mudar enquanto ele digita)
  const abertos = [...t.querySelectorAll("details")].map(x => x.open);
  const mesma = t.dataset.aba === aba;
  // nem apaga o que ele estava digitando: o Drive ou a Clínica podem mandar redesenhar no meio
  // de um lançamento (01/10/2026). Formulário que acabou de ser enviado volta limpo.
  const digitado = {};
  if (mesma) t.querySelectorAll("form[id]").forEach(f => { if (!f.dataset.limpo) digitado[f.id] = [...f.elements].filter(e => e.name).map(e => [e.name, e.value]); });
  t.innerHTML = aba === "tudo" ? telaTudo() : aba === "carteira" ? telaDinheiro() : telaCasa();
  t.dataset.aba = aba;
  if (mesma) t.querySelectorAll("details").forEach((x, i) => { if (abertos[i] && !x.querySelector("form.enviado")) x.open = true; });
  for (const id in digitado) {
    const f = document.getElementById(id); if (!f) continue;
    digitado[id].forEach(([n, v]) => { const e = f.elements[n];
      if (e && (e.tagName !== "SELECT" || [...e.options].some(o => o.value === v))) e.value = v; });
  }
  ligar();
}

function ligar(){
  document.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => {
    ref.setMonth(ref.getMonth() + Number(b.dataset.mes)); desenhar();
  });
  // passar o mouse na legenda acende a fatia correspondente da rosca
  document.querySelectorAll(".rosca .leg li").forEach(li => {
    const r = li.closest(".rosca"), f = r.querySelector(`.fatia[data-i="${li.dataset.i}"]`);
    li.onmouseenter = () => { r.classList.add("foco"); if (f) f.classList.add("on"); };
    li.onmouseleave = () => { r.classList.remove("foco"); if (f) f.classList.remove("on"); };
  });
  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = () => {
    if (!confirm("Apagar esta linha?")) return;
    const [cad, lista, id] = b.dataset.apagar.split(":");
    livro[cad][lista] = livro[cad][lista].filter(x => x.id !== id); salvar(cad);
  });
  document.querySelectorAll("[data-valorfixo]").forEach(i => i.onchange = () => {
    const g = livro.matheus.gastosFixos.find(x => x.id === i.dataset.valorfixo); if (!g) return;
    if (!g.valores) g.valores = {};
    const n = Number(i.value), k = chaveMes(ref);
    if (n > 0) g.valores[k] = n; else delete g.valores[k];
    salvar("matheus");
  });
  document.querySelectorAll("[data-dia]").forEach(i => i.onchange = () => {
    const g = livro.matheus.gastosFixos.find(x => x.id === i.dataset.dia);
    if (g) { const n = Number(i.value); g.dia = n >= 1 && n <= 31 ? n : null; salvar("matheus"); }
  });

  const pega = f => Object.fromEntries(new FormData(f));
  const liga = (idForm, fn) => { const f = document.getElementById(idForm); if (f) f.onsubmit = e => { e.preventDefault(); const d = pega(f); f.dataset.limpo = "1"; fn(f, d); }; };

  // ordenar: cabeçalho no computador, caixa de escolha no celular
  document.querySelectorAll("[data-ord]").forEach(b => b.onclick = () => {
    const [qual, c] = b.dataset.ord.split(":"), o = ordem[qual];
    ordem[qual] = o.c === c ? { c, d:-o.d } : { c, d: c === "data" || c === "valor" ? -1 : 1 };
    desenhar();
  });
  document.querySelectorAll("[data-ordsel]").forEach(s => s.onchange = () => {
    const [c, d] = s.value.split(":"); ordem[s.dataset.ordsel] = { c, d:Number(d) }; desenhar();
  });
  // clicar num mês do gráfico abre aquele mês
  GraficoMeses.ligar(document.getElementById("tela"), k => { ref = new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1, 1); desenhar(); });

  // o formulário único: trocar entre Pessoal e Casa guarda o que já estava digitado
  const fn = document.getElementById("fNovo");
  if (fn) {
    fn.querySelectorAll("[data-onde]").forEach(b => b.onclick = () => {
      rascunho = { data:fn.data.value, descricao:fn.descricao.value, valor:fn.valor.value };
      ondeLanc = b.dataset.onde; fn.dataset.limpo = "1"; desenhar();
    });
    // aporte e resgate são sempre da reserva: a categoria trava
    if (fn.tipo) {
      const travar = () => { const r = fn.tipo.value === "Aporte" || fn.tipo.value === "Resgate";
        if (r) fn.categoria.value = "Reserva"; fn.categoria.disabled = r; };
      fn.tipo.onchange = travar; travar();
    }
    fn.onsubmit = e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(fn));
      rascunho = null; fn.dataset.limpo = "1";
      if (fn.dataset.onde === "casa") {
        livro.casa.lancamentos.push({ id:novoId(), data:d.data, quem:d.quem, descricao:(d.descricao || "").trim() || "-", categoria:d.categoria, valor:Number(d.valor) });
        salvar("casa");
      } else {
        const reserva = d.tipo === "Aporte" || d.tipo === "Resgate";
        livro.matheus.lancamentos.push({ id:novoId(), data:d.data, tipo:d.tipo, descricao:d.descricao.trim(),
          categoria: reserva ? "Reserva" : d.categoria, forma:d.forma, valor:Number(d.valor) });
        salvar("matheus");
      }
    };
  }
  liga("fFixo", (f, d) => {
    const valores = {};
    for (let m = ref.getMonth(); m < 12; m++) valores[ref.getFullYear() + "-" + String(m + 1).padStart(2, "0")] = Number(d.valor);
    livro.matheus.gastosFixos.push({ id:novoId(), descricao:d.descricao, categoria:d.categoria, dia:Number(d.dia), valores });
    salvar("matheus"); });
  liga("fReserva", (f, d) => { livro.matheus.reserva = { saldoBase:Number(d.saldoBase) || 0,
    dataBase:d.dataBase || null, meta:Number(d.meta) || 0 }; salvar("matheus"); });
  liga("fDivisao", (f, d) => { livro.casa.divisao = Math.min(Math.max(Number(d.divisao) || 50, 0), 100) / 100; salvar("casa"); });
  liga("fPessoas", (f, d) => {
    const antigos = livro.casa.pessoas.slice(), novos = [d.p1.trim(), d.p2.trim()];
    // quem já comprou continua sendo a mesma pessoa, com o nome novo
    livro.casa.lancamentos.forEach(l => { const i = antigos.indexOf(l.quem); if (i >= 0) l.quem = novos[i]; });
    livro.casa.pessoas = novos; salvar("casa");
  });
}

document.getElementById("abas").onclick = e => {
  const b = e.target.closest("[data-a]"); if (!b) return; aba = b.dataset.a;
  try { location.hash = aba; } catch(e){}
  desenhar();
};
// A casca (index.html) troca de aba mudando o endereço: app.html#casa.
function abaDoEndereco(){
  let k = (location.hash || "").replace("#", "");
  if (k === "dinheiro") k = "carteira";   // endereço antigo
  return ABAS.some(([c]) => c === k) ? k : null;
}
window.addEventListener("hashchange", () => {
  const k = abaDoEndereco();
  if (k && k !== aba) aba = k;
  desenhar();   // redesenha mesmo na mesma aba: a Clínica ou a Carteira podem ter mudado
});
// a Clínica e a Carteira gravam neste mesmo navegador: quando mudam, a aba Tudo acompanha
window.addEventListener("storage", e => {
  const digitando = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (!digitando && (e.key === "controle-unico-clinica-cache" || e.key === "cripto-v1-visita")) desenhar();
});
document.getElementById("tema").onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("cu-tema", r.dataset.theme); } catch(e){}
};

document.getElementById("exportar").onclick = () => {
  const m = chaveMes(ref);
  const abas = [
    { nome:"Lançamentos", linhas:[["Data","Tipo","Descrição","Categoria","Forma de Pagamento","Valor"],
      ...livro.matheus.lancamentos.map(l => [l.data, l.tipo, l.descricao, l.categoria, l.forma, l.valor])] },
    { nome:"Gastos Fixos " + ref.getFullYear(), linhas:[["Descrição","Categorias","Dia", ...MESES.map(n => n[0].toUpperCase() + n.slice(1))],
      ...livro.matheus.gastosFixos.map(g => [g.descricao, g.categoria, g.dia || "-",
        ...MESES.map((n, i) => valorFixo(g, ref.getFullYear() + "-" + String(i + 1).padStart(2, "0")) || "-")])] },
    { nome:"Casa", linhas:[["Data","Quem Comprou?","Descrição","Categorias","Valor"],
      ...livro.casa.lancamentos.map(l => [l.data, l.quem, l.descricao, l.categoria, l.valor])] }
  ];
  const w = janelaClinica();
  if (w) {
    const pac = {}; w.dados.pacientes.forEach(p => pac[p.id] = p);
    abas.push({ nome:"Recebimentos", linhas:[["Data","Prontuário","Nome","Valor","Meio","Observação"],
      ...w.dados.pagamentos.map(g => [g.data, (pac[g.pacienteId] || {}).codigo || g.codigo || "-", (pac[g.pacienteId] || {}).nome || "-", g.valor, g.meio || "-", g.obs || ""])] });
    // os anúncios da aba Marketing da Clínica e quem veio de cada um (01/10/2026)
    const origens = w.dados.origens || {}, vazio = v => (v === undefined || v === null || v === "") ? "-" : v;
    abas.push({ nome:"Anúncios", linhas:[["Post","Começou","Terminou","Colocado","Gasto","Visualizações","Alcance","Conversas","Seguidores","Métricas lidas em","Pacientes"],
      ...(w.dados.anuncios || []).map(a => [a.post || "-", vazio(a.inicio), vazio(a.fim), vazio(a.colocado), vazio(a.gasto), vazio(a.views), vazio(a.alcance), vazio(a.conversas), vazio(a.seguidores), vazio(a.lidoEm),
        Object.keys(origens).filter(c => origens[c].anuncio === a.id).join(", ") || "-"])] });
  }
  baixar(xlsx(abas), `Controle Único ${m}.xlsx`);
};

// cópia dos dois cadernos num arquivo só, e a volta dele
document.getElementById("exportarJson").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ dinheiro:livro.matheus, casa:livro.casa }, null, 2)], { type:"application/json" }));
  a.download = "controle-unico-dinheiro-e-casa-" + hojeISO() + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
document.getElementById("importarJson").onclick = () => document.getElementById("arquivoJson").click();
document.getElementById("arquivoJson").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { importarCadernos(JSON.parse(await f.text())); }
  catch(err){ alert("Não consegui ler esse arquivo: " + err.message); }
};
function importarCadernos(j){
  const vem = [];
  if (j.dinheiro && Array.isArray(j.dinheiro.lancamentos)) vem.push(["matheus", j.dinheiro, `${j.dinheiro.lancamentos.length} lançamentos e ${(j.dinheiro.gastosFixos || []).length} gastos fixos`]);
  if (j.casa && Array.isArray(j.casa.lancamentos)) vem.push(["casa", j.casa, `${j.casa.lancamentos.length} compras da casa`]);
  if (!vem.length) throw new Error("o arquivo não tem caderno de dinheiro nem de casa");
  if (!confirm("Isto substitui o que está no app por: " + vem.map(v => v[2]).join(" e ") + ". Seguir?")) return;
  vem.forEach(([c, d]) => { livro[c] = arrumar[c](Object.assign(VAZIO[c](), d)); armazem.gravar(c, livro[c]); });
  desenhar();
}

// O controle da Ana (ana.html) lança na Casa por aqui, sem sair da tela dos gastos dela (01/10/2026).
window.casaParaFora = {
  pessoas: () => livro.casa.pessoas.slice(),
  categorias: () => CAT_CASA.slice(),
  lancar: d => { livro.casa.lancamentos.push({ id:novoId(), data:d.data, quem:d.quem, descricao:(d.descricao || "").trim() || "-",
    categoria:d.categoria, valor:Number(d.valor) }); salvar("casa"); }
};

try { const t = localStorage.getItem("cu-tema"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
{ const k = abaDoEndereco(); if (k) aba = k; }
// Dentro da casca quem manda nas abas é a barra de cima: a daqui sairia repetida.
try { if (window.top !== window.self) document.getElementById("abas").hidden = true; } catch(e){}
desenhar();
Nuvem.iniciar();
</script>
