<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinheiro e Casa · Controle Único</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f6; --surface:#ffffff; --surface-2:#f0eef5; --line:#e2dfe8; --text:#1a1920; --muted:#5a5663; --faint:#8a8594;
  --accent:#7030a0; --accent-ink:#ffffff; --accent-soft:#f1e8f8;
  --pos:#1f7a52; --neg:#b3372f; --neu:#7030a0;
  --p1:#7030a0; --p2:#d08a2c; --res:#2f8f6b; --cri:#d08a2c;
  --font:"IBM Plex Sans",system-ui,sans-serif; --num:"Literata",Georgia,serif; --radius:14px;
  --sombra:0 1px 2px rgba(20,16,30,.05), 0 4px 16px rgba(20,16,30,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141318; --surface:#1d1c22; --surface-2:#26242d; --line:#34313c; --text:#eeebf3; --muted:#b0abba; --faint:#8a8594;
  --accent:#c8a4f2; --accent-ink:#1b1026; --accent-soft:#2c2238;
  --pos:#7fd3ac; --neg:#f2a09b; --neu:#c8a4f2; --p1:#b98ae8; --p2:#e7ad5c; --res:#6cc9a1; --cri:#e7ad5c;
  --sombra:none;
}}
:root[data-theme="dark"]{
  --bg:#141318; --surface:#1d1c22; --surface-2:#26242d; --line:#34313c; --text:#eeebf3; --muted:#b0abba; --faint:#8a8594;
  --accent:#c8a4f2; --accent-ink:#1b1026; --accent-soft:#2c2238;
  --pos:#7fd3ac; --neg:#f2a09b; --neu:#c8a4f2; --p1:#b98ae8; --p2:#e7ad5c; --res:#6cc9a1; --cri:#e7ad5c;
  --sombra:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:5;background:var(--bg)}
.topo{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.marca{font-weight:600;margin-right:auto} .marca b{color:var(--accent)}
button.b{border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.b.s{font-size:13px;padding:6px 10px}
.nuvem{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.nuvem-ponto{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.nuvem-ponto.ok{background:#2f9e5b} .nuvem-ponto.indo{background:#d49a1c} .nuvem-ponto.erro{background:#d0453a}
#nuvem-acoes{display:flex;gap:6px;flex-wrap:wrap}
.hidden{display:none !important}
nav.abas{display:flex;gap:4px;margin:12px 0 4px}
nav.abas button{border:0;background:transparent;color:var(--muted);font:inherit;padding:8px 14px;border-radius:99px;cursor:pointer}
nav.abas button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* mês */
.mes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.mes strong{font-family:var(--num);font-size:22px;font-weight:600;text-transform:capitalize}
.mes strong span{color:var(--faint);font-weight:400}
.redondo{width:38px;height:38px;padding:0 !important;border-radius:50% !important;font-size:18px !important}

/* cartões */
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:26px 0 10px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--sombra)}
.card .r{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card .v{font-family:var(--num);font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .n,.nota{font-size:12.5px;color:var(--muted);margin-top:6px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)} .v.nd{color:var(--faint);font-size:20px}
.duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.duas.tres{grid-template-columns:repeat(3,minmax(0,1fr))}

/* número principal */
.hero{border-radius:20px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#7a3bb0,#4e2272);box-shadow:0 8px 28px rgba(80,30,120,.25)}
.hero.neg{background:linear-gradient(135deg,#8c3a5e,#4e2272)}
.hero .rot{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.hero .grande{font-family:var(--num);font-size:40px;font-weight:600;letter-spacing:-.02em;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.hero .nota{color:rgba(255,255,255,.78)}
.linha-f{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin-top:6px}
.linha-f b{font-variant-numeric:tabular-nums;font-weight:600}
.hero .trilho{background:rgba(255,255,255,.18)}
.hero .trilho i.ent{background:#9ff0c8} .hero .trilho i.sai{background:#ffb3a8}

/* barras */
.trilho{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:8px}
.trilho i{display:block;height:100%;border-radius:99px}
.trilho.duplo i{border-radius:0}
.trilho i.res,.pt.res{background:var(--res)} .trilho i.cri,.pt.cri{background:var(--cri)}
.trilho i.p1,.pt.p1{background:var(--p1)} .trilho i.p2,.pt.p2{background:var(--p2)}
.trilho i.cat{background:var(--accent)}
.partes{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.partes b{color:var(--text);margin-left:4px;font-variant-numeric:tabular-nums}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.topo-card{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.balanca-txt{font-size:13.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px}
.meta{font-size:12.5px;color:var(--muted);margin-top:14px}

/* clínica em miniatura */
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra)}
.mini b{display:block;font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--muted)}

/* categorias */
.cats{display:grid;gap:9px}
.cat-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px}
.cat-l b{font-variant-numeric:tabular-nums;font-weight:600}
.cat-l .trilho{grid-column:1 / -1;margin-top:0;height:6px}

/* listas */
ul.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sombra);overflow:hidden}
ul.lista li{display:grid;grid-template-columns:44px minmax(0,1fr) auto 26px;gap:10px;align-items:center;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
ul.lista li:last-child{border-bottom:0}
.data{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.2}
.data b{display:block;font-size:17px;color:var(--text);font-family:var(--num)}
.desc{min-width:0} .desc b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.val.pos{color:var(--pos)} .val.neg{color:var(--text)} .val.neu{color:var(--neu)}
.desc span.quem,.quem{display:inline-block;width:auto;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;color:#fff}
.quem.p1{background:var(--p1)} .quem.p2{background:var(--p2)}
ul.lista li.fixo{grid-template-columns:minmax(0,1fr) 62px 96px 26px}
ul.lista input{padding:6px 8px;text-align:right}
.x{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:18px;padding:0;line-height:1}
.x:hover{color:var(--neg)}
.vazio{padding:22px 14px;text-align:center;color:var(--faint);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}

/* formulários escondidos atrás de um botão */
details.novo{margin:0 0 12px}
details.novo > summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:9px 16px;border-radius:99px;font-size:14px}
details.novo.leve > summary{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:500}
details.novo > summary::-webkit-details-marker{display:none}
details.novo[open] > summary{margin-bottom:10px}
form.linha{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;box-shadow:var(--sombra)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.cabeca{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 10px}
.cabeca h2.sec{margin:0}
details.origem{margin-top:24px;font-size:12.5px;color:var(--muted);line-height:1.6}
details.origem summary{cursor:pointer;color:var(--faint)}
.pe{margin-top:32px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- celular ---------- */
/* na casca, o botão de entrar é o da barra de cima; aqui fica só o aviso, numa linha com o ponto */
.na-casca #nuvem-entrar{display:none !important}
#nuvem-texto{flex:1 1 0; min-width:0}
.na-casca .marca, .na-casca #tema, .na-casca nav.abas{display:none}   /* a casca já tem marca, tema e abas */
@media (max-width:700px){
  .topo{padding:6px 12px}
  .wrap{padding:0 12px 48px}
  .duas.tres{grid-template-columns:repeat(2,minmax(0,1fr))}
  .duas.tres .card:last-child{grid-column:1 / -1}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .grande{font-size:34px}
  .card .v{font-size:21px}
  form.linha{grid-template-columns:repeat(2,minmax(0,1fr))}
  form.linha > div[style]{grid-column:1 / -1 !important}
  form.linha button.b{width:100%}
  input,select{font-size:16px}   /* abaixo de 16px o iPhone dá zoom ao tocar no campo */
  ul.lista li.fixo{grid-template-columns:minmax(0,1fr) 54px 84px 22px;gap:6px}
}
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="exportar-xlsx.js"></script>
<script src="nuvem.js"></script>
<script>/* dentro da casca do Controle Único: a casca já mostra marca, abas e tema */ if (window.top !== window.self) document.documentElement.classList.add("na-casca");</script>

<body>

<header>
  <div class="topo">
    <div class="marca"><b>Controle Único</b></div>
    <p class="nuvem"><span class="nuvem-ponto" id="nuvem-ponto"></span><span id="nuvem-texto">Carregando…</span>
      <button class="b s" id="nuvem-entrar">Entrar com o Google</button><span id="nuvem-acoes"></span></p>
    <button class="b" id="tema" title="Tema claro ou escuro">◐</button>
  </div>
</header>

<div class="wrap">
  <nav class="abas" id="abas"></nav>
  <main id="tela"></main>
  <div class="pe">
    <button class="b s" id="exportar">Baixar planilha</button>
    <button class="b s" id="exportarJson">Exportar dados</button>
    <button class="b s" id="importarJson">Importar dados</button>
    <input type="file" id="arquivoJson" accept="application/json" class="hidden">
  </div>
</div>

<script>
// ===================================================================
// Dinheiro e Casa. Dois cadernos, cada um num arquivo do Google Drive:
// "Controle Único - dinheiro.json" (só dele) e "Controle Único - casa.json"
// (dele e da pessoa com quem divide a casa). A aba Tudo junta os dois com a Clínica e a Carteira,
// que moram em páginas próprias dentro da mesma casca (index.html).
// As contas seguem os sistemas do Vault: Ciclo do Dinheiro do Mês e Ciclo da Sessão.
// Este arquivo é público: nenhum dado pessoal fica escrito aqui.
// ===================================================================

// Fora da casca, esta página não tem a Clínica ao lado para a aba Tudo: abre pela casca.
if (window.top === window.self) location.replace("index.html" + (location.hash || "#tudo"));

const CATEGORIAS = ["Moradia.","Alimentação.","Ifood.","Transporte.","Saúde.","Viagens.","Entretenimento.","Comunicação.","Prática Clínica.","Contabilidade.","Assinaturas.","Gastos Mãe.","Reserva.","Gastos Fixos."];
const CAT_CASA   = ["Serviços Domésticos.","Mercado.","Fumo.","IPTU.","Internet.","Gás.","Energia.","Condomínio.","Ifood."];
const TIPOS      = ["Despesa.","Receita.","Aporte.","Resgate."];
const FORMAS     = ["PIX.","Crédito.","Débito.","Dinheiro."];

const VAZIO = {
  matheus: () => ({ versao:1, caderno:"dinheiro", atualizadoEm:null, lancamentos:[], gastosFixos:[],
                    reserva:{ saldoBase:0, dataBase:null, meta:0 } }),
  casa:    () => ({ versao:1, caderno:"casa", atualizadoEm:null, lancamentos:[], pessoas:["Pessoa 1","Pessoa 2"], divisao:0.5 })
};
const NOME_DRIVE = { matheus:"Controle Único - dinheiro.json", casa:"Controle Único - casa.json" };
const ID_NUVEM   = { matheus:"dinheiro", casa:"casa" };

// ---------- armazenamento: cache no navegador + caderno no Google Drive ----------
const chaveCache = c => "controle-unico-" + ID_NUVEM[c] + "-cache";
const armazem = {
  ler(c){ try { const t = localStorage.getItem(chaveCache(c)); return t ? JSON.parse(t) : null; } catch(e){ return null; } },
  gravar(c, d){ d.atualizadoEm = new Date().toISOString();
    try { localStorage.setItem(chaveCache(c), JSON.stringify(d)); } catch(e){}
    if (nuvem[c]) nuvem[c].mudou(); }
};

const livro = {};
for (const c of Object.keys(VAZIO)) livro[c] = Object.assign(VAZIO[c](), armazem.ler(c) || {});
function salvar(c){ armazem.gravar(c, livro[c]); desenhar(); }

const nuvem = {};
for (const c of Object.keys(VAZIO)) {
  nuvem[c] = Nuvem.caderno({
    id: ID_NUVEM[c], nome: NOME_DRIVE[c], rotulo: c === "casa" ? "o caderno da Casa" : "o caderno do Dinheiro",
    compartilhado: c === "casa",
    obter: () => livro[c],
    aplicar: d => { livro[c] = Object.assign(VAZIO[c](), d); try { localStorage.setItem(chaveCache(c), JSON.stringify(livro[c])); } catch(e){} desenhar(); },
    temDados: d => !!(d && ((d.lancamentos && d.lancamentos.length) || (d.gastosFixos && d.gastosFixos.length)))
  });
}

// ---------- utilidades ----------
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let aba = "tudo";
let ref = new Date(); ref.setDate(1);
const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const dinheiro = v => (Number(v) || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const chaveMes = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const noMes = l => (l.data || "").slice(0, 7) === chaveMes(ref);
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const soma = (a, f) => a.reduce((s, x) => s + (Number(f ? f(x) : x) || 0), 0);
const escH = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const dia = d => (d || "").slice(8,10) + "/" + (d || "").slice(5,7);
const primeiro = n => String(n || "").split(" ")[0];
// Gasto fixo guarda o valor de cada mês ("2026-07": 509), como a aba Gastos Fixos da planilha:
// há conta de todo mês e conta de um mês só (anuidade, assinatura anual).
const valorFixo = (g, chave) => g.valores ? (Number(g.valores[chave]) || 0) : (Number(g.valor) || 0);
const lerLocal = k => { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch(e){ return null; } };

// ---------- o que vem das outras páginas ----------
// A Clínica mora em clinica.html, carregada ao lado desta pela casca. A aba Tudo pergunta
// os números do mês à própria Clínica, para as duas telas nunca discordarem.
function janelaClinica(){
  try {
    const f = window.parent.document.getElementById("q-clinica");
    const w = f && f.contentWindow;
    if (w && typeof w.numerosDoMes === "function" && w.dados && w.dados.pacientes) return w;
  } catch(e){}
  return null;
}
function contasClinica(){
  const w = janelaClinica();
  // Regra de Matheus (27/09/2026): o que entrou no mês é tudo; o que falta receber compara
  // só pacientes com pacientes. Empréstimos e acertos vêm da planilha com origem Pendência. ou Extra.
  // no caderno da Clínica a origem do dinheiro fica em "receita" ("origem" diz de onde veio o registro)
  const dePaciente = g => !g.receita || g.receita === "Prática Clínica.";
  if (w) {
    const mes = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const n = w.numerosDoMes(mes), doMes = w.pagamentosDoMes(mes);
    const pacientes = soma(doMes.filter(dePaciente), g => g.valor);
    return { ok:true, ativos:w.dados.pacientes.length, previsto:n.previsto, recebido:n.recebido, pacientes,
             falta:Math.max(n.previsto - pacientes, 0), sessoes:n.sessoes };
  }
  // Sem a Clínica aberta: o recebido sai do caderno guardado neste aparelho; o previsto não.
  const c = lerLocal("controle-unico-clinica-cache");
  const doMes = c ? (c.pagamentos || []).filter(noMes) : [];
  return { ok:false, ativos:c ? (c.pacientes || []).length : null, previsto:null, recebido:soma(doMes, g => g.valor),
           pacientes:soma(doMes.filter(dePaciente), g => g.valor), falta:null, sessoes:null };
}
// A Carteira grava o total de cada visita (cripto-v1-visita) neste mesmo navegador.
function carteiraAgora(){
  const v = lerLocal("cripto-v1-visita");
  return v && typeof v.total === "number" ? { total:v.total, t:v.t } : null;
}

// ---------- contas ----------
// Regra do sistema Ciclo do Dinheiro do Mês: a casa entra no financeiro
// dele só pelo que ELE pagou, no lugar da categoria Moradia.
function contasCasa(){
  const doMes = livro.casa.lancamentos.filter(noMes);
  const total = soma(doMes, l => l.valor);
  const metade = total * (Number(livro.casa.divisao) || 0.5);
  const pagou = {}, dif = {};
  for (const p of livro.casa.pessoas){
    pagou[p] = soma(doMes.filter(l => l.quem === p), l => l.valor);
    dif[p] = pagou[p] - metade;
  }
  return { total, metade, pagou, dif };
}

// Matheus, 25/09/2026: a metade serve para mostrar quem pagou mais e quem pagou menos,
// não para acertar contas. Quem ficou atrás costuma pagar mais nas compras seguintes.
function balanca(c, p1, p2){
  if (c.dif[p1] < -0.005) return `${primeiro(p1)} está ${dinheiro(-c.dif[p1])} atrás`;
  if (c.dif[p2] < -0.005) return `${primeiro(p2)} está ${dinheiro(-c.dif[p2])} atrás`;
  return "empatado";
}

function contasDinheiro(){
  const doMes = livro.matheus.lancamentos.filter(noMes);
  const cl = contasClinica();
  const casa = contasCasa();
  const minhaCasa = casa.pagou[livro.casa.pessoas[0]] || 0;

  const receitaSolta = soma(doMes.filter(l => l.tipo === "Receita."), l => l.valor);
  const entrou = receitaSolta + cl.recebido;
  // Moradia fica de fora para não contar duas vezes: ela vem da casa.
  // Os gastos fixos do mês contam como despesa do mês, como na planilha.
  const fixosDoMes = livro.matheus.gastosFixos.filter(g => valorFixo(g, chaveMes(ref)) > 0);
  const fixosMes = soma(fixosDoMes, g => valorFixo(g, chaveMes(ref)));
  const saiu = soma(doMes.filter(l => l.tipo === "Despesa." && l.categoria !== "Moradia."), l => l.valor) + fixosMes + minhaCasa;

  const agora = new Date();
  const faltaSair = chaveMes(ref) === chaveMes(agora)
    ? soma(fixosDoMes.filter(g => Number(g.dia) > agora.getDate()), g => valorFixo(g, chaveMes(ref))) : null;
  const semDia = fixosDoMes.filter(g => !Number(g.dia)).length;

  const r = livro.matheus.reserva;
  const desde = r.dataBase || "0000-00-00";
  const movReserva = livro.matheus.lancamentos.filter(l => l.categoria === "Reserva." && (l.data || "") >= desde);
  const reserva = (Number(r.saldoBase) || 0)
    + soma(movReserva.filter(l => l.tipo === "Aporte."), l => l.valor)
    - soma(movReserva.filter(l => l.tipo === "Resgate."), l => l.valor);

  return { entrou, receitaSolta, recebidoClinica: cl.recebido, dePacientes: cl.pacientes, saiu, minhaCasa, fixosMes, faltaSair, semDia, reserva,
           sobra: entrou - saiu, falta: cl.falta, clinicaOk: cl.ok };
}

// ---------- telas ----------
const ABAS = [["tudo","Tudo"],["dinheiro","Dinheiro"],["casa","Casa"]];

const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, (Number(a) || 0) / b * 100)) : 0;
const nd = motivo => `<div class="v nd">—</div><div class="n">${motivo}</div>`;
const diaBonito = d => `<b>${(d || "").slice(8, 10)}</b>${["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][Number((d || "").slice(5, 7)) - 1] || ""}`;

function barraMes(){
  return `<div class="mes"><button class="b redondo" data-mes="-1" aria-label="Mês anterior">‹</button>
    <strong>${MESES[ref.getMonth()]} <span>${ref.getFullYear()}</span></strong>
    <button class="b redondo" data-mes="1" aria-label="Próximo mês">›</button></div>`;
}

function cartaoCasa(c){
  const [p1, p2] = livro.casa.pessoas;
  const parte = Number(livro.casa.divisao) || 0.5;
  return `<div class="card">
    <div class="topo-card"><div><div class="r">Total da casa no mês</div><div class="v">${dinheiro(c.total)}</div></div>
      <div class="balanca-txt">${escH(balanca(c, p1, p2))}</div></div>
    <div class="trilho duplo"><i class="p1" style="width:${pct(c.pagou[p1], c.total)}%"></i><i class="p2" style="width:${pct(c.pagou[p2], c.total)}%"></i></div>
    <div class="partes">
      <div><span class="pt p1"></span>${escH(primeiro(p1))} pagou<b>${dinheiro(c.pagou[p1])}</b></div>
      <div><span class="pt p2"></span>${escH(primeiro(p2))} pagou<b>${dinheiro(c.pagou[p2])}</b></div>
    </div>
    <div class="nota">Parte de cada um: ${Math.round(parte * 100)}% e ${Math.round((1 - parte) * 100)}%. A balança mostra quem pagou mais no mês, não uma conta a acertar.</div>
  </div>`;
}

// para onde foi o dinheiro do mês: despesas lançadas e fixos por categoria, mais a casa
function porCategoria(){
  const km = chaveMes(ref), soma = {};
  livro.matheus.lancamentos.filter(noMes).filter(l => l.tipo === "Despesa." && l.categoria !== "Moradia.")
    .forEach(l => soma[l.categoria] = (soma[l.categoria] || 0) + (Number(l.valor) || 0));
  livro.matheus.gastosFixos.forEach(g => { const v = valorFixo(g, km); if (v) soma[g.categoria] = (soma[g.categoria] || 0) + v; });
  const casa = contasCasa().pagou[livro.casa.pessoas[0]] || 0;
  if (casa) soma["Moradia. (casa)"] = (soma["Moradia. (casa)"] || 0) + casa;
  return Object.entries(soma).sort((a, b) => b[1] - a[1]);
}
function blocoCategorias(){
  const cats = porCategoria(), maior = cats.length ? cats[0][1] : 0;
  if (!cats.length) return `<div class="vazio">Nada saiu em ${MESES[ref.getMonth()]}.</div>`;
  return `<div class="card"><div class="cats">${cats.map(([k, v]) => `<div class="cat-l"><span>${escH(k.replace(/\.$/, "").replace(". (", " ("))}</span><b>${dinheiro(v)}</b>
    <div class="trilho"><i class="cat" style="width:${pct(v, maior)}%"></i></div></div>`).join("")}</div></div>`;
}

function telaTudo(){
  const d = contasDinheiro(), c = contasCasa(), cl = contasClinica(), cart = carteiraAgora();
  const r = livro.matheus.reserva;
  const patrimonio = d.reserva + (cart ? cart.total : 0);
  const maior = Math.max(d.entrou, d.saiu, 1);

  return barraMes() + `
  <section class="hero ${d.sobra >= 0 ? "pos" : "neg"}">
    <div class="rot">Sobra do mês</div>
    <div class="grande">${dinheiro(d.sobra)}</div>
    <div class="linha-f"><span>Entrou</span><div class="trilho"><i class="ent" style="width:${pct(d.entrou, maior)}%"></i></div><b>${dinheiro(d.entrou)}</b></div>
    <div class="linha-f"><span>Saiu</span><div class="trilho"><i class="sai" style="width:${pct(d.saiu, maior)}%"></i></div><b>${dinheiro(d.saiu)}</b></div>
    <div class="nota">Entrou ${dinheiro(d.dePacientes)} de pacientes${acertos}. Saiu inclui ${dinheiro(d.fixosMes)} de fixos e ${dinheiro(d.minhaCasa)} da casa.</div>
  </section>

  <div class="duas">
    <div class="card"><div class="r">Ainda vai entrar</div>
      ${d.falta === null ? nd("abra a Clínica para calcular") : `<div class="v">${dinheiro(d.falta)}</div><div class="n">previsto da agenda menos o que os pacientes pagaram</div>`}</div>
    <div class="card"><div class="r">Ainda vai sair</div>
      ${d.faltaSair === null ? nd("só no mês corrente")
        : `<div class="v">${dinheiro(d.faltaSair)}</div><div class="n">fixos que vencem depois de hoje${d.semDia ? ` · ${d.semDia} sem dia marcado` : ""}</div>`}</div>

    <div class="trilho duplo"><i class="res" style="width:${pct(d.reserva, patrimonio)}%"></i><i class="cri" style="width:${pct(cart ? cart.total : 0, patrimonio)}%"></i></div>

    <div class="nota">${cart ? "Carteira lida em " + new Date(cart.t).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) + "." : "Abra a aba Carteira uma vez neste aparelho para o total dela entrar aqui."}</div>
  </div>

  <h2 class="sec">Casa</h2>
  ${cartaoCasa(c)}

  <h2 class="sec">Clínica</h2>
  <div class="mini">
    <div><b>${cl.ativos === null ? "—" : cl.ativos}</b><span>pacientes na agenda</span></div>
    <div><b>${cl.sessoes === null ? "—" : cl.sessoes}</b><span>sessões no mês</span></div>
    <div><b>${cl.previsto === null ? "—" : dinheiro(cl.previsto)}</b><span>previsto</span></div>
    <div><b>${dinheiro(cl.recebido)}</b><span>recebido</span></div>

  <h2 class="sec">Para onde foi</h2>

    Entrou: receitas soltas do Dinheiro mais os pagamentos da Clínica (pacientes e acertos). Saiu: despesas lançadas no mês,
    sem a categoria moradia, mais os gastos fixos do mês e o que você pagou na casa, como manda o sistema Ciclo do Dinheiro
    do Mês. Ainda vai entrar e Previsto: a mesma conta do Painel da Clínica, pela agenda e pela cobrança de cada paciente,
    menos o que os pacientes já pagaram. Carteira: o total da última vez que a aba Carteira abriu neste aparelho.
  </details>`;
}

function itemLanc(l){
  const cls = l.tipo === "Receita." || l.tipo === "Resgate." ? "pos" : l.tipo === "Aporte." ? "neu" : "neg";
  const sinal = cls === "pos" ? "+ " : cls === "neg" ? "− " : "";
  return `<li><div class="data">${diaBonito(l.data)}</div>
    <div class="desc"><b>${escH(l.descricao)}</b><span>${escH(l.categoria)} · ${escH(l.forma)}${l.tipo !== "Despesa." ? " · " + escH(l.tipo) : ""}</span></div>
    <div class="val ${cls}">${sinal}${dinheiro(l.valor)}</div>
    <button class="x" data-apagar="matheus:lancamentos:${l.id}" aria-label="Apagar">×</button></li>`;
}

function telaDinheiro(){
  const d = contasDinheiro();
  const doMes = livro.matheus.lancamentos.filter(noMes).sort((a,b) => b.data.localeCompare(a.data));
  const r = livro.matheus.reserva;
  const km = chaveMes(ref);
  const fixosMes = livro.matheus.gastosFixos.slice().sort((a, b) => valorFixo(b, km) - valorFixo(a, km));

  const cards = `<div class="duas tres">
    <div class="card"><div class="r">Despesas do mês</div><div class="v neg">${dinheiro(d.saiu - d.minhaCasa)}</div>
      <div class="n">lançadas e ${dinheiro(d.fixosMes)} de fixos</div></div>
    <div class="card"><div class="r">Receita solta</div><div class="v pos">${dinheiro(d.receitaSolta)}</div>
      <div class="n">fora os pacientes</div></div>
    <div class="card"><div class="r">Reserva</div><div class="v">${dinheiro(d.reserva)}</div>
      ${r.meta ? `<div class="trilho"><i class="res" style="width:${pct(d.reserva, r.meta)}%"></i></div><div class="n">${Math.round(pct(d.reserva, r.meta))}% da meta de ${dinheiro(r.meta)}</div>` : `<div class="n">sem meta</div>`}</div>
  </div>`;

  const form = `<details class="novo"><summary>+ Novo lançamento</summary><form class="linha" id="fLanc">
    <div><label>Data</label><input type="date" name="data" value="${hojeISO()}" required></div>
    <div><label>Tipo</label><select name="tipo">${TIPOS.map(t => `<option>${t}</option>`).join("")}</select></div>
    <div style="grid-column:span 2"><label>Descrição</label><input name="descricao" placeholder="o que foi" required></div>
    <div><label>Categoria</label><select name="categoria">${CATEGORIAS.map(t => `<option>${t}</option>`).join("")}</select></div>
    <div><label>Forma</label><select name="forma">${FORMAS.map(t => `<option>${t}</option>`).join("")}</select></div>
    <div><label>Valor</label><input type="number" name="valor" step="0.01" min="0" inputmode="decimal" required></div>
    <div><button class="b p" type="submit">Lançar</button></div>
  </form></details>`;

  const lista = doMes.length ? `<ul class="lista">${doMes.map(itemLanc).join("")}</ul>`
    : `<div class="vazio">Nenhum lançamento em ${MESES[ref.getMonth()]}.</div>`;

  const fixos = fixosMes.length
    ? `<ul class="lista">${fixosMes.map(g => `<li class="fixo">
        <div class="desc"><b>${escH(g.descricao)}</b><span>${escH(g.categoria)}</span></div>
        <input type="number" min="1" max="31" inputmode="numeric" data-dia="${g.id}" value="${g.dia || ""}" placeholder="dia" aria-label="Dia do mês">
        <input type="number" step="0.01" min="0" inputmode="decimal" data-valorfixo="${g.id}" value="${valorFixo(g, km) || ""}" placeholder="—" aria-label="Valor em ${MESES[ref.getMonth()]}">
        <button class="x" data-apagar="matheus:gastosFixos:${g.id}" aria-label="Apagar">×</button></li>`).join("")}</ul>`
    : `<div class="vazio">Nenhum gasto fixo cadastrado.</div>`;

  const formFixo = `<details class="novo leve"><summary>+ Novo gasto fixo</summary><form class="linha" id="fFixo">
    <div style="grid-column:span 2"><label>Gasto fixo</label><input name="descricao" placeholder="assinatura, conta" required></div>
    <div><label>Categoria</label><select name="categoria">${CATEGORIAS.map(t => `<option>${t}</option>`).join("")}</select></div>
    <div><label>Dia do mês</label><input type="number" name="dia" min="1" max="31" inputmode="numeric" required></div>
    <div><label>Valor por mês</label><input type="number" name="valor" step="0.01" min="0" inputmode="decimal" required></div>
    <div><button class="b" type="submit">Cadastrar deste mês até dezembro</button></div>
  </form></details>`;

  const formReserva = `<details class="novo leve"><summary>Ajustar a reserva</summary><form class="linha" id="fReserva">
    <div><label>Saldo conferido</label><input type="number" name="saldoBase" step="0.01" inputmode="decimal" value="${r.saldoBase || ""}"></div>
    <div><label>Conferido em</label><input type="date" name="dataBase" value="${r.dataBase || ""}"></div>
    <div><label>Meta</label><input type="number" name="meta" step="0.01" inputmode="decimal" value="${r.meta || ""}"></div>
    <div><button class="b" type="submit">Guardar</button></div>
  </form><div class="nota">Aportes e resgates da categoria Reserva contam a partir da data conferida.</div></details>`;

  return barraMes() + cards +
    `<div class="cabeca"><h2 class="sec">Lançamentos</h2></div>` + form + lista +

    `<div class="cabeca"><h2 class="sec">Gastos fixos · dia e valor em ${MESES[ref.getMonth()]}</h2></div>` + formFixo + fixos +
    `<h2 class="sec">Reserva</h2>` + formReserva;
}

function telaCasa(){
  const c = contasCasa();
  const doMes = livro.casa.lancamentos.filter(noMes).sort((a,b) => b.data.localeCompare(a.data));
  const [p1, p2] = livro.casa.pessoas;
  const classe = q => q === p1 ? "p1" : "p2";

  const form = `<details class="novo"><summary>+ Nova compra</summary><form class="linha" id="fCasa">
    <div><label>Data</label><input type="date" name="data" value="${hojeISO()}" required></div>
    <div><label>Quem comprou</label><select name="quem">${livro.casa.pessoas.map(p => `<option>${escH(p)}</option>`).join("")}</select></div>

    <div><label>Valor</label><input type="number" name="valor" step="0.01" min="0" inputmode="decimal" required></div>
    <div><button class="b p" type="submit">Lançar</button></div>
  </form></details>`;

  const lista = doMes.length ? `<ul class="lista">${doMes.map(l => `<li><div class="data">${diaBonito(l.data)}</div>
      <div class="desc"><b>${escH(l.categoria.replace(/\.$/, ""))}${l.descricao && l.descricao !== "-" ? " · " + escH(l.descricao) : ""}</b>
        <span><span class="quem ${classe(l.quem)}">${escH(primeiro(l.quem))}</span></span></div>
      <div class="val">${dinheiro(l.valor)}</div>
      <button class="x" data-apagar="casa:lancamentos:${l.id}" aria-label="Apagar">×</button></li>`).join("")}</ul>`
    : `<div class="vazio">Nenhuma compra em ${MESES[ref.getMonth()]}.</div>`;

  const ajustes = `<details class="novo leve"><summary>Divisão e nomes</summary>

      <div><label>Parte de ${escH(primeiro(p1))} (em %)</label>
        <input type="number" name="divisao" min="0" max="100" step="1" value="${Math.round((livro.casa.divisao || .5) * 100)}"></div>
      <div><button class="b" type="submit">Guardar</button></div>
    </form>
    <form class="linha" id="fPessoas" style="margin-top:10px">
      <div><label>Primeira pessoa (a do seu mês)</label><input name="p1" value="${escH(p1)}" required></div>
      <div><label>Segunda pessoa</label><input name="p2" value="${escH(p2)}" required></div>
      <div><button class="b" type="submit">Guardar</button></div>
    </form><div class="nota">Os nomes ficam só no caderno da casa, no Drive.</div></details>`;

  return barraMes() + cartaoCasa(c) +
    `<div class="cabeca"><h2 class="sec">Compras</h2></div>` + form + lista +
    `<h2 class="sec">Ajustes</h2>` + ajustes;
}

// ---------- desenho ----------
function desenhar(){
  document.getElementById("abas").innerHTML =
    ABAS.map(([k, n]) => `<button data-a="${k}" aria-pressed="${k === aba}">${n}</button>`).join("");
  const t = document.getElementById("tela");
  // redesenhar não fecha o formulário aberto na mesma tela (a Clínica pode mudar enquanto ele digita)
  const abertos = [...t.querySelectorAll("details")].map(x => x.open);
  const mesma = t.dataset.aba === aba;
  t.innerHTML = aba === "tudo" ? telaTudo() : aba === "dinheiro" ? telaDinheiro() : telaCasa();
  t.dataset.aba = aba;
  if (mesma) t.querySelectorAll("details").forEach((x, i) => { if (abertos[i] && !x.querySelector("form.enviado")) x.open = true; });
  ligar();
}

function ligar(){
  document.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => {
    ref.setMonth(ref.getMonth() + Number(b.dataset.mes)); desenhar();
  });
  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = () => {
    if (!confirm("Apagar esta linha?")) return;
    const [cad, lista, id] = b.dataset.apagar.split(":");
    livro[cad][lista] = livro[cad][lista].filter(x => x.id !== id); salvar(cad);
  });
  document.querySelectorAll("[data-valorfixo]").forEach(i => i.onchange = () => {
    const g = livro.matheus.gastosFixos.find(x => x.id === i.dataset.valorfixo); if (!g) return;
    if (!g.valores) g.valores = {};
    const n = Number(i.value), k = chaveMes(ref);
    if (n > 0) g.valores[k] = n; else delete g.valores[k];
    salvar("matheus");
  });
  document.querySelectorAll("[data-dia]").forEach(i => i.onchange = () => {
    const g = livro.matheus.gastosFixos.find(x => x.id === i.dataset.dia);
    if (g) { const n = Number(i.value); g.dia = n >= 1 && n <= 31 ? n : null; salvar("matheus"); }
  });

  const pega = f => Object.fromEntries(new FormData(f));
  const liga = (idForm, fn) => { const f = document.getElementById(idForm); if (f) f.onsubmit = e => { e.preventDefault(); fn(f, pega(f)); }; };

  liga("fLanc", (f, d) => { livro.matheus.lancamentos.push({ id:novoId(), data:d.data, tipo:d.tipo,
    descricao:d.descricao, categoria:d.categoria, forma:d.forma, valor:Number(d.valor) }); salvar("matheus"); });
  liga("fFixo", (f, d) => {
    const valores = {};
    for (let m = ref.getMonth(); m < 12; m++) valores[ref.getFullYear() + "-" + String(m + 1).padStart(2, "0")] = Number(d.valor);
    livro.matheus.gastosFixos.push({ id:novoId(), descricao:d.descricao, categoria:d.categoria, dia:Number(d.dia), valores });
    salvar("matheus"); });
  liga("fReserva", (f, d) => { livro.matheus.reserva = { saldoBase:Number(d.saldoBase) || 0,
    dataBase:d.dataBase || null, meta:Number(d.meta) || 0 }; salvar("matheus"); });
  liga("fCasa", (f, d) => { livro.casa.lancamentos.push({ id:novoId(), data:d.data, quem:d.quem,
    descricao:d.descricao || "-", categoria:d.categoria, valor:Number(d.valor) }); salvar("casa"); });
  liga("fDivisao", (f, d) => { livro.casa.divisao = Math.min(Math.max(Number(d.divisao) || 50, 0), 100) / 100; salvar("casa"); });
  liga("fPessoas", (f, d) => {
    const antigos = livro.casa.pessoas.slice(), novos = [d.p1.trim(), d.p2.trim()];
    // quem já comprou continua sendo a mesma pessoa, com o nome novo
    livro.casa.lancamentos.forEach(l => { const i = antigos.indexOf(l.quem); if (i >= 0) l.quem = novos[i]; });
    livro.casa.pessoas = novos; salvar("casa");
  });
}

document.getElementById("abas").onclick = e => {
  const b = e.target.closest("[data-a]"); if (!b) return; aba = b.dataset.a;
  try { location.hash = aba; } catch(e){}
  desenhar();
};
// A casca (index.html) troca de aba mudando o endereço: app.html#casa.
function abaDoEndereco(){
  const k = (location.hash || "").replace("#", "");
  return ABAS.some(([c]) => c === k) ? k : null;
}
window.addEventListener("hashchange", () => {
  const k = abaDoEndereco();
  if (k && k !== aba) aba = k;
  desenhar();   // redesenha mesmo na mesma aba: a Clínica ou a Carteira podem ter mudado
});
// a Clínica e a Carteira gravam neste mesmo navegador: quando mudam, a aba Tudo acompanha
window.addEventListener("storage", e => {
  const digitando = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (!digitando && (e.key === "controle-unico-clinica-cache" || e.key === "cripto-v1-visita")) desenhar();
});
document.getElementById("tema").onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("cu-tema", r.dataset.theme); } catch(e){}
};

document.getElementById("exportar").onclick = () => {
  const m = chaveMes(ref);
  const abas = [
    { nome:"Lançamentos", linhas:[["Data","Tipo","Descrição","Categoria","Forma de Pagamento","Valor"],
      ...livro.matheus.lancamentos.map(l => [l.data, l.tipo, l.descricao, l.categoria, l.forma, l.valor])] },
    { nome:"Gastos Fixos " + ref.getFullYear(), linhas:[["Descrição","Categorias","Dia", ...MESES.map(n => n[0].toUpperCase() + n.slice(1))],
      ...livro.matheus.gastosFixos.map(g => [g.descricao, g.categoria, g.dia || "-",
        ...MESES.map((n, i) => valorFixo(g, ref.getFullYear() + "-" + String(i + 1).padStart(2, "0")) || "-")])] },
    { nome:"Casa", linhas:[["Data","Quem Comprou?","Descrição","Categorias","Valor"],
      ...livro.casa.lancamentos.map(l => [l.data, l.quem, l.descricao, l.categoria, l.valor])] }
  ];
  const w = janelaClinica();
  if (w) {
    const pac = {}; w.dados.pacientes.forEach(p => pac[p.id] = p);
    abas.push({ nome:"Recebimentos", linhas:[["Data","Prontuário","Nome","Valor","Meio","Observação"],
      ...w.dados.pagamentos.map(g => [g.data, (pac[g.pacienteId] || {}).codigo || g.codigo || "-", (pac[g.pacienteId] || {}).nome || "-", g.valor, g.meio || "-", g.obs || ""])] });
  }
  baixar(xlsx(abas), `Controle Único ${m}.xlsx`);
};

// cópia dos dois cadernos num arquivo só, e a volta dele
document.getElementById("exportarJson").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ dinheiro:livro.matheus, casa:livro.casa }, null, 2)], { type:"application/json" }));
  a.download = "controle-unico-dinheiro-e-casa-" + hojeISO() + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
document.getElementById("importarJson").onclick = () => document.getElementById("arquivoJson").click();
document.getElementById("arquivoJson").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { importarCadernos(JSON.parse(await f.text())); }
  catch(err){ alert("Não consegui ler esse arquivo: " + err.message); }
};
function importarCadernos(j){
  const vem = [];
  if (j.dinheiro && Array.isArray(j.dinheiro.lancamentos)) vem.push(["matheus", j.dinheiro, `${j.dinheiro.lancamentos.length} lançamentos e ${(j.dinheiro.gastosFixos || []).length} gastos fixos`]);
  if (j.casa && Array.isArray(j.casa.lancamentos)) vem.push(["casa", j.casa, `${j.casa.lancamentos.length} compras da casa`]);
  if (!vem.length) throw new Error("o arquivo não tem caderno de dinheiro nem de casa");
  if (!confirm("Isto substitui o que está no app por: " + vem.map(v => v[2]).join(" e ") + ". Seguir?")) return;
  vem.forEach(([c, d]) => { livro[c] = Object.assign(VAZIO[c](), d); armazem.gravar(c, livro[c]); });
  desenhar();
}
