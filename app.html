// "O que precisa de você" (06/10/2026, ideia do primeiro desenho do app): no alto da aba Tudo, o
// que pede ação hoje, de todas as áreas, num lugar só. Cada aviso vem da conta que a tela dele já faz
// (a Clínica responde pela dela) e o toque leva até lá. Só lê: nada aqui grava nem muda número.
const NIVEL_PRECISA = { urgente:0, atencao:1, info:2 };
function avisosPrecisa(){
  const A = [], km = chaveMes(ref), agora = new Date(), hoje = agora.getDate();
  // Clínica: atrasos e vencimentos, sessões sem marcar e prontuário por escrever
  const w = janelaClinica();
  if (w && typeof w.avisosDaClinica === "function") {
    try { w.avisosDaClinica().forEach(a => A.push({ ...a, area:"Clínica", ir:{ clinica:a.abrir } })); } catch(e){}
  }
  // Dinheiro: fixos do mês ainda não copiados, fixos que vencem nos próximos dias, limites, pendências
  const copiar = fixosParaCopiar(km).length;
  if (copiar) A.push({ nivel:"atencao", area:"Dinheiro", titulo:`Gastos fixos de ${MESES[ref.getMonth()]} ainda não copiados`,
    detalhe:`${copiar} ${copiar === 1 ? "cobrou" : "cobraram"} no mês passado. Sem eles, "Fecha o mês em" fica sem essas contas.`, ir:{ din:"fixos" } });
  const vencem = livro.matheus.gastosFixos.map(g => ({ g, dia:diaFixo(g, km), v:valorFixo(g, km) }))
    .filter(x => x.v > 0 && x.dia >= hoje && x.dia <= hoje + 3).sort((a, b) => a.dia - b.dia);
  vencem.forEach(x => A.push({ nivel:"info", area:"Dinheiro", ordem:x.dia - hoje,
    titulo:`${semPonto(x.g.descricao || nomeCat(x.g.categoria))}: ${x.dia === hoje ? "sai hoje" : x.dia === hoje + 1 ? "sai amanhã" : `sai em ${x.dia - hoje} dias`}`,
    detalhe:`${dinheiro(x.v)}, gasto fixo do dia ${x.dia}.`, ir:{ din:"fixos" } }));
  const lim = livro.matheus.limites || {}, gasto = Object.fromEntries(porCategoria());
  Object.keys(lim).filter(c => Number(lim[c]) > 0).forEach(c => {
    const teto = Number(lim[c]), foi = gasto[c] || 0;
    if (foi > teto * 1.0005) A.push({ nivel:"atencao", area:"Dinheiro", titulo:`${semPonto(nomeCat(c))} passou do limite`,
      detalhe:`${dinheiro(foi)} de ${dinheiro(teto)}: ${dinheiro(foi - teto)} acima.`, ir:{ din:"mes" } });
    else if (foi >= teto * PERTO_DO_LIMITE) A.push({ nivel:"info", area:"Dinheiro", titulo:`${semPonto(nomeCat(c))} perto do limite`,
      detalhe:`Sobram ${dinheiro(teto - foi)} de ${dinheiro(teto)}.`, ir:{ din:"mes" } });
  });
  const abertas = (livro.matheus.pendencias || []).filter(p => !pendQuitada(p));
  if (abertas.length) {
    const rec = soma(abertas.filter(p => p.tipo === "receber"), restantePend), pag = soma(abertas.filter(p => p.tipo === "pagar"), restantePend);
    A.push({ nivel:"info", area:"Dinheiro", titulo:`${abertas.length} ${abertas.length === 1 ? "pendência em aberto" : "pendências em aberto"}`,
      detalhe:[rec > 0.005 ? `${dinheiro(rec)} a receber` : "", pag > 0.005 ? `${dinheiro(pag)} a pagar` : ""].filter(Boolean).join(" e ") + ".", ir:{ din:"pend" } });
  }
  // Cripto: os avisos fortes da Carteira (menos o humor do mercado, que não pede nada dele), se ela está aberta; senão, a pool fora da faixa da última leitura
  let cripto = null;
  try { const f = window.parent.document.getElementById("q-carteira"), cw = f && f.contentWindow;
    if (cw && typeof cw.calcularAlertas === "function") cripto = cw.calcularAlertas().filter(a => a.nivel !== "info" && !String(a.id).startsWith("medo")); } catch(e){}
  if (cripto) cripto.forEach(a => A.push({ nivel:a.nivel, area:"Cripto", titulo:a.titulo, detalhe:a.detalhe, ir:{ cripto:true } }));
  else {
    const vivo = lerLocal("cripto-v1-vivo"), fora = vivo && Array.isArray(vivo.posicoes) ? vivo.posicoes.filter(x => x && !x.teste && !x.dentro).length : 0;
    if (fora) A.push({ nivel:"urgente", area:"Cripto", titulo:`${fora === 1 ? "1 pool fora" : fora + " pools fora"} da faixa`,
      detalhe:`Parada${fora === 1 ? "" : "s"}, sem render taxas. Leitura de ${new Date(vivo.t).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" })}.`, ir:{ cripto:true } });
  }
  return A.map((a, i) => ({ ...a, i })).sort((a, b) => NIVEL_PRECISA[a.nivel] - NIVEL_PRECISA[b.nivel] || (a.ordem || 0) - (b.ordem || 0) || a.i - b.i);
}

// leva ao lugar do aviso: a casca troca a tela (assim o título e as abas acompanham)
function irPrecisa(a){
  if (!a || !a.ir) return;
  const casca = (() => { try { return window.top !== window.self && typeof window.parent.mostrar === "function" ? window.parent : null; } catch(e){ return null; } })();
  if (a.ir.din) {
    vistaDin = a.ir.din;
    if (casca) casca.mostrar("carteira");
    else { aba = "carteira"; try { location.hash = aba; } catch(e){} desenhar(); }
    window.scrollTo(0, 0);
    return;
  }
  if (!casca) return;   // fora da casca não há Clínica nem Cripto ao lado
  if (a.ir.cripto) { casca.mostrar("cripto"); return; }
  if (a.ir.clinica) {
    casca.mostrar("clinica");
    const w = janelaClinica();
    if (w && typeof w.abrirDoTudo === "function") w.abrirDoTudo(a.ir.clinica);
  }
}

// O card do alto da Casa, no mesmo desenho do card da aba Tudo (pedido dele, 28/09/2026):
// quem pagou quanto, o mês contra o anterior e a média, e a caixa dizendo se o mês está acima da média.
const CASA_MEDIA_DESDE = "2026-08";   // primeiro mês com a casa lançada do começo ao fim
function totalCasaDoMes(d){
  const k = chaveMes(d);
  return soma(livro.casa.lancamentos.filter(l => (l.data || "").slice(0, 7) === k), l => l.valor);
}
function mediaCasa(km){
  const meses = [], chaves = [];
  for (let m = 1; m <= 12; m++){
    const d = new Date(Number(km.slice(0, 4)), Number(km.slice(5, 7)) - 1 - m, 1);
    if (chaveMes(d) < CASA_MEDIA_DESDE) break;
    const v = totalCasaDoMes(d); if (v > 0.005) { meses.push(v); chaves.push(chaveMes(d)); }
  }
  return { meses, chaves, media: meses.length ? soma(meses) / meses.length : null };
}
function cardCasa(c){
  const [p1, p2] = livro.casa.pessoas;
  const parte = parteCasa();
  const agora = new Date(), corrente = chaveMes(ref) === chaveMes(agora);
  const nome = MESES[ref.getMonth()], Nome = nome[0].toUpperCase() + nome.slice(1);
  const doMes = livro.casa.lancamentos.filter(noMes).length;
  const antes = totalCasaDoMes(new Date(ref.getFullYear(), ref.getMonth() - 1, 1));
  // Média dos últimos 12 meses fechados antes do mês aberto, só a partir do primeiro mês lançado inteiro
  // (decisão dele, 04/10/2026: julho de 2026 tem só parte das compras e puxaria a média para baixo).
  const { meses, media } = mediaCasa(chaveMes(ref));
  const dif = c.total - antes;
  const seta = cima => `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${cima ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}</svg></span>`;
  const caixa = (cls, cima, titulo, texto) => `<div class="veredito ${cls}"><div class="topo-v">${seta(cima)}<b>${titulo}</b></div><p>${texto}</p></div>`;
  let v;
  if (media === null) v = `<div class="veredito"><div class="topo-v"><b>Sem média ainda</b></div><p>A média aparece quando houver um mês fechado com compras, a partir de agosto de 2026.</p></div>`;
  else if (c.total > media + 0.005) v = caixa("warn", true, corrente ? "Já passou da média" : "Acima da média",
    `${corrente ? "Até hoje" : Nome} ${corrente ? "a casa gastou" : "gastou"} ${dinheiro(c.total - media)} a mais que a média de ${dinheiro(media)}.`);
  else v = caixa("pos", false, corrente ? "Dentro da média" : "Abaixo da média",
    corrente ? `Faltam ${dinheiro(media - c.total)} para chegar à média de ${dinheiro(media)}.`
             : `${Nome} ficou ${dinheiro(media - c.total)} abaixo da média de ${dinheiro(media)}.`);
  return `
  <section class="painel"><h2>Situação da casa<span class="dir">${corrente ? "até hoje, " + dataCurta(hojeISO()) : ""}</span></h2>
    <div class="situ">${v}<div class="nums">

        <div class="k"><span>${escH(primeiro(p1))} pagou</span><b>${dinheiro(c.pagou[p1])}</b><small>parte: ${dinheiro(c.total * parte)}</small></div>
        <div class="k"><span>${escH(primeiro(p2))} pagou</span><b>${dinheiro(c.pagou[p2])}</b><small>parte: ${dinheiro(c.total * (1 - parte))}</small></div>
        <div class="k destaque"><span>Total no mês</span><b>${dinheiro(c.total)}</b><small>${doMes} compra${doMes === 1 ? "" : "s"}</small></div>
      </div>
      <div class="linha-k">
        <div class="k"><span>Balança</span><b style="font-size:18px;white-space:normal">${escH(balanca(c, p1, p2))}</b><small>quem pagou mais no mês</small></div>
        <div class="k"><span>Mês passado</span><b>${dinheiro(antes)}</b><small>${antes > 0.005 ? (dif >= 0 ? dinheiro(dif) + " a menos que agora" : dinheiro(-dif) + " a mais que agora") : "sem compras"}</small></div>
        <div class="k destaque"><span>Média por mês</span>${media === null ? nd("nenhum mês fechado ainda") : `<b>${dinheiro(media)}</b><small>${meses.length === 1 ? "1 mês fechado" : `últimos ${meses.length} meses fechados`}</small>`}</div>
      </div>
    </div></div>
  </section>
`;
}

      <div><label>Parte de ${escH(primeiro(p1))} (em %)</label>

      <div><button class="b p" type="submit">Guardar</button></div>

      <div><button class="b p" type="submit">Guardar</button></div>

  return barraMes() + cardCasa(c) + `

      <section class="painel"><h2>Por categoria</h2>${rosca(itensCat, "casa no mês", "Compras da casa por categoria")}</section>
      <section class="painel"><h2>${PERFIL === "ana" ? "Divisão" : "Ajustes"}</h2>${ajustes}</section>
    </div>
  </div>`;
}

// ---------- desenho ----------
function desenhar(){
  document.getElementById("abas").innerHTML =
    ABAS.map(([k, n]) => `<button data-a="${k}" aria-pressed="${k === aba}">${n}</button>`).join("");
  const t = document.getElementById("tela");
  // redesenhar não fecha o formulário aberto na mesma tela (a Clínica pode mudar enquanto ele digita)
  const abertos = [...t.querySelectorAll("details")].map(x => x.open);
  const chaveTela = aba === "carteira" ? aba + ":" + vistaDin : aba;
  const mesma = t.dataset.aba === chaveTela;
  // nem apaga o que ele estava digitando: o Drive ou a Clínica podem mandar redesenhar no meio
  // de um lançamento (01/10/2026). Formulário que acabou de ser enviado volta limpo.
  const digitado = {};
  if (mesma) t.querySelectorAll("form[id]").forEach(f => { if (!f.dataset.limpo) digitado[f.id] = [...f.elements].filter(e => e.name && (e.type !== "radio" || e.checked)).map(e => [e.name, e.value]); });
  t.innerHTML = aba === "tudo" ? telaTudo() : aba === "carteira" ? telaDinheiro() : telaCasa();
  t.dataset.aba = chaveTela;
  if (mesma) t.querySelectorAll("details").forEach((x, i) => { if (abertos[i] && !x.querySelector("form.enviado")) x.open = true; });
  for (const id in digitado) {
    const f = document.getElementById(id); if (!f) continue;
    digitado[id].forEach(([n, v]) => { const e = f.elements[n];
      if (e && (e.tagName !== "SELECT" || [...e.options].some(o => o.value === v))) e.value = v; });
  }
  ligar();
  // no celular as subabas podem passar da largura: a aberta fica sempre à vista
  const sub = t.querySelector(".subabas"), on = sub && sub.querySelector('[aria-pressed="true"]');
  if (on && sub.scrollWidth > sub.clientWidth) sub.scrollLeft = Math.max(0, on.offsetLeft + on.offsetWidth - sub.clientWidth + 8);
}

function ligar(){
  document.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => {
    ref.setMonth(ref.getMonth() + Number(b.dataset.mes)); desenhar();
  });
  // passar o mouse na legenda acende a fatia correspondente da rosca
  document.querySelectorAll(".rosca .leg li").forEach(li => {
    const r = li.closest(".rosca"), f = r.querySelector(`.fatia[data-i="${li.dataset.i}"]`);
    li.onmouseenter = () => { r.classList.add("foco"); if (f) f.classList.add("on"); };
    li.onmouseleave = () => { r.classList.remove("foco"); if (f) f.classList.remove("on"); };
  });
  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (!confirm("Apagar esta linha?")) return;
    const [cad, lista, id] = b.dataset.apagar.split(":");
    if (cad === "casa" && !podeMexer(livro.casa[lista].find(x => x.id === id))) return;
    livro[cad][lista] = livro[cad][lista].filter(x => x.id !== id); salvar(cad);
  });
  // × do gasto fixo: tira o fixo deste mês em diante; os meses que já passaram continuam com o valor que tinham.
  // Antes apagava o fixo de todos os meses e o mês passado mudava de número, sem volta (06/10/2026).
  document.querySelectorAll("[data-apagar-fixo]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const g = livro.matheus.gastosFixos.find(x => x.id === b.dataset.apagarFixo); if (!g) return;
    const km = chaveMes(ref), nome = MESES[ref.getMonth()];
    const antes = g.valores ? Object.keys(g.valores).filter(k => k < km && Number(g.valores[k]) > 0) : [];
    if (antes.length) {
      if (!confirm(`Tirar ${comPonto(g.descricao)} de ${nome} em diante? Os meses anteriores continuam com o valor que tinham.`)) return;
      // zero neste mês (e não vazio) para o mês não oferecer "copiar do mês anterior" de volta
      Object.keys(g.valores).forEach(k => { if (k > km) delete g.valores[k]; }); g.valores[km] = 0;
    } else {
      if (!confirm(`Apagar ${comPonto(g.descricao)}?${g.valores ? "" : " Ele sai de todos os meses, inclusive dos que já passaram."}`)) return;
      livro.matheus.gastosFixos = livro.matheus.gastosFixos.filter(x => x.id !== g.id);
    }
    salvar("matheus");
  });
  // tocar na linha abre o lançamento para alterar (e, de lá, apagar)
  document.querySelectorAll("[data-editar]").forEach(b => {
    const abrir = () => { const [cad, id] = b.dataset.editar.split(":"); alterarLancamento(cad, id); };
    b.onclick = e => { if (!e.target.closest("button,a,input,select")) abrir(); };
    b.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === b) { e.preventDefault(); abrir(); } };
  });
  document.querySelectorAll("[data-valorfixo]").forEach(i => i.onchange = () => {
    const g = livro.matheus.gastosFixos.find(x => x.id === i.dataset.valorfixo); if (!g) return;
    if (!g.valores) g.valores = {};
    const n = FormLancamento.centavos(i.value), k = chaveMes(ref);
    if (n > 0) g.valores[k] = n; else delete g.valores[k];
    salvar("matheus");
  });
  const cf = document.getElementById("copiarFixos");
  if (cf) cf.onclick = () => {
    const km = chaveMes(ref), ant = mesAnterior(km), lista = fixosParaCopiar(km);
    lista.forEach(g => { g.valores[km] = Number(g.valores[ant]); });
    salvar("matheus");
  };
  document.querySelectorAll("[data-dia]").forEach(i => i.onchange = () => {
    const g = livro.matheus.gastosFixos.find(x => x.id === i.dataset.dia);
    if (g) { const n = Number(i.value); g.dia = n >= 1 && n <= 31 ? n : null; salvar("matheus"); }
  });

  const pega = f => Object.fromEntries(new FormData(f));
  const liga = (idForm, fn) => { const f = document.getElementById(idForm); if (f) f.onsubmit = e => { e.preventDefault(); const d = pega(f); f.dataset.limpo = "1"; fn(f, d); }; };

  // ordenar: cabeçalho no computador, caixa de escolha no celular
  document.querySelectorAll("[data-ord]").forEach(b => b.onclick = () => {
    const [qual, c] = b.dataset.ord.split(":"), o = ordem[qual];
    ordem[qual] = o.c === c ? { c, d:-o.d } : { c, d: c === "data" || c === "valor" ? -1 : 1 };
    desenhar();
  });
  document.querySelectorAll("[data-filtrocat]").forEach(s => s.onchange = () => { filtroCat[s.dataset.filtrocat] = s.value; desenhar(); });
  document.querySelectorAll("[data-ordsel]").forEach(s => s.onchange = () => {
    const [c, d] = s.value.split(":"); ordem[s.dataset.ordsel] = { c, d:Number(d) }; desenhar();
  });
  // clicar num mês do gráfico abre aquele mês
  // clicar num mês (no gráfico ou na lista) abre os lançamentos daquele mês
  GraficoMeses.ligar(document.getElementById("tela"), k => { ref = new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1, 1); vistaDin = "mes"; desenhar(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-vd]").forEach(b => b.onclick = () => {
    vistaDin = b.dataset.vd;
    // o fechamento abre no mês que acabou de fechar quando o mês aberto ainda não terminou
    if (vistaDin === "fech" && chaveMes(ref) >= chaveMes(new Date())) { const d = new Date(); ref = new Date(d.getFullYear(), d.getMonth() - 1, 1); }
    desenhar();
  });
  document.querySelectorAll("[data-precisa]").forEach(b => b.onclick = () => irPrecisa(avisosNaTela[Number(b.dataset.precisa)]));
  document.querySelectorAll("[data-fech]").forEach(b => b.onclick = () => {
    const k = b.dataset.fech;
    ref = new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1, 1);
    aba = "carteira"; vistaDin = "fech";
    try { location.hash = aba; } catch(e){}
    desenhar(); window.scrollTo(0, 0);
  });

  // o formulário único de lançamento (lancamento.js) entra em cada lugar marcado na tela
  document.querySelectorAll("[data-lanc]").forEach(el => FormLancamento.montar(el, configLancamento(el.dataset.lanc || null)));
  vigiarFab();
  liga("fFixo", (f, d) => {
    const v = FormLancamento.centavos(d.valor); if (!(v > 0)) { alert("Falta o valor."); return; }
    const valores = {};
    for (let m = ref.getMonth(); m < 12; m++) valores[ref.getFullYear() + "-" + String(m + 1).padStart(2, "0")] = v;
    livro.matheus.gastosFixos.push({ id:novoId(), descricao:d.descricao, categoria:d.categoria, dia:Number(d.dia), valores });
    salvar("matheus"); });
  liga("fPend", (f, d) => {
    const total = FormLancamento.centavos(d.total), pago = FormLancamento.centavos(d.pago);
    if (!(total > 0)) { alert("Falta o valor total."); return; }
    if (pago > total + 0.005) { alert("O que já foi pago passa do valor total."); return; }
    pendencias().push({ id:novoId(), nome:d.nome.trim(), tipo:d.tipo === "pagar" ? "pagar" : "receber", origem:(d.origem || "").trim(),
      inicio:d.inicio || "", fim:"", total, pago, obs:(d.obs || "").trim() });
    salvar("matheus"); });
  // campo de dinheiro em que a vírgula anda sozinha (o mesmo jeito do formulário de lançamento)
  document.querySelectorAll("[data-dinheiro]").forEach(i => i.oninput = () => { const v = FormLancamento.mascara(i.value); if (i.value !== v) i.value = v; });
  liga("fLimite", (f, d) => { const v = FormLancamento.centavos(d.valor); if (!d.categoria || !(v > 0)) return; limites()[d.categoria] = v; salvar("matheus"); });
  document.querySelectorAll("[data-limite-x]").forEach(b => b.onclick = () => { delete limites()[b.dataset.limiteX]; salvar("matheus"); });
  const daPend = id => pendencias().find(p => p.id === id);
  document.querySelectorAll("[data-pend-pago]").forEach(b => b.onclick = () => {
    const p = daPend(b.dataset.pendPago); if (!p) return;
    const t = prompt(`Quanto ${p.tipo === "receber" ? "você recebeu" : "você pagou"} agora? Faltam ${dinheiro(restantePend(p))}.`);
    if (t === null) return;
    const v = lerValorBR(t);
    if (!(v > 0)) { alert("Não entendi o valor."); return; }
    if (v > restantePend(p) + 0.005 && !confirm(`${dinheiro(v)} passa do que falta (${dinheiro(restantePend(p))}). Registrar assim mesmo?`)) return;
    p.pago = Math.round(((Number(p.pago) || 0) + v) * 100) / 100;
    if (restantePend(p) < 0.005) { p.quitada = true; p.fim = p.fim || hojeISO(); }
    salvar("matheus");
  });
  document.querySelectorAll("[data-pend-quitar]").forEach(b => b.onclick = () => {
    const p = daPend(b.dataset.pendQuitar); if (!p) return;
    if (!confirm(`Quitar a pendência de ${p.nome}? Fica guardada em Quitadas.`)) return;
    p.quitada = true; p.fim = p.fim || hojeISO(); salvar("matheus");
  });
  document.querySelectorAll("[data-pend-reabrir]").forEach(b => b.onclick = () => {
    const p = daPend(b.dataset.pendReabrir); if (!p) return;
    // paga por inteiro: reabrir só faz sentido zerando o que foi pago, então pergunta antes (antes zerava calado)
    if (restantePend(p) < 0.005 && Number(p.pago) > 0 && !confirm(`Já foram pagos ${dinheiro(Number(p.pago))}. Reabrir zera esse valor. Continuar?`)) return;
    delete p.quitada; if (restantePend(p) < 0.005) p.pago = 0; salvar("matheus");
  });
  document.querySelectorAll("[data-pend-apagar]").forEach(b => b.onclick = () => {
    const p = daPend(b.dataset.pendApagar); if (!p || !confirm(`Apagar a pendência de ${p.nome}?`)) return;
    livro.matheus.pendencias = pendencias().filter(x => x.id !== p.id); salvar("matheus");
  });
  const bp = document.getElementById("pendPlanilha"), ap = document.getElementById("pendArquivo");
  if (bp && ap) {
    bp.onclick = () => ap.click();
    ap.onchange = async e => {
      const f = e.target.files[0]; e.target.value = ""; if (!f) return;
      try { const r = await importarPendencias(f); salvar("matheus");
        alert(r.novas ? `Vieram ${r.novas} pendência${r.novas === 1 ? "" : "s"} da planilha${r.repetidas ? " (" + r.repetidas + " já estavam aqui)" : ""}.` : "Nenhuma pendência nova: as da planilha já estavam aqui."); }
      catch(err){ alert("Não consegui ler: " + err.message); }
    };
  }
  liga("fReserva", (f, d) => { livro.matheus.reserva = { saldoBase:FormLancamento.centavos(d.saldoBase),
    dataBase:d.dataBase || null, meta:FormLancamento.centavos(d.meta) }; salvar("matheus"); });
  liga("fDivisao", (f, d) => { const n = Number(d.divisao); livro.casa.divisao = Math.min(Math.max(Number.isFinite(n) && String(d.divisao).trim() !== "" ? n : 50, 0), 100) / 100; salvar("casa"); });
  liga("fPessoas", (f, d) => {
    const antigos = livro.casa.pessoas.slice(), novos = [d.p1.trim(), d.p2.trim()];
    // dois nomes iguais juntariam as compras das duas pessoas numa só, sem volta
    if (!novos[0] || !novos[1] || novos[0].toLowerCase() === novos[1].toLowerCase()) { alert("Os dois nomes precisam ser diferentes."); return; }
    // quem já comprou continua sendo a mesma pessoa, com o nome novo. Nome que já existia fica com as compras
    // dele: só trocar a ordem dos dois nomes não troca mais quem comprou o quê (06/10/2026)
    const saem = antigos.filter(n => !novos.includes(n)), chegam = novos.filter(n => !antigos.includes(n));
    const troca = {}; saem.forEach((n, i) => { if (chegam[i]) troca[n] = chegam[i]; });
    livro.casa.lancamentos.forEach(l => { if (troca[l.quem]) l.quem = troca[l.quem]; });
    livro.casa.pessoas = novos; salvar("casa");
  });
}

let fabObs = null;
function vigiarFab(){
  const fab = document.getElementById("fab"), alvo = document.querySelector("[data-lanc]");
  if (fabObs) fabObs.disconnect();
  if (!alvo || !("IntersectionObserver" in window)) return;
  fabObs = new IntersectionObserver(es => fab.classList.toggle("fora", es[es.length - 1].isIntersecting));
  fabObs.observe(alvo);
}
// abre o formulário de lançamento da tela em que ele está e leva até ele. É o que o botão + faz:
// o do celular e, na casca, o + que escolhe entre lançamento e recebimento (06/10/2026)
function abrirLancamento(){
  const k = abaDoEndereco(); if (k && k !== aba) { aba = k; desenhar(); }   // a casca pode ter acabado de trocar a tela
  // nas telas de fixos, pendências e mês a mês não há formulário: o botão volta para os lançamentos

  const el = document.querySelector("[data-lanc]"); if (!el) return;
  FormLancamento.abrir(configLancamento(el.dataset.lanc || null));
  desenhar();
  const novo = document.querySelector("[data-lanc]"); if (novo) novo.scrollIntoView({ block:"start", behavior:"smooth" });
}

function importarCadernos(j){
  // a cópia da semana no Drive é o próprio caderno, sem o envelope do "Exportar dados"
  if (j && j.caderno === "dinheiro" && !j.dinheiro) j = { dinheiro:j };
  else if (j && j.caderno === "casa" && !j.casa) j = { casa:j };
  const vem = [];
  if (j.dinheiro && Array.isArray(j.dinheiro.lancamentos)) vem.push(["matheus", j.dinheiro, `${j.dinheiro.lancamentos.length} lançamentos e ${(j.dinheiro.gastosFixos || []).length} gastos fixos`]);
  if (j.casa && Array.isArray(j.casa.lancamentos)) vem.push(["casa", j.casa, `${j.casa.lancamentos.length} compras da casa`]);
  if (!vem.length) throw new Error("o arquivo não tem caderno de dinheiro nem de casa");
  if (!confirm("Isto substitui o que está no app por: " + vem.map(v => v[2]).join(" e ") + ". Seguir?")) return;
  vem.forEach(([c, d]) => { livro[c] = arrumar[c](Object.assign(VAZIO[c](), d)); armazem.gravar(c, livro[c]); });
  desenhar();
}

// O controle da Ana (ana.html) lança na Casa por aqui, sem sair da tela dos gastos dela (01/10/2026).
window.casaParaFora = {
  pessoas: () => livro.casa.pessoas.slice(),
  categorias: () => CAT_CASA.slice(),
  grupos: () => Categorias.GRUPOS_CASA,
  // devolve o id, para o "Desfazer" do formulário
  lancar: d => { const id = novoId(); livro.casa.lancamentos.push({ id, data:d.data, quem:d.quem, descricao:(d.descricao || "").trim() || "-",
    categoria:d.categoria, valor:Number(d.valor) }); salvar("casa"); return id; },
  desfazer: id => { livro.casa.lancamentos = livro.casa.lancamentos.filter(x => x.id !== id); salvar("casa"); }
};

try { const t = localStorage.getItem("cu-tema"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
{ const k = abaDoEndereco(); if (k) aba = k; }
// Dentro do controle da Ana só a Casa está aberta: "Importar dados" trocaria o caderno da casa inteiro
// por um arquivo, e "Exportar dados" sairia com o caderno do dinheiro vazio. Fica só a planilha.
if (PERFIL === "ana") ["exportarJson", "importarJson"].forEach(id => { const b = document.getElementById(id); if (b) b.hidden = true; });
// Dentro da casca quem manda nas abas é a barra de cima: a daqui sairia repetida.
try { if (window.top !== window.self) document.getElementById("abas").hidden = true; } catch(e){}
desenhar();
Nuvem.iniciar();
</script>
