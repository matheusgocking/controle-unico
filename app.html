<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinheiro e Casa · Controle Único</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="tema.css">
<style>
/* toque: o navegador não espera para ver se é duplo toque, e o dedo acerta o alvo */
button,a,summary,select,input,label{touch-action:manipulation}
/* Mesmo desenho da Clínica e da Carteira (27/09/2026): fundo cinza-azulado, painéis brancos
   de borda fina, números em negrito e gráficos em rosca. O jeito de app fica só no celular. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:4px 24px 56px}
.hidden{display:none !important}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.nota{font-size:12.5px;color:var(--faint)}
.vazio{color:var(--muted);font-size:14px;padding:8px 0}

/* topo: marca, estado do Drive, tema */
.topo{max-width:1200px;margin:0 auto;padding:12px 24px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.marca{font-weight:700;margin-right:auto}
.nuvem{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.nuvem-ponto{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.nuvem-ponto.ok{background:#2f9e5b} .nuvem-ponto.indo{background:#d49a1c} .nuvem-ponto.erro{background:#d0453a}
#nuvem-acoes{display:flex;gap:6px;flex-wrap:wrap}
#nuvem-texto{flex:1 1 0;min-width:0}
nav.abas{display:flex;gap:4px;margin:12px 0 4px}
nav.abas button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer}
nav.abas button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}

/* botões */
.b{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-size:14px}
.b:hover{border-color:var(--faint)}
.b.p{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.b.s{font-size:13px;padding:5px 10px}
.redondo{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:17px}

/* mês */
.mes{display:flex;align-items:center;gap:10px;margin:10px 0 16px}
.mes h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;text-transform:capitalize;min-width:170px;text-align:center}
.mes h1 span{color:var(--faint);font-weight:400}

/* painéis */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.painel h2{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.painel h2 .dir{margin-left:auto;font-weight:400;font-size:13px;color:var(--faint)}
.duas{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-top:18px}
.duas.igual{grid-template-columns:1fr 1fr}
.duas.larga{grid-template-columns:1.75fr 1fr;align-items:start}
.duas.inv{grid-template-columns:1fr 1.35fr}
.coluna{display:grid;gap:18px;align-content:start;min-width:0}

/* situação do mês */
.situ{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:stretch}
.situ > .veredito{order:2}   /* no HTML vem primeiro (é o que se lê primeiro no celular); no computador fica à direita */
.situ > .nums{min-width:0}
.linha-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.linha-k + .linha-k{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.k span{display:block;color:var(--muted);font-size:13px}
.k b{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:2px;white-space:nowrap}
.k small{display:block;color:var(--faint);font-size:12px;margin-top:3px}
.k.destaque b{font-size:32px}
.k .pct-k{display:inline-block;font-style:normal;font-size:11.5px;font-weight:600;margin:4px 0 2px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.k .pct-k.neg{background:var(--neg-soft);color:var(--neg)}
.veredito{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--surface-2)}
.veredito.pos{background:var(--pos-soft)} .veredito.neg{background:var(--neg-soft)} .veredito.warn{background:var(--warn-soft)}
.veredito .topo-v{display:flex;align-items:center;gap:12px}
.seta{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface)}
.seta svg{width:26px;height:26px}
.veredito b{font-size:19px;line-height:1.2}
.veredito p{margin:0;font-size:13.5px;color:var(--text)}
.veredito.pos b,.veredito.pos .seta{color:var(--pos)} .veredito.neg b,.veredito.neg .seta{color:var(--neg)} .veredito.warn b,.veredito.warn .seta{color:var(--warn)}

/* rosca */
.rosca{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
.rosca > svg{width:170px;height:170px;display:block}
.rosca .centro1{fill:var(--muted);font-size:11px;font-family:var(--font)}
.rosca .centro2{fill:var(--text);font-size:16px;font-weight:700;font-family:var(--font)}
.fatia{transition:opacity .12s}
.rosca > svg:hover .fatia:not(:hover),.rosca.foco .fatia:not(.on){opacity:.35}
.leg{list-style:none;margin:0;padding:0;font-size:14px}
.leg li{display:flex;gap:8px;align-items:baseline;padding:5px 4px;border-top:1px solid var(--line);border-radius:4px}
.leg li:first-child{border-top:0}
.leg li:hover{background:var(--surface-2)}
.leg i{width:10px;height:10px;border-radius:3px;flex:none;align-self:center}
.leg .n{flex:1;min-width:0}
.leg .n small{display:block;color:var(--faint);font-size:11.5px;white-space:normal}
.leg b{font-weight:600;white-space:nowrap}
.leg .pc{color:var(--faint);font-size:12px;min-width:44px;text-align:right}
/* rosca em painel estreito (coluna da direita): o gráfico em cima e a legenda embaixo */
.painel{container-type:inline-size}
@container (max-width:460px){ .rosca{grid-template-columns:minmax(0,1fr);justify-items:center} .leg{width:100%;min-width:0} }
.leg .n{overflow-wrap:anywhere}
.partes .pt-total span{display:block;color:var(--muted);font-size:13px}
.partes .pt-total b{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em}
.pilha{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px;background:var(--surface-2)}
.pilha i{display:block;height:100%;min-width:3px}
.meta-r{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.meta-r .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.meta-r .l1 b{color:var(--text);font-size:14px}
.meta-r small{display:block;color:var(--faint);font-size:12px;margin-top:4px}
.selo-b{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--text)}

/* números soltos (como na Clínica) */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-width:0}
.painel .stat{background:var(--surface-2);border-color:transparent}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;color:var(--faint);font-size:11.5px}
.stats.duas-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.trilho{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.painel .stat .trilho{background:var(--line)}
.trilho i{display:block;height:100%;background:var(--c3);border-radius:3px}

/* tabelas */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:0 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th:first-child,table.t td:first-child{padding-left:0}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t .dir{text-align:right;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface-2)}
td.c-data{color:var(--muted);white-space:nowrap;width:1%}
td.c-desc b{font-weight:500}
td.c-cat,td.c-forma{color:var(--muted)}
td.c-val{font-weight:600}
td.c-val.pos{color:var(--pos)}
td.c-x{width:1%}
table.t input{width:84px;padding:5px 8px;text-align:right}
table.t input.dia{width:58px}
.so-cel{display:none}
.fx-sit{display:block;font-size:11.5px;color:var(--faint)}
.fx-sit.ok{color:var(--muted)} .fx-sit.vai{color:var(--warn);font-weight:600}
tr.fx-fora td.c-desc b,tr.fx-fora td.c-cat{color:var(--faint)}
.quem{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.quem i{width:9px;height:9px;border-radius:50%}
.x{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
.x:hover{color:var(--neg)}
.x.lapis{font-size:14px} .x.lapis:hover{color:var(--accent)}
td.c-x{white-space:nowrap}
tr.clic{cursor:pointer}
tr.clic:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* pendências: uma linha por dívida, com quem, quanto falta e os botões */
.pd-grupo{margin:14px 0 4px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:10px;align-items:baseline}
.pd-grupo span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--text);font-size:14px}
.pd{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pd b{font-weight:600} .pd span{display:block;font-size:12px;color:var(--muted)}
.pd .pd-quem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .pd-val{text-align:right;white-space:nowrap}
.pd .pd-acoes{display:flex;gap:6px;align-items:center}
.pd.feita b{color:var(--muted);font-weight:500}
.pd .trilho{margin-top:4px}
details.pd-fechadas{margin-top:12px} details.pd-fechadas summary{cursor:pointer;font-size:13px;color:var(--muted)}
@container (max-width:560px){ .pd{grid-template-columns:minmax(0,1fr) auto} .pd .pd-acoes{grid-column:1 / -1} }
/* as vistas do Dinheiro (01/10/2026): Lançamentos, Gastos fixos, Pendências e Mês a mês, cada uma na sua tela */
.subabas{display:flex;gap:2px;margin:12px 0 4px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;scrollbar-width:none}
.subabas::-webkit-scrollbar{display:none}
.subabas button{border:0;background:transparent;color:var(--muted);padding:9px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.subabas button:hover{color:var(--text)}
.subabas button[aria-pressed="true"]{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--text)}
.subabas button em{font-style:normal;font-size:11.5px;font-weight:600;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.stats.tres{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.bloco{margin-top:18px}
.fx-grupos > .bloco:first-child{margin-top:0}
/* as tabelas dos grupos de fixos com as mesmas colunas, para um grupo alinhar com o outro */
table.fixos{table-layout:fixed}
.painel + .lanc{margin-top:16px}
.aviso-fx{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.aviso-fx p{margin:0}
table.fixos th:nth-child(2){width:30%} table.fixos th:nth-child(3){width:90px} table.fixos th:nth-child(4){width:170px} table.fixos th:nth-child(5){width:30px}
details.fx-fora-d > summary{cursor:pointer;font-size:14px;color:var(--muted)}
details.fx-fora-d[open] > summary{margin-bottom:12px}
/* mês a mês em lista: um mês por linha, com o que sobrou à direita */
.hm{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 4px;cursor:pointer;border-radius:0}
.hm:first-child{border-top:0}
.hm:hover{background:var(--surface-2)}
.hm .hm-m{font-weight:600;text-transform:capitalize}
.hm .hm-d{color:var(--muted);font-size:13px}
.hm b{white-space:nowrap}
.hm b small{font-weight:400;color:var(--faint);font-size:12px;margin-right:6px}
/* formulários atrás de um botão */
details.novo{margin:0 0 12px}
details.novo > summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--radius);font-size:14px}
details.novo > summary:hover{border-color:var(--faint)}
details.novo > summary::-webkit-details-marker{display:none}
details.novo[open] > summary{margin-bottom:10px}
form.linha{background:var(--surface-2);border-radius:var(--radius);padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}
/* a escolha Pessoal ou Casa dentro do formulário único de lançamento (01/10/2026) */
.chave{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.chave button{border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:7px;cursor:pointer;font-size:14px}
.chave button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
/* ordenar a lista: no computador pelo cabeçalho, no celular por uma caixa de escolha */
th .ord{border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer}
th .ord:hover{color:var(--text)}
th .ord[aria-pressed="true"]{color:var(--text);font-weight:700}
.ordem-cel{display:none;margin:0 0 6px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ordem-cel select{width:auto;flex:1;padding:6px 8px}
.filtro-cat{display:flex;margin:0 0 6px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.filtro-cat select{width:auto;flex:0 1 240px;min-width:0;padding:6px 8px}
.filtro-cat span{color:var(--text);font-weight:600;white-space:nowrap}
.fe-al{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fe-al li,.fe-cat li{color:var(--text)}
.fe-al li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.fe-al li i{flex:none;width:9px;height:9px;border-radius:99px;background:var(--faint);transform:translateY(-1px)}
.fe-al li.warn i{background:var(--warn)} .fe-al li.pos i{background:var(--pos)}
.fe-cat{list-style:none;margin:0;padding:0}
.fe-cat li{display:grid;grid-template-columns:minmax(0,1fr) auto 108px;gap:2px 12px;align-items:baseline;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.fe-cat li:first-child{border-top:0}
.fe-cat .n{min-width:0;overflow-wrap:anywhere} .fe-cat .n small{display:block;color:var(--muted);font-size:12px}
.fe-cat b{white-space:nowrap;font-weight:600} .fe-cat li > small{white-space:nowrap;color:var(--muted);font-size:12.5px;text-align:right}
.fe-cat li.warn > small{color:var(--warn);font-weight:600} .fe-cat li.pos > small{color:var(--pos);font-weight:600}
.fe-cat li:not(:has(> small)){grid-template-columns:minmax(0,1fr) auto}
.fe-aviso{margin-bottom:16px}
/* O que precisa de você (aba Tudo) */
.pv{margin-bottom:16px}
.pv h2{margin-bottom:8px}
.pv-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--neg-soft);color:var(--neg);font-weight:700;font-size:12px}
.pv-l{list-style:none;margin:0;padding:0}
.pv-l li{border-top:1px solid var(--line)} .pv-l li:first-child{border-top:0}
.pv-i{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;border-radius:8px}
.pv-i:hover{background:var(--surface-2)}
.pv-i > i{flex:none;width:10px;height:10px;border-radius:99px;background:var(--faint)}
.pv-l li.urgente .pv-i > i{background:var(--neg)} .pv-l li.atencao .pv-i > i{background:var(--warn)}
.pv-t{flex:1;min-width:0;display:grid;gap:2px}
.pv-t b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.pv-t small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pv-t small em{font-style:normal;font-weight:600;color:var(--text)}
.pv-seta{flex:none;width:18px;height:18px;color:var(--faint)}
.pv-mais summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 4px}
.pv-mais .pv-l{border-top:1px solid var(--line)}
.pv-nota{margin:6px 0 0}
.pv-ok{padding-block:12px}
.pv-ok p{margin:0;display:flex;align-items:center;gap:10px;font-size:14px}
.pv-ok b{font-weight:600}
.pv-ok-i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--pos-soft);color:var(--pos);font-size:13px;font-weight:700}
.k small.pos{color:var(--pos);font-weight:600} .k small.warn{color:var(--warn);font-weight:600}
.lim{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:12px}
.lim li{display:grid;gap:4px}
.lim .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.lim .l1 b{font-weight:600} .lim .l1 span{white-space:nowrap;color:var(--muted);font-size:13px}
.lim .trilho{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.lim .trilho i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.lim .perto .trilho i{background:var(--warn)} .lim .passou .trilho i{background:var(--neg)}
.lim .l2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.lim .perto .l2 b{color:var(--warn)} .lim .passou .l2 b{color:var(--neg)}
.lim .l2 button{border:0;background:transparent;color:var(--faint);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
details.origem{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.6}
details.origem summary{cursor:pointer;color:var(--faint)}
.pe{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* dentro da casca: o botão de entrar, a marca, o tema e as abas ficam na barra de cima */
.na-casca #nuvem-entrar,.na-casca .marca,.na-casca #tema,.na-casca nav.abas{display:none !important}

@media (max-width:960px){
  .duas,.duas.igual,.duas.larga,.duas.inv{grid-template-columns:1fr}
  .situ{grid-template-columns:1fr;gap:16px}
  .situ > .veredito{order:0}
}
/* ---------- celular: aqui sim, jeito de app ---------- */
@media (max-width:700px){
  .topo{padding:6px 12px}
  .wrap{padding:0 12px 48px}
  .mes{justify-content:space-between;margin:8px 0 12px}
  .mes h1{font-size:19px;min-width:0}

<script>
// ===================================================================
// Dinheiro e Casa. Dois cadernos, cada um num arquivo do Google Drive:
// "Controle Único - dinheiro.json" (só dele) e "Controle Único - casa.json"
// (dele e da pessoa com quem divide a casa). A aba Tudo junta os dois com a Clínica e a Carteira,
// que moram em páginas próprias dentro da mesma casca (index.html).
// As contas seguem os sistemas do Vault: Ciclo do Dinheiro do Mês e Ciclo da Sessão.
// Este arquivo é público: nenhum dado pessoal fica escrito aqui.
// ===================================================================

// Fora da casca, esta página não tem a Clínica ao lado para a aba Tudo: abre pela casca.
if (window.top === window.self) location.replace("index.html" + (location.hash || "#tudo"));

// As listas e a troca dos nomes antigos (com ponto final, como nas planilhas) moram em categorias.js.
const CATEGORIAS = Categorias.DINHEIRO;
const CAT_CASA   = Categorias.CASA;
const TIPOS      = Categorias.TIPOS;
const FORMAS     = Categorias.FORMAS;
// todo caderno que chega (do aparelho, do Drive ou de um arquivo) passa pela troca de nomes
const arrumar = { matheus: Categorias.cadernoDinheiro, casa: Categorias.cadernoCasa };

const VAZIO = {
  matheus: () => ({ versao:1, caderno:"dinheiro", atualizadoEm:null, lancamentos:[], gastosFixos:[],
                    reserva:{ saldoBase:0, dataBase:null, meta:0 }, pendencias:[] }),
  casa:    () => ({ versao:1, caderno:"casa", atualizadoEm:null, lancamentos:[], pessoas:["Pessoa 1","Pessoa 2"], divisao:0.5 })
};
const NOME_DRIVE = { matheus:"Controle Único - dinheiro.json", casa:"Controle Único - casa.json" };
const ID_NUVEM   = { matheus:"dinheiro", casa:"casa" };

// ---------- armazenamento: cache no navegador + caderno no Google Drive ----------
const chaveCache = c => "controle-unico-" + ID_NUVEM[c] + "-cache";
const armazem = {
  ler(c){ try { const t = localStorage.getItem(chaveCache(c)); return t ? JSON.parse(t) : null; } catch(e){ return null; } },
  gravar(c, d){ d.atualizadoEm = new Date().toISOString();
    try { localStorage.setItem(chaveCache(c), JSON.stringify(d)); } catch(e){}
    if (nuvem[c]) nuvem[c].mudou(); }
};

const livro = {};
for (const c of Object.keys(VAZIO)) livro[c] = arrumar[c](Object.assign(VAZIO[c](), armazem.ler(c) || {}));
function salvar(c){ armazem.gravar(c, livro[c]); desenhar(); }

// Dentro do controle da Ana (ana.html), esta página só serve a Casa: o caderno do dinheiro dele
// não é aberto nem criado no Google dela (30/09/2026).
const PERFIL = (() => { try { return window.top.PERFIL || ""; } catch(e){ return ""; } })();
const nuvem = {};
for (const c of (PERFIL === "ana" ? ["casa"] : Object.keys(VAZIO))) {
  nuvem[c] = Nuvem.caderno({
    id: ID_NUVEM[c], nome: NOME_DRIVE[c], rotulo: c === "casa" ? "o caderno da Casa" : "o caderno do Dinheiro",
    compartilhado: c === "casa",
    obter: () => livro[c],
    aplicar: d => { livro[c] = arrumar[c](Object.assign(VAZIO[c](), d)); try { localStorage.setItem(chaveCache(c), JSON.stringify(livro[c])); } catch(e){} desenhar(); },
    temDados: d => !!(d && ((d.lancamentos && d.lancamentos.length) || (d.gastosFixos && d.gastosFixos.length)))
  });
}

// ---------- utilidades ----------
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
let aba = "tudo";
let ref = new Date(); ref.setDate(1);
const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const dinheiro = v => (Number(v) || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const chaveMes = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const noMes = l => (l.data || "").slice(0, 7) === chaveMes(ref);
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const soma = (a, f) => a.reduce((s, x) => s + (Number(f ? f(x) : x) || 0), 0);
const escH = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const dia = d => (d || "").slice(8,10) + "/" + (d || "").slice(5,7);
const primeiro = n => String(n || "").split(" ")[0];
// Gasto fixo guarda o valor de cada mês ("2026-07": 509), como a aba Gastos Fixos da planilha:
// há conta de todo mês e conta de um mês só (anuidade, assinatura anual).
const valorFixo = (g, chave) => g.valores ? (Number(g.valores[chave]) || 0) : (Number(g.valor) || 0);
// Fixo com dia 29, 30 ou 31 num mês mais curto cobra no último dia do mês (antes, no dia 30 de um
// mês de 30 dias, o fixo do dia 31 ficava em "Ainda vai sair" até o mês acabar). 0 = sem dia marcado.
const ultimoDia = km => new Date(Number(km.slice(0, 4)), Number(km.slice(5, 7)), 0).getDate();
const diaFixo = (g, km) => Number(g.dia) > 0 ? Math.min(Number(g.dia), ultimoDia(km)) : 0;
// valor guardado (número) para o campo com a vírgula automática ("509,00")
const valorCampo = v => Number(v) > 0 ? FormLancamento.mascara(Number(v).toFixed(2)) : "";
const lerLocal = k => { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch(e){ return null; } };

// ---------- o que vem das outras páginas ----------
// A Clínica mora em clinica.html, carregada ao lado desta pela casca. A aba Tudo pergunta
// os números do mês à própria Clínica, para as duas telas nunca discordarem.
function janelaClinica(){
  try {
    const f = window.parent.document.getElementById("q-clinica");
    const w = f && f.contentWindow;
    if (w && typeof w.numerosDoMes === "function" && w.dados && w.dados.pacientes) return w;
  } catch(e){}
  return null;
}
function contasClinica(){
  const w = janelaClinica();
  // Regra de Matheus (27/09/2026): o que entrou no mês é tudo; o que falta receber compara
  // só pacientes com pacientes. Empréstimos e acertos vêm da planilha com origem Pendência. ou Extra.
  // no caderno da Clínica a origem do dinheiro fica em "receita" ("origem" diz de onde veio o registro)
  const dePaciente = g => !g.receita || g.receita === "Prática Clínica.";
  if (w) {
    const mes = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const n = w.numerosDoMes(mes), doMes = w.pagamentosDoMes(mes);
    const pacientes = soma(doMes.filter(dePaciente), g => g.valor);
    return { ok:true, ativos:w.dados.pacientes.filter(p => !(w.encerradoHoje && w.encerradoHoje(p))).length, previsto:n.previsto, previstoTriagem:n.previstoTriagem || 0, recebido:n.recebido, pacientes,
             falta:Math.max(n.previsto - pacientes, 0), sessoes:n.sessoes, aConfirmar:n.aConfirmar || 0 };
  }
  // Sem a Clínica aberta: o recebido sai do caderno guardado neste aparelho; o previsto não.
  const c = lerLocal("controle-unico-clinica-cache");
  const doMes = c ? (c.pagamentos || []).filter(noMes) : [];
  return { ok:false, ativos:c ? (c.pacientes || []).length : null, previsto:null, recebido:soma(doMes, g => g.valor),
           pacientes:soma(doMes.filter(dePaciente), g => g.valor), falta:null, sessoes:null };
}
// A Carteira grava o total de cada visita (cripto-v1-visita) neste mesmo navegador.
function carteiraAgora(){
  const v = lerLocal("cripto-v1-visita");
  return v && typeof v.total === "number" ? { total:v.total, t:v.t } : null;
}

// ---------- contas ----------
// Regra do sistema Ciclo do Dinheiro do Mês: a casa entra no financeiro
// dele só pelo que ELE pagou, no lugar da categoria Moradia.
// A divisão da casa (0 a 1). 0 é um valor válido; só um valor ausente ou estranho volta para metade.
function parteCasa(){
  const n = Number(livro.casa.divisao);
  return Number.isFinite(n) && n >= 0 && n <= 1 ? n : 0.5;
}
function contasCasa(km = chaveMes(ref)){
  const doMes = livro.casa.lancamentos.filter(l => (l.data || "").slice(0, 7) === km);
  const total = soma(doMes, l => l.valor);
  const parte = parteCasa();
  const metade = total * parte;
  const pagou = {}, dif = {};
  livro.casa.pessoas.forEach((p, i) => {
    pagou[p] = soma(doMes.filter(l => l.quem === p), l => l.valor);
    // a primeira pessoa responde por "parte" do total e a segunda pelo resto
    dif[p] = pagou[p] - total * (i === 0 ? parte : 1 - parte);
  });
  return { total, metade, pagou, dif };
}

// Matheus, 25/09/2026: a metade serve para mostrar quem pagou mais e quem pagou menos,
// não para acertar contas. Quem ficou atrás costuma pagar mais nas compras seguintes.
function balanca(c, p1, p2){
  if (c.dif[p1] < -0.005) return `${primeiro(p1)} está ${dinheiro(-c.dif[p1])} atrás`;
  if (c.dif[p2] < -0.005) return `${primeiro(p2)} está ${dinheiro(-c.dif[p2])} atrás`;
  return "empatado";
}

function contasDinheiro(){
  const doMes = livro.matheus.lancamentos.filter(noMes);
  const cl = contasClinica();
  const casa = contasCasa();
  const minhaCasa = casa.pagou[livro.casa.pessoas[0]] || 0;

  const receitaSolta = soma(doMes.filter(l => l.tipo === "Receita"), l => l.valor);
  const entrou = receitaSolta + cl.recebido;
  // Moradia fica de fora para não contar duas vezes: ela vem da casa.
  // Os gastos fixos do mês contam como despesa do mês, como na planilha.
  const km = chaveMes(ref), agora = new Date(), kHoje = chaveMes(agora);
  const fixosDoMes = livro.matheus.gastosFixos.filter(g => valorFixo(g, km) > 0);
  // Mês futuro: nenhum fixo saiu ainda, todos ficam em "Ainda vai sair" (antes entravam em "Gastei"
  // como se já tivessem sido pagos, e a tela Gastos fixos dizia o contrário).
  const faltaSair = km === kHoje ? soma(fixosDoMes.filter(g => diaFixo(g, km) > agora.getDate()), g => valorFixo(g, km))
    : km > kHoje ? soma(fixosDoMes, g => valorFixo(g, km)) : null;
  const semDia = fixosDoMes.filter(g => !Number(g.dia)).length;
  // No mês corrente, o fixo cujo dia ainda não chegou fica só em "Ainda vai sair": antes ele entrava
  // também em "Gastei" e era descontado duas vezes no fim do mês (corrigido em 01/10/2026).
  // Fixo sem dia marcado conta como já pago.
  const fixosMes = soma(fixosDoMes, g => valorFixo(g, km)) - (faltaSair || 0);
  const saiu = soma(doMes.filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia"), l => l.valor) + fixosMes + minhaCasa;

  // Aporte e resgate mexem sempre na reserva, seja qual for a categoria (01/10/2026).
  const r = livro.matheus.reserva;
  const desde = r.dataBase || "0000-00-00";
  const movReserva = livro.matheus.lancamentos.filter(l => (l.data || "") >= desde);
  const reserva = (Number(r.saldoBase) || 0)
    + soma(movReserva.filter(l => l.tipo === "Aporte"), l => l.valor)
    - soma(movReserva.filter(l => l.tipo === "Resgate"), l => l.valor);

  // Como na linha Total do painel da planilha: o que foi para a reserva saiu do caixa do mês,
  // o que voltou dela entrou. Assim, tirar da reserva e gastar deixa o saldo do mês no lugar.
  const aportesMes = soma(doMes.filter(l => l.tipo === "Aporte"), l => l.valor);
  const resgatesMes = soma(doMes.filter(l => l.tipo === "Resgate"), l => l.valor);
  // arredondado ao centavo: a soma de decimais no computador deixava −0,00000000000006 e o mês "fechava negativo em R$ 0,00"
  const sobra = Math.round((entrou - saiu - aportesMes + resgatesMes) * 100) / 100;
  // mês que já acabou fecha no que fechou; o que os pacientes ficaram devendo aparece à parte (06/10/2026)
  const fimDoMes = km < kHoje ? sobra : Math.round((sobra + (cl.falta || 0) - (faltaSair || 0)) * 100) / 100;
  return { entrou, receitaSolta, recebidoClinica: cl.recebido, dePacientes: cl.pacientes, saiu, minhaCasa, fixosMes, faltaSair, semDia, reserva,
           aportesMes, resgatesMes, sobra, falta: cl.falta, clinicaOk: cl.ok, fimDoMes, passado: km < kHoje };
}

// Entrou e saiu em cada mês, para o gráfico do Dinheiro (01/10/2026). As mesmas regras do mês
// aberto: entrou é receita solta mais tudo o que a Clínica recebeu; saiu é despesa lançada sem
// Moradia, mais os fixos do mês, mais o que ele pagou na casa.
function pagamentosClinica(){
  const w = janelaClinica(), cache = w ? null : lerLocal("controle-unico-clinica-cache");
  return w ? w.dados.pagamentos || [] : (cache && cache.pagamentos) || [];
}
const doK = k => l => (l.data || "").slice(0, 7) === k;
function serieMeses(){
  const pags = pagamentosClinica();
  return GraficoMeses.meses(12, chaveMes(ref)).map(k => mesDinheiro(k, pags));
}
// Um mês do Dinheiro pela chave ("2026-09"), com as regras de serieMeses. Serve também ao Fechamento.
function mesDinheiro(k, pags = pagamentosClinica()){
  const eu = livro.casa.pessoas[0];
  const lk = livro.matheus.lancamentos.filter(doK(k));
  const m = { k,
    entrou: soma(lk.filter(l => l.tipo === "Receita"), l => l.valor) + soma(pags.filter(doK(k)), g => g.valor),
    saiu: soma(lk.filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia"), l => l.valor)
        + soma(livro.matheus.gastosFixos, g => valorFixo(g, k))
        + soma(livro.casa.lancamentos.filter(doK(k)).filter(l => l.quem === eu), l => l.valor),
    aportes: soma(lk.filter(l => l.tipo === "Aporte"), l => l.valor),
    resgates: soma(lk.filter(l => l.tipo === "Resgate"), l => l.valor),
    pacientes: soma(pags.filter(doK(k)).filter(g => !g.receita || g.receita === "Prática Clínica."), g => g.valor) };
  // o que sobrou é a mesma conta do "Saldo" da Situação do mês: o que foi para a reserva saiu do
  // caixa, o que voltou dela entrou (04/10/2026: antes a lista dizia "faltou" num mês que a
  // Situação dizia ter fechado positivo, como setembro, pago com o resgate de 30/09)
  m.sobra = Math.round((m.entrou - m.saiu - m.aportes + m.resgates) * 100) / 100;
  return m;
}

// ---------- ordenar as listas ----------
// Clicar no cabeçalho (ou escolher na caixa, no celular) ordena por aquela coluna; clicar de
// novo inverte. Data e valor começam do maior; texto, de A a Z (pedido dele, 01/10/2026).
const ordem = { lanc:{ c:"data", d:-1 }, casa:{ c:"data", d:-1 } };
const COLUNAS = {
  lanc: [["data","Dia"],["descricao","Descrição"],["categoria","Categoria"],["forma","Forma"],["valor","Valor"]],
  casa: [["data","Dia"],["compra","Compra"],["quem","Quem"],["valor","Valor"]]
};
const valorDaColuna = (l, c) => c === "valor" ? Number(l.valor) || 0
  : c === "compra" ? semPonto(l.categoria) + " " + (l.descricao || "") : String(l[c] || "");
// No mesmo dia, o lançado por último aparece primeiro (pedido dele, 05/10/2026): a lista guarda
// a ordem em que foi lançado, e é ela que desempata.
function ordenar(lista, qual){
  const { c, d } = ordem[qual];
  return lista.map((l, i) => [l, i]).sort(([a, ia], [b, ib]) => {
    const x = valorDaColuna(a, c), y = valorDaColuna(b, c);
    const r = typeof x === "number" ? x - y : x.localeCompare(y, "pt-BR", { sensitivity:"base" });
    return (r || (b.data || "").localeCompare(a.data || "") * d) * d || (c === "data" ? (ia - ib) * d : ib - ia);
  }).map(([l]) => l);
}
function cabecalho(qual){
  const o = ordem[qual];
  return `<thead><tr>${COLUNAS[qual].map(([c, n]) => `<th${c === "valor" ? ' class="dir"' : ""}><button type="button" class="ord" data-ord="${qual}:${c}" aria-pressed="${o.c === c}"
    title="Ordenar por ${n.toLowerCase()}">${n}${o.c === c ? (o.d > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}<th></th></tr></thead>`;
}
// Filtro por categoria nas listas de lançamentos (pedido dele, 02/10/2026): só as categorias que
// aparecem no mês; a escolha que não existe no mês aberto volta para "todas".
const filtroCat = { lanc:"", casa:"" };
function filtrar(lista, qual){
  if (filtroCat[qual] && !lista.some(l => l.categoria === filtroCat[qual])) filtroCat[qual] = "";
  return filtroCat[qual] ? lista.filter(l => l.categoria === filtroCat[qual]) : lista;
}
function filtroCategoria(todos, qual){
  const cats = [...new Set(todos.map(l => l.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  if (cats.length < 2) return "";
  const vistos = filtrar(todos, qual);
  return `<label class="filtro-cat">Categoria <select data-filtrocat="${qual}" aria-label="Filtrar por categoria">
    <option value="">todas</option>${cats.map(c => `<option value="${escH(c)}"${filtroCat[qual] === c ? " selected" : ""}>${escH(comPonto(nomeCat(c)))}</option>`).join("")}</select>
    ${filtroCat[qual] ? `<span>${vistos.length} de ${todos.length} · ${dinheiro(soma(vistos, l => l.valor))}</span>` : ""}</label>`;
}
function ordemCelular(qual){
  const o = ordem[qual], op = (c, d, n) => `<option value="${c}:${d}"${o.c === c && o.d === d ? " selected" : ""}>${n}</option>`;
  return `<label class="ordem-cel">Ordenar por <select data-ordsel="${qual}" aria-label="Ordenar a lista">
    ${op("data", -1, "mais recentes")}${op("data", 1, "mais antigos")}${op("valor", -1, "maior valor")}${op("valor", 1, "menor valor")}
    ${COLUNAS[qual].filter(([c]) => c !== "data" && c !== "valor").map(([c, n]) => op(c, 1, n.toLowerCase() + ", de A a Z")).join("")}</select></label>`;
}

// ---------- o formulário único de lançamento ----------
// Um botão só, e dentro dele a escolha: é Pessoal (caderno do Dinheiro) ou é da Casa (pedido
// dele, 01/10/2026). Dentro do controle da Ana esta página só tem a Casa, então não há escolha.
// O desenho e o comportamento moram em lancamento.js (o mesmo do controle da Ana). Aqui fica só
// o lugar onde ele entra e o que acontece com o lançamento pronto.
// Dentro do controle da Ana ela altera e apaga só as compras dela na Casa; as dele ela só vê
// (Matheus, 04/10/2026). No app dele nada muda.
const euNaCasaAna = () => livro.casa.pessoas.find(x => /^ana/i.test(x)) || livro.casa.pessoas[1];
const podeMexer = l => PERFIL !== "ana" || (l && l.quem === euNaCasaAna());
function formLancamento(padrao){ return `<div class="lanc" data-lanc="${padrao || ""}"></div>`; }
function configLancamento(padrao){
  const soCasa = PERFIL === "ana";
  const [p1, p2] = livro.casa.pessoas;
  return {
    tela: aba, padrao: soCasa ? "casa" : (padrao || null),
    dataPadrao: chaveMes(ref) === chaveMes(new Date()) ? hojeISO() : chaveMes(ref) + "-01",
    pessoal: soCasa ? null : {
      explica: "Só meu. Entra inteiro no meu mês.",
      tipos: [["Despesa","Despesa",""], ["Receita","Receita","Entrada que não é de paciente (pagamento de paciente é lançado na Clínica)."],
              ["Aporte","Aporte na reserva","Dinheiro que foi para a reserva de emergência."], ["Resgate","Resgate da reserva","Dinheiro que saiu da reserva de emergência. O gasto feito com ele é lançado à parte, como despesa."]],
      grupos: Categorias.GRUPOS_DINHEIRO, formas: FORMAS },
    casa: {
      explica: `Da casa, dividido com ${primeiro(soCasa ? p1 : p2)}. Entra na balança.`,
      pessoas: livro.casa.pessoas.slice(), eu: soCasa ? euNaCasaAna() : p1,
      grupos: Categorias.GRUPOS_CASA },
    lancar(onde, d){
      const id = novoId();
      if (onde === "casa") {
        livro.casa.lancamentos.push({ id, data:d.data, quem:d.quem, descricao:d.descricao || "-", categoria:d.categoria, valor:d.valor });
        salvar("casa");
        return () => { livro.casa.lancamentos = livro.casa.lancamentos.filter(x => x.id !== id); salvar("casa"); };
      }
      const reserva = d.tipo === "Aporte" || d.tipo === "Resgate";
      livro.matheus.lancamentos.push({ id, data:d.data, tipo:d.tipo, descricao:d.descricao,
        categoria: reserva ? "Reserva" : d.tipo === "Receita" ? "Outras entradas" : d.categoria, forma:d.forma, valor:d.valor });
      salvar("matheus");
      return () => { livro.matheus.lancamentos = livro.matheus.lancamentos.filter(x => x.id !== id); salvar("matheus"); };
    },
    alterar(onde, id, d){
      const cad = onde === "casa" ? "casa" : "matheus";
      const l = livro[cad].lancamentos.find(x => x.id === id);
      if (!l || (cad === "casa" && !podeMexer(l))) return null;
      const antes = JSON.parse(JSON.stringify(l));
      if (onde === "casa") Object.assign(l, { data:d.data, quem:d.quem, descricao:d.descricao || "-", categoria:d.categoria, valor:d.valor });
      else {
        const reserva = d.tipo === "Aporte" || d.tipo === "Resgate";
        Object.assign(l, { data:d.data, tipo:d.tipo, descricao:d.descricao,
          categoria: reserva ? "Reserva" : d.tipo === "Receita" ? "Outras entradas" : d.categoria, forma:d.forma, valor:d.valor });
      }
      salvar(cad);
      // desfazer devolve o lançamento como estava, no mesmo lugar da lista
      return () => { const i = livro[cad].lancamentos.findIndex(x => x.id === id); if (i >= 0) livro[cad].lancamentos[i] = antes; salvar(cad); };
    },
    apagar(onde, id){
      const cad = onde === "casa" ? "casa" : "matheus";
      const i = livro[cad].lancamentos.findIndex(x => x.id === id); if (i < 0 || (cad === "casa" && !podeMexer(livro[cad].lancamentos[i]))) return null;
      const [tirado] = livro[cad].lancamentos.splice(i, 1);
      salvar(cad);
      return () => { if (!livro[cad].lancamentos.some(x => x.id === id)) livro[cad].lancamentos.splice(Math.min(i, livro[cad].lancamentos.length), 0, tirado); salvar(cad); };
    }
  };
}
// o lápis de cada linha abre o formulário com aquele lançamento, para alterar
function alterarLancamento(cad, id){
  const l = livro[cad].lancamentos.find(x => x.id === id); if (!l || (cad === "casa" && !podeMexer(l))) return;
  const el = document.querySelector("[data-lanc]"); if (!el) return;
  FormLancamento.editar(configLancamento(el.dataset.lanc || null), cad === "casa" ? "casa" : "pessoal", l);
  desenhar();
  const novo = document.querySelector("[data-lanc]"); if (novo) novo.scrollIntoView({ block:"start", behavior:"smooth" });
}

// ---------- telas ----------
// A Carteira juntou Dinheiro e cripto (28/09/2026): aqui ela é a visão do dinheiro; a cripto é outra página.
const ABAS = [["tudo","Tudo"],["carteira","Carteira"],["casa","Casa"]];

const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, (Number(a) || 0) / b * 100)) : 0;
const pctTxt = (a, b) => (b > 0 ? (a / b * 100) : 0).toLocaleString("pt-BR", { maximumFractionDigits:1 }) + "%";
const redondo = v => (v < 0 ? "−" : "") + "R$ " + Math.round(Math.abs(Number(v) || 0)).toLocaleString("pt-BR");
const sinalDin = v => (v < -0.005 ? "−" : "") + dinheiro(Math.abs(v));
const semPonto = s => String(s || "").replace(/\.$/, "").replace(". (", " (");
// na tela, categoria e descrição terminam com ponto (pedido dele, 02/10/2026); o dado guardado continua sem
const comPonto = FormLancamento.comPonto;
// O nome certo da reserva é "Reserva de emergência" (correção dele, 02/10/2026). O dado guardado
// continua "Reserva", que é a chave das contas; só o que aparece na tela muda.
const nomeCat = c => semPonto(c) === "Reserva" ? "Reserva de emergência" : semPonto(c);
const dataCurta = d => (d || "").slice(8, 10) + "/" + (d || "").slice(5, 7);
const nd = motivo => `<b class="nota" style="font-size:22px">—</b><small>${motivo}</small>`;

function barraMes(){
  return `<div class="mes"><button class="b redondo" data-mes="-1" aria-label="Mês anterior">‹</button>
    <h1>${MESES[ref.getMonth()]} <span>${ref.getFullYear()}</span></h1>
    <button class="b redondo" data-mes="1" aria-label="Próximo mês">›</button></div>`;
}

// Rosca como a da Carteira ("Onde está"), porque é o gráfico que ele gosta para ver partes de um todo.
// itens: [rótulo, valor, cor, detalhe opcional]. A legenda ao lado leva o valor e a porcentagem.
function rosca(itens, centro, aria){
  itens = itens.filter(x => x[1] > 0.005);
  const total = soma(itens, x => x[1]);
  if (!total) return `<p class="vazio">Nada neste mês.</p>`;
  const R0 = 68, C = 2 * Math.PI * R0, gap = itens.length > 1 ? 2 : 0; let acum = 0;
  const fatias = itens.map(([rot, v, cor], i) => {
    const f = v / total, len = Math.max(0.5, f * C - gap);
    const s = `<circle class="fatia" data-i="${i}" cx="85" cy="85" r="${R0}" fill="none" stroke="${cor}" stroke-width="24"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acum).toFixed(2)}" transform="rotate(-90 85 85)">
      <title>${escH(rot)}: ${dinheiro(v)} (${pctTxt(v, total)})</title></circle>`;
    acum += f * C; return s;
  }).join("");
  const meio = `<text class="centro1" x="85" y="80" text-anchor="middle">${escH(centro)}</text>
    <text class="centro2" x="85" y="100" text-anchor="middle">${redondo(total)}</text>`;
  const leg = itens.map(([rot, v, cor, det], i) => `<li data-i="${i}"><i style="background:${cor}"></i>
    <span class="n">${escH(rot)}${det ? `<small>${escH(det)}</small>` : ""}</span><b>${dinheiro(v)}</b><span class="pc">${pctTxt(v, total)}</span></li>`).join("");
  return `<div class="rosca"><svg viewBox="0 0 170 170" role="img" aria-label="${escH(aria)}">${fatias}${meio}</svg><ul class="leg">${leg}</ul></div>`;
}

// Partes de um todo numa barra só, com a mesma legenda da rosca.
function barraPartes(itens, aria){
  itens = itens.filter(x => x[1] > 0.005);
  const total = soma(itens, x => x[1]);
  if (!total) return `<p class="vazio">Nada guardado ainda.</p>`;
  const faixas = itens.map(([rot, v, cor]) => `<i style="width:${(v / total * 100).toFixed(2)}%;background:${cor}" title="${escH(rot)}: ${dinheiro(v)}"></i>`).join("");
  const leg = itens.map(([rot, v, cor, det]) => `<li><i style="background:${cor}"></i>
    <span class="n">${escH(rot)}${det ? `<small>${escH(det)}</small>` : ""}</span><b>${dinheiro(v)}</b><span class="pc">${pctTxt(v, total)}</span></li>`).join("");
  return `<div class="partes"><div class="pt-total"><span>Total</span><b>${dinheiro(total)}</b></div>
    <div class="pilha" role="img" aria-label="${escH(aria)}">${faixas}</div><ul class="leg">${leg}</ul></div>`;
}
function metaReserva(reserva, meta){
  if (!(meta > 0)) return "";
  const falta = meta - reserva;
  return `<div class="meta-r"><div class="l1"><span>Meta da reserva</span><b>${Math.round(pct(reserva, meta))}%</b></div>
    <div class="trilho" role="img" aria-label="${Math.round(pct(reserva, meta))}% da meta"><i style="width:${pct(reserva, meta)}%"></i></div>
    <small>${falta > 0.005 ? `faltam ${dinheiro(falta)} para ${dinheiro(meta)}` : `meta de ${dinheiro(meta)} alcançada`}</small></div>`;
}

// para onde foi o dinheiro do mês: despesas lançadas e fixos por categoria, mais a casa.
// Sete fatias com cor e o resto junto em "Outros", para a rosca continuar legível.
function porCategoria(km = chaveMes(ref)){
  const s = {};
  livro.matheus.lancamentos.filter(doK(km)).filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia")
    .forEach(l => s[l.categoria] = (s[l.categoria] || 0) + (Number(l.valor) || 0));
  livro.matheus.gastosFixos.forEach(g => { const v = valorFixo(g, km); if (v) s[g.categoria] = (s[g.categoria] || 0) + v; });
  const casa = contasCasa(km).pagou[livro.casa.pessoas[0]] || 0;
  if (casa) s["Moradia (casa)"] = (s["Moradia (casa)"] || 0) + casa;
  return Object.entries(s).filter(e => e[1] > 0.005).sort((a, b) => b[1] - a[1]);
}
function roscaCategorias(d){
  const cats = porCategoria();
  if (!cats.length) return `<p class="vazio">Nada saiu em ${MESES[ref.getMonth()]}.</p>`;
  const cabem = cats.length > 8 ? 7 : 8;
  const itens = cats.slice(0, cabem).map(([k, v], i) => [comPonto(k), v, `var(--c${i + 1})`]);
  const resto = cats.slice(cabem);
  if (resto.length) itens.push(["Outros.", soma(resto, e => e[1]), "var(--c8)", resto.map(e => semPonto(e[0])).join(", ") + "."]);
  // a rosca conta todos os fixos do mês; "Gastei" só conta os que já venceram. A nota explica a diferença.
  const vai = d && d.faltaSair > 0.005 ? `<p class="nota">Inclui ${dinheiro(d.faltaSair)} de fixos que ainda vão sair, por isso passa do "Gastei".</p>` : "";
  return rosca(itens, "no mês", "Despesas do mês por categoria") + vai;
}

// Limite de gasto por categoria (aprovado por ele em 02/10/2026): ele diz quanto quer gastar no mês
// em cada categoria e a tela mostra o quanto já foi, com aviso a partir de 80% e quando passa.
// O gasto é o mesmo de "Gastos por categoria": lançamentos do mês mais os fixos da categoria.
const limites = () => livro.matheus.limites || (livro.matheus.limites = {});
const PERTO_DO_LIMITE = 0.8;
function painelLimites(){
  const gasto = Object.fromEntries(porCategoria()), lim = limites();
  const itens = Object.keys(lim).filter(c => Number(lim[c]) > 0)
    .map(c => ({ c, teto:Number(lim[c]), foi:gasto[c] || 0 })).sort((a, b) => b.foi / b.teto - a.foi / a.teto);
  const linha = x => {
    const r = x.foi / x.teto, cls = r > 1.0005 ? "passou" : r >= PERTO_DO_LIMITE ? "perto" : "";
    const aviso = cls === "passou" ? `passou ${dinheiro(x.foi - x.teto)}` : cls === "perto" ? `perto do limite: sobram ${dinheiro(x.teto - x.foi)}` : `sobram ${dinheiro(x.teto - x.foi)}`;
    return `<li class="${cls}"><div class="l1"><b>${escH(comPonto(x.c))}</b><span>${dinheiro(x.foi)} de ${dinheiro(x.teto)}</span></div>
      <div class="trilho" role="img" aria-label="${Math.round(r * 100)}% do limite"><i style="width:${pct(x.foi, x.teto)}%"></i></div>
      <div class="l2"><b>${aviso}</b><button type="button" data-limite-x="${escH(x.c)}">tirar limite</button></div></li>`;
  };
  const cats = CATEGORIAS.filter(t => t !== "Reserva" && t !== "Outras entradas");
  const form = `<details class="novo"><summary>${itens.length ? "Mudar ou criar limite" : "+ Criar limite"}</summary><form class="linha" id="fLimite">
    <div><label>Categoria</label><select name="categoria" required><option value="" disabled selected hidden>escolha…</option>${cats.map(t => `<option value="${t}">${comPonto(t)}</option>`).join("")}</select></div>
    <div><label>Limite por mês</label><input type="text" name="valor" inputmode="numeric" autocomplete="off" data-dinheiro placeholder="0,00" required></div>
    <div><button class="b p" type="submit">Guardar</button></div>
  </form></details>`;
  return `<section class="painel"><h2>Limites por categoria</h2>${itens.length ? `<ul class="lim">${itens.map(linha).join("")}</ul>`
    : `<p class="nota" style="margin-top:0">Diga quanto quer gastar por mês numa categoria e o app avisa quando chegar perto.</p>`}${form}</section>`;
}

function roscaCasa(c){
  const [p1, p2] = livro.casa.pessoas;
  return rosca([[primeiro(p1), c.pagou[p1], "var(--c1)"], [primeiro(p2), c.pagou[p2], "var(--c2)"]], "casa no mês", "Quem pagou a casa");
}

// Situação do mês: primeiro o que de fato entrou e saiu, depois o que ainda vem,
// e a seta dizendo se dá para gastar (pedido dele, 27/09/2026).
function veredito(d){
  const agora = new Date(), km = chaveMes(ref), hoje = chaveMes(agora);
  const nome = MESES[ref.getMonth()];
  const seta = cima => `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${cima ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}</svg></span>`;
  const caixa = (cls, cima, titulo, texto) => `<div class="veredito ${cls}"><div class="topo-v">${seta(cima)}<b>${titulo}</b></div><p>${texto}</p></div>`;
  // Aparelho novo, ou depois de "Sair deste aparelho": sem entrar e sem nada guardado aqui, os R$ 0,00
  // não são o mês dele, e a caixa pedia para "segurar até entrar" (05/10/2026). Agora pede para entrar.
  const semNada = !livro.matheus.lancamentos.length && !livro.matheus.gastosFixos.length && !livro.casa.lancamentos.length;
  if (semNada && !Nuvem.conectado()) return `<div class="veredito"><div class="topo-v"><b>Entre para ver o seu mês</b></div><p>Os números aparecem depois que você entrar com o Google, no botão Entrar lá em cima.</p></div>`;
  if (km < hoje) return d.sobra >= 0
    ? caixa("pos", true, "Fechou positivo", `${nome[0].toUpperCase() + nome.slice(1)} terminou com ${dinheiro(d.sobra)} de sobra.`)
    : caixa("neg", false, "Fechou negativo", `${nome[0].toUpperCase() + nome.slice(1)} terminou com ${sinalDin(d.sobra)}.`);
  const fim = d.fimDoMes;
  // Sem o previsto da Clínica não dá para dizer "mesmo que entre tudo o que falta": não se sabe quanto falta
  // (antes a caixa podia dizer "Não pode gastar" só porque a Clínica ainda não tinha aberto).
  if (d.falta === null) return `<div class="veredito"><div class="topo-v"><b>Ainda sem previsão</b></div><p>Hoje está em ${sinalDin(d.sobra)}. Para dizer se dá para gastar falta o previsto da Clínica, que ainda não abriu neste aparelho.</p></div>`;
  const semPrevisto = "";
  // mês que ainda não começou: é previsão, não "hoje"
  if (km > hoje) return fim < -0.005
    ? caixa("neg", false, "Previsão no vermelho", `Com o previsto da agenda e os fixos marcados, ${nome} fecha em ${sinalDin(fim)}.`)
    : caixa("pos", true, "Previsão no azul", `Com o previsto da agenda e os fixos marcados, ${nome} fecha em ${dinheiro(fim)}.`);
  if (fim < -0.005) return caixa("neg", false, "Não pode gastar",
    `Mesmo que entre tudo o que falta, ${nome} fecha em ${sinalDin(fim)}${semPrevisto}.`);
  // saldo zerado também é "segure": o que fecha o mês no azul ainda não entrou (01/10/2026: com saldo
  // de R$ 0,00 a caixa dizia "Pode gastar até R$ 6.625,52", que é dinheiro que ele ainda vai receber)
  if (d.sobra < 0.005) return caixa("warn", true, "Segure até entrar",
    `Hoje está em ${sinalDin(d.sobra)}. Se entrar o previsto, fecha em ${dinheiro(fim)}: dá para gastar isso, mas só depois que entrar${semPrevisto}.`);
  // o que dá para gastar hoje é o que já está na mão, sem passar do que sobra no fim do mês
  if (d.sobra < fim - 0.005) return caixa("pos", true, "Pode gastar",
    `Hoje, até ${dinheiro(d.sobra)}. Se entrar o previsto, até ${dinheiro(fim)} no mês${semPrevisto}.`);
  return caixa("pos", true, "Pode gastar", `Até ${dinheiro(fim)} sem fechar ${nome} no vermelho${semPrevisto}.`);
}

// valor digitado à mão: "1.250,50", "1.250" e "1250.5" valem. Com vírgula, ou com ponto seguido
// de três dígitos, o ponto é separador de milhar.
function lerValorBR(t){
  const limpo = String(t == null ? "" : t).replace(/[^0-9.,]/g, "");
  return Number(limpo.indexOf(",") >= 0 || /^\d{1,3}(\.\d{3})+$/.test(limpo) ? limpo.replace(/\./g, "").replace(",", ".") : limpo);
}
const pendencias = () => livro.matheus.pendencias || (livro.matheus.pendencias = []);
const restantePend = p => Math.max(0, (Number(p.total) || 0) - (Number(p.pago) || 0));
const pendQuitada = p => !!p.quitada || restantePend(p) < 0.005;
const chavePend = p => [String(p.nome || "").trim().toLowerCase(), p.tipo, Number(p.total) || 0, p.inicio || ""].join("|");

  // Tela própria (01/10/2026: no fim da tela do Dinheiro ele achou a lista mal organizada): os três

  const doTipo = tipo => abertas.filter(p => p.tipo === tipo).sort((x, y) => restantePend(y) - restantePend(x));
  const aReceber = soma(doTipo("receber"), restantePend), aPagar = soma(doTipo("pagar"), restantePend);

  const form = `<details class="novo"><summary>+ Nova pendência</summary><form class="linha" id="fPend">

// Lê a aba Pendências da Controle Financeiro.xlsx no navegador e acrescenta o que ainda não está aqui
// (mesmo nome, tipo, valor total e data de início contam como a mesma pendência).
async function importarPendencias(arquivo){
  const abas = await lerXlsx(await arquivo.arrayBuffer());
  const semAcento = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  const aba = abas.find(x => semAcento(x.nome).indexOf("pend") === 0);
  if (!aba) throw new Error('não achei a aba "Pendências" nesse arquivo');
  const cab = (aba.linhas[0] || []).map(semAcento);
  const acha = (padrao, reserva) => { const i = cab.findIndex(t => padrao.test(t)); return i >= 0 ? i : reserva; };
  const c = { nome:acha(/nome/, 0), tipo:acha(/^tipo/, 1), origem:acha(/origem/, 2), inicio:acha(/inicio/, 3), fim:acha(/fim|final|termino/, 4),
              total:acha(/total/, 5), pago:acha(/pago/, 6), status:acha(/status/, 8), obs:acha(/observ/, 9) };
  // data do Excel (número de série) ou texto AAAA-MM-DD, que é como a planilha baixada do app escreve
  const dataDe = v => typeof v === "number" && v > 30000 && v < 80000 ? new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10)
    : /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) : "";
  const semPt = s => String(s == null ? "" : s).replace(/\.+\s*$/, "").trim();
  const jaTem = new Set(pendencias().map(chavePend));
  let novas = 0, repetidas = 0;
  aba.linhas.slice(1).forEach(l => {
    const nome = semPt(l[c.nome]), total = Number(l[c.total]);
    if (!nome || nome === "-" || !(total > 0)) return;
    // Na planilha, "A pagar" e "A receber" são do ponto de vista de quem está no nome ("Hiago, A pagar" é o
    // Hiago pagando a Matheus). No app, "a receber" e "a pagar" são de Matheus: por isso se inverte (correção dele, 03/10/2026).
    const p = { id:novoId(), nome, tipo: semAcento(l[c.tipo]).indexOf("pagar") >= 0 ? "receber" : "pagar", origem:semPt(l[c.origem]),
      inicio:dataDe(l[c.inicio]), fim:dataDe(l[c.fim]), total, pago:Number(l[c.pago]) || 0, obs:semPt(l[c.obs]) === "-" ? "" : semPt(l[c.obs]) };
    if (semAcento(l[c.status]).indexOf("quitad") === 0) p.quitada = true;
    if (jaTem.has(chavePend(p))) { repetidas++; return; }
    jaTem.add(chavePend(p)); pendencias().push(p); novas++;
  });
  return { novas, repetidas };
}

// Gastos fixos separados pelo que interessa no mês: o que ainda vai sair, o que já saiu e,
// recolhido, o que não cobra neste mês. Dentro de cada grupo, na ordem do dia.
function vistaFixos(){
  const km = chaveMes(ref), nome = MESES[ref.getMonth()];
  const hojeD = new Date(), mesCorrente = km === chaveMes(hojeD), mesPassado = km < chaveMes(hojeD);
  const porDia = (a, b) => ((Number(a.dia) || 99) - (Number(b.dia) || 99)) || (valorFixo(b, km) - valorFixo(a, km));
  const cobra = livro.matheus.gastosFixos.filter(g => valorFixo(g, km) > 0).sort(porDia);
  const fora = livro.matheus.gastosFixos.filter(g => !(valorFixo(g, km) > 0)).sort(porDia);
  // a mesma regra da Situação do mês: fixo sem dia conta como já saiu; mês futuro, nada saiu ainda
  const saiu = g => mesPassado || (mesCorrente && (!diaFixo(g, km) || diaFixo(g, km) <= hojeD.getDate()));
  const jaSaiu = cobra.filter(saiu), vaiSair = cobra.filter(g => !saiu(g));
  const total = l => soma(l, g => valorFixo(g, km));
  const tabela = lista => `<table class="t fixos"><thead><tr><th>Gasto</th><th>Categoria</th><th class="dir">Dia</th><th class="dir">Valor em ${nome}</th><th></th></tr></thead><tbody>
      ${lista.map(g => `<tr${valorFixo(g, km) > 0 ? "" : ' class="fx-fora"'}><td class="c-desc"><b>${escH(comPonto(g.descricao))}</b>${!Number(g.dia) && valorFixo(g, km) > 0 ? `<span class="fx-sit">sem dia marcado${mesCorrente ? ": conta como já saiu" : ""}</span>` : ""}<span class="so-cel">${escH(comPonto(g.categoria))}</span></td>
        <td class="c-cat">${escH(comPonto(g.categoria))}</td>
        <td class="dir"><input class="dia" type="number" min="1" max="31" inputmode="numeric" data-dia="${escH(g.id)}" value="${g.dia || ""}" placeholder="dia" aria-label="Dia do mês"></td>
        <td class="dir"><input type="text" inputmode="numeric" autocomplete="off" data-dinheiro data-valorfixo="${escH(g.id)}" value="${valorCampo(valorFixo(g, km))}" placeholder="—" aria-label="Valor em ${nome}"></td>
        <td class="c-x"><button class="x" data-apagar-fixo="${escH(g.id)}" aria-label="Tirar a partir de ${nome}">×</button></td></tr>`).join("")}</tbody></table>`;
  // Conta da casa cadastrada também como fixo (ex.: condomínio): se no mesmo mês houver compra dele na
  // Casa com essa categoria, o valor pode estar entrando duas vezes no mês. Só avisa; nada muda sozinho.
  const txt = s => semPonto(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const contasDaCasa = (Categorias.GRUPOS_CASA.find(x => x[0] === "Contas da casa") || [, []])[1];
  const naCasa = new Set(livro.casa.lancamentos.filter(noMes).filter(l => l.quem === livro.casa.pessoas[0]).map(l => txt(l.categoria)));
  const dobra = cobra.map(g => [g, contasDaCasa.find(c => naCasa.has(txt(c)) && new RegExp("\\b" + txt(c) + "\\b").test(txt(g.descricao) + " " + txt(g.categoria)))]).filter(x => x[1]);
  const avisoDobra = dobra.length ? `<section class="painel bloco aviso-fx"><p>Confira se não está contando duas vezes: ${dobra.map(([g, c]) => `${escH(semPonto(g.descricao))} está nos fixos e você também lançou ${escH(c)} na Casa em ${nome}`).join("; ")}. Os dois entram no seu mês.</p></section>` : "";
  const grupo = (titulo, lista) => lista.length ? `<section class="painel bloco"><h2>${titulo}<span class="dir">${lista.length} · ${dinheiro(total(lista))}</span></h2>${tabela(lista)}</section>` : "";

  const formFixo = `<details class="novo"><summary>+ Novo gasto fixo</summary><form class="linha" id="fFixo">
    <div style="grid-column:span 2"><label>Gasto fixo</label><input name="descricao" placeholder="assinatura, conta" required></div>
    <div><label>Categoria</label><select name="categoria" required><option value="" disabled selected hidden>escolha…</option>${CATEGORIAS.filter(t => t !== "Reserva" && t !== "Outras entradas").map(t => `<option value="${t}">${comPonto(t)}</option>`).join("")}</select></div>
    <div><label>Dia do mês</label><input type="number" name="dia" min="1" max="31" inputmode="numeric" required></div>
    <div><label>Valor por mês</label><input type="text" name="valor" inputmode="numeric" autocomplete="off" data-dinheiro placeholder="0,00" required></div>
    <div><button class="b p" type="submit">Cadastrar deste mês até dezembro</button></div>
  </form></details>`;

  return `<div class="stats tres" style="margin-top:0">
      <div class="stat"><span>Fixos de ${nome}</span><b>${dinheiro(total(cobra))}</b><small>${cobra.length} ${cobra.length === 1 ? "conta" : "contas"}</small></div>
      <div class="stat"><span>Já saiu</span><b>${dinheiro(total(jaSaiu))}</b><small>${jaSaiu.length} de ${cobra.length}</small></div>
      <div class="stat"><span>Ainda vai sair</span><b class="${vaiSair.length ? "warn" : ""}">${dinheiro(total(vaiSair))}</b><small>${vaiSair.length ? (mesCorrente && diaFixo(vaiSair[0], km) ? "próximo: dia " + diaFixo(vaiSair[0], km) : vaiSair.length + " de " + cobra.length) : "nada a vencer"}</small></div>
    </div>
    ${copiaFixos(km, cobra.length)}${avisoDobra}
    <div class="bloco">${formFixo}</div>
    ${livro.matheus.gastosFixos.length ? "" : `<section class="painel"><p class="vazio">Nenhum gasto fixo cadastrado.</p></section>`}
    <div class="fx-grupos">${grupo(mesCorrente ? "Ainda vai sair" : "Vai sair em " + nome, vaiSair)}${grupo(mesCorrente ? "Já saiu" : "Saiu em " + nome, jaSaiu)}</div>
    ${fora.length ? `<section class="painel bloco"><details class="fx-fora-d"><summary>Não cobram em ${nome} (${fora.length})</summary>${tabela(fora)}</details></section>` : ""}
    <p class="nota" style="margin-top:14px">O dia é o da cobrança (no cartão, o dia da compra). Com o dia marcado, o fixo só entra em "Gastei" quando ele chega; antes disso fica em "Ainda vai sair". Para um fixo deixar de cobrar em ${nome}, apague o valor dele.</p>`;
}

// Os fixos novos vão só até dezembro. Quando um mês não tem nenhum fixo e o anterior tinha,
// oferece copiar os valores do mês anterior. Só preenche o mês vazio; nada do que já existe muda.
function mesAnterior(km){ const d = new Date(Number(km.slice(0, 4)), Number(km.slice(5, 7)) - 2, 1); return chaveMes(d); }
function fixosParaCopiar(km){
  const ant = mesAnterior(km);
  return livro.matheus.gastosFixos.filter(g => g.valores && Number(g.valores[ant]) > 0 && g.valores[km] === undefined);
}
function copiaFixos(km, jaTem){
  if (jaTem) return "";
  const n = fixosParaCopiar(km).length; if (!n) return "";
  const ant = MESES[Number(mesAnterior(km).slice(5, 7)) - 1];
  return `<section class="painel bloco aviso-fx"><p>${MESES[ref.getMonth()][0].toUpperCase() + MESES[ref.getMonth()].slice(1)} ainda não tem gastos fixos. ${n} ${n === 1 ? "cobrou" : "cobraram"} em ${ant}.</p>
    <button type="button" class="b p" id="copiarFixos">Copiar os fixos de ${ant}</button></section>`;
}

// Mês a mês: o gráfico e, embaixo, a mesma conta em lista, com o que sobrou em cada mês.
function vistaHistorico(){
  const serie = serieMeses();
  const kHoje = chaveMes(new Date());
  const linhas = serie.slice().reverse().filter(m => m.entrou > 0.005 || m.saiu > 0.005 || m.aportes > 0.005 || m.resgates > 0.005).map(m => {
    const sobra = m.sobra;
    const det = [`entrou ${dinheiro(m.entrou)}`, `saiu ${dinheiro(m.saiu)}`,
      m.aportes > 0.005 ? `foi para a reserva ${dinheiro(m.aportes)}` : "", m.resgates > 0.005 ? `veio da reserva ${dinheiro(m.resgates)}` : "",
      m.k === kHoje ? "mês em andamento" : ""].filter(Boolean).join(" · ");
    return `<button type="button" class="hm" data-irmes="${m.k}"><span class="hm-m">${MESES[Number(m.k.slice(5, 7)) - 1]} ${m.k.slice(0, 4)}</span>
      <span class="hm-d">${det}</span>
      <b class="${sobra < -0.005 ? "neg" : "pos"}"><small>${sobra < -0.005 ? "faltou" : "sobrou"}</small>${dinheiro(Math.abs(sobra))}</b></button>`;
  }).join("");
  return `<section class="painel bloco"><h2>Entrou e saiu, mês a mês<span class="dir">toque num mês para abrir</span></h2>${GraficoMeses.desenhar(serie, { aberto:chaveMes(ref) })}</section>
    ${linhas ? `<section class="painel bloco"><h2>Cada mês<span class="dir">últimos 12 meses</span></h2>${linhas}</section>` : ""}
    <p class="nota" style="margin-top:14px">Entrou: o que a Clínica recebeu mais as receitas lançadas aqui. Saiu: despesas lançadas, gastos fixos (no mês corrente, também os que ainda vão vencer) e o que você pagou na casa. Sobrou ou faltou: entrou menos saiu, menos o que foi para a reserva e mais o que veio dela, a mesma conta do saldo da Situação do mês. No mês corrente, os fixos que ainda vão vencer já estão descontados; por isso o número fica abaixo do Saldo agora. As barras mostram só o que entrou e saiu.</p>`;
}

// ---------- Fechamento do mês (05/10/2026) ----------
// O resumo de um mês que já acabou: como fechou, o que mudou contra os meses de antes e o que fugiu
// do normal, no Dinheiro e na Casa. Só lê os cadernos; nada aqui grava.
// "Normal" é a média dos meses anteriores com movimento (até 6) no Dinheiro e, na Casa, a mesma média
// do card da Casa (meses fechados desde CASA_MEDIA_DESDE).
const NORMAL_MESES = 6;
const FORA_PCT = 0.3, FORA_MIN = 100;   // fugiu do normal: 30% e pelo menos R$ 100 de diferença
const somaMes = (k, n) => chaveMes(new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1 + n, 1));
const nomeMes = k => MESES[Number(k.slice(5, 7)) - 1];
const maiusc = t => t[0].toUpperCase() + t.slice(1);
const fugiu = (v, m) => Math.abs(v - m) >= FORA_MIN && (m < 0.005 || Math.abs(v - m) / m >= FORA_PCT);
const temMovimento = m => m.entrou > 0.005 || m.saiu > 0.005 || m.aportes > 0.005 || m.resgates > 0.005;
const fimDoMesISO = k => k + "-" + String(ultimoDia(k)).padStart(2, "0");

// Categorias (Dinheiro ou Casa) contra a média das mesmas categorias nos meses de base.
// Categoria que não apareceu num mês de base conta zero naquele mês.
function categoriasContraNormal(atual, bases){
  const nomes = new Set([...Object.keys(atual), ...bases.flatMap(b => Object.keys(b))]);
  return [...nomes].map(c => {
    const v = atual[c] || 0, m = bases.length ? soma(bases, b => b[c] || 0) / bases.length : 0;
    return { c, v, m, dif: v - m, fora: bases.length > 0 && fugiu(v, m) };
  }).filter(x => x.v > 0.005 || x.m > 0.005).sort((a, b) => b.v - a.v || b.m - a.m);
}
const casaPorCategoria = k => {
  const s = {};
  livro.casa.lancamentos.filter(doK(k)).forEach(l => s[l.categoria] = (s[l.categoria] || 0) + (Number(l.valor) || 0));
  return s;
};

function fechamento(k){
  const pags = pagamentosClinica();
  const din = mesDinheiro(k, pags);
  const base = [];
  for (let i = 1; i <= 12 && base.length < NORMAL_MESES; i++){
    const m = mesDinheiro(somaMes(k, -i), pags); if (temMovimento(m)) base.push(m);
  }
  const media = f => base.length ? soma(base, f) / base.length : null;
  const normal = { entrou:media(m => m.entrou), saiu:media(m => m.saiu), sobra:media(m => m.sobra), n:base.length };
  const ant = mesDinheiro(somaMes(k, -1), pags);
  const cats = categoriasContraNormal(Object.fromEntries(porCategoria(k)), base.map(m => Object.fromEntries(porCategoria(m.k))));

  // reserva no último dia do mês, quando o saldo conferido é de antes disso
  const r = livro.matheus.reserva, fim = fimDoMesISO(k);
  let reservaFim = null;
  if (r.dataBase && r.dataBase <= fim) {
    const mov = livro.matheus.lancamentos.filter(l => (l.data || "") >= r.dataBase && (l.data || "") <= fim);
    reservaFim = (Number(r.saldoBase) || 0) + soma(mov.filter(l => l.tipo === "Aporte"), l => l.valor) - soma(mov.filter(l => l.tipo === "Resgate"), l => l.valor);
  }

  // fixos que mudaram de valor, começaram ou pararam contra o mês anterior
  const kAnt = somaMes(k, -1);
  const fixos = livro.matheus.gastosFixos.map(g => ({ g, v:valorFixo(g, k), a:valorFixo(g, kAnt) }))
    .filter(x => (x.v > 0.005) !== (x.a > 0.005) || (x.v > 0.005 && Math.abs(x.v - x.a) >= Math.max(10, x.a * 0.05)))
    .sort((x, y) => Math.abs(y.v - y.a) - Math.abs(x.v - x.a));

  const eu = livro.casa.pessoas[0];
  const maiores = livro.matheus.lancamentos.filter(doK(k)).filter(l => l.tipo === "Despesa" && l.categoria !== "Moradia").map(l => ({ l, onde:"Pessoal" }))
    .concat(livro.casa.lancamentos.filter(doK(k)).filter(l => l.quem === eu).map(l => ({ l, onde:"Casa" })))
    .sort((a, b) => (Number(b.l.valor) || 0) - (Number(a.l.valor) || 0)).slice(0, 5);

  const lim = limites(), gastoCat = Object.fromEntries(porCategoria(k));
  const limites_ = Object.keys(lim).filter(c => Number(lim[c]) > 0 && (gastoCat[c] || 0) > Number(lim[c]) + 0.005)
    .map(c => ({ c, teto:Number(lim[c]), foi:gastoCat[c] }));

  const casa = contasCasa(k), mc = mediaCasa(k);
  const casaCats = categoriasContraNormal(casaPorCategoria(k), mc.chaves.map(casaPorCategoria));
  const compras = livro.casa.lancamentos.filter(doK(k)).length;

  return { k, din, normal, ant, cats, reservaFim, fixos, maiores, limites:limites_, casa, mc, casaCats, compras };
}

// A lista do alto: o que fugiu do normal, primeiro o que pede atenção, depois as boas notícias.
function alertasFechamento(F){
  const a = [], { din, normal } = F;
  const n = normal.n;
  if (n && fugiu(din.saiu, normal.saiu)) a.push(din.saiu > normal.saiu
    ? ["warn", `Gastou ${dinheiro(din.saiu - normal.saiu)} a mais que o normal: ${dinheiro(din.saiu)} contra ${dinheiro(normal.saiu)} por mês.`]
    : ["pos", `Gastou ${dinheiro(normal.saiu - din.saiu)} a menos que o normal: ${dinheiro(din.saiu)} contra ${dinheiro(normal.saiu)} por mês.`]);
  if (n && fugiu(din.entrou, normal.entrou)) a.push(din.entrou < normal.entrou
    ? ["warn", `Recebeu ${dinheiro(normal.entrou - din.entrou)} a menos que o normal: ${dinheiro(din.entrou)} contra ${dinheiro(normal.entrou)} por mês.`]
    : ["pos", `Recebeu ${dinheiro(din.entrou - normal.entrou)} a mais que o normal: ${dinheiro(din.entrou)} contra ${dinheiro(normal.entrou)} por mês.`]);
  if (din.resgates > 0.005) a.push(["warn", `Tirou ${dinheiro(din.resgates)} da reserva de emergência.`]);
  F.limites.forEach(x => a.push(["warn", `${semPonto(nomeCat(x.c))} passou o limite em ${dinheiro(x.foi - x.teto)} (${dinheiro(x.foi)} de ${dinheiro(x.teto)}).`]));
  const daCasa = x => x.c === "Moradia (casa)";   // a parte dele na casa já aparece nos avisos da Casa
  F.cats.filter(x => x.fora && x.dif > 0 && !daCasa(x) && !F.limites.some(l => l.c === x.c)).forEach(x => a.push(["warn", x.m < 0.005
    ? `${semPonto(nomeCat(x.c))}: ${dinheiro(x.v)}, sem gasto nos meses anteriores.`
    : `${semPonto(nomeCat(x.c))}: ${dinheiro(x.v)}, ${dinheiro(x.dif)} acima do normal de ${dinheiro(x.m)}.`]));
  F.fixos.filter(x => x.v > x.a + 0.005 && x.a > 0.005).forEach(x => a.push(["warn", `O fixo ${semPonto(x.g.descricao)} subiu de ${dinheiro(x.a)} para ${dinheiro(x.v)}.`]));
  if (F.mc.media !== null && fugiu(F.casa.total, F.mc.media)) a.push(F.casa.total > F.mc.media
    ? ["warn", `A casa gastou ${dinheiro(F.casa.total - F.mc.media)} acima da média: ${dinheiro(F.casa.total)} contra ${dinheiro(F.mc.media)}.`]
    : ["pos", `A casa gastou ${dinheiro(F.mc.media - F.casa.total)} abaixo da média: ${dinheiro(F.casa.total)} contra ${dinheiro(F.mc.media)}.`]);
  F.casaCats.filter(x => x.fora && x.dif > 0).forEach(x => a.push(["warn", x.m < 0.005
    ? `Na casa, ${semPonto(nomeCat(x.c)).toLowerCase()}: ${dinheiro(x.v)}, sem compra nos meses anteriores.`
    : `Na casa, ${semPonto(nomeCat(x.c)).toLowerCase()}: ${dinheiro(x.v)}, ${dinheiro(x.dif)} acima do normal de ${dinheiro(x.m)}.`]));
  F.cats.filter(x => x.fora && x.dif < 0 && !daCasa(x) && x.m >= FORA_MIN).forEach(x => a.push(["pos", `${semPonto(nomeCat(x.c))}: ${dinheiro(x.v)}, ${dinheiro(-x.dif)} abaixo do normal de ${dinheiro(x.m)}.`]));
  if (din.aportes > 0.005) a.push(["pos", `Guardou ${dinheiro(din.aportes)} na reserva de emergência.`]);
  return a.sort((x, y) => (x[0] === "warn" ? 0 : 1) - (y[0] === "warn" ? 0 : 1));
}

function vistaFechamento(){
  const k = chaveMes(ref), kHoje = chaveMes(new Date()), kAnt = somaMes(kHoje, -1);
  const Nome = maiusc(nomeMes(k));
  if (k >= kHoje) return `<section class="painel"><p class="vazio" style="padding-top:0">${k === kHoje ? `${Nome} ainda não acabou.` : `${Nome} ainda não começou.`} O fechamento resume um mês que já terminou.</p>
    <button type="button" class="b" data-fech="${kAnt}">Ver o fechamento de ${nomeMes(kAnt)}</button></section>`;
  const F = fechamento(k), { din, normal } = F;
  if (!temMovimento(din) && !F.compras) return `<section class="painel"><p class="vazio">Nada lançado em ${nomeMes(k)} de ${k.slice(0, 4)}.</p></section>`;

  const seta = cima => `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${cima ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}</svg></span>`;
  const pos = din.sobra >= 0;
  const compNormal = normal.sobra === null ? "" : Math.abs(din.sobra - normal.sobra) < 0.005 ? " Igual ao normal."
    : ` ${din.sobra > normal.sobra ? "Melhor" : "Pior"} que o normal, que é ${normal.sobra < 0 ? "faltar " + dinheiro(-normal.sobra) : "sobrar " + dinheiro(normal.sobra)} por mês.`;
  const ver = `<div class="veredito ${pos ? "pos" : "neg"}"><div class="topo-v">${seta(pos)}<b>${pos ? "Fechou positivo" : "Fechou negativo"}</b></div>
    <p>${Nome} terminou com ${pos ? dinheiro(din.sobra) + " de sobra" : "falta de " + dinheiro(-din.sobra)}.${compNormal}</p></div>`;

  const contra = (v, m, maisBom) => {
    if (m === null) return `<small>sem meses anteriores para comparar</small>`;
    const d = v - m; if (Math.abs(d) < 0.005) return `<small>igual ao normal</small>`;
    const bom = maisBom ? d > 0 : d < 0;
    return `<small class="${fugiu(v, m) ? (bom ? "pos" : "warn") : ""}">${dinheiro(Math.abs(d))} ${d > 0 ? "acima" : "abaixo"} do normal (${dinheiro(m)})</small>`;
  };
  const vsAnt = (v, a) => a > 0.005 ? `<small>${nomeMes(F.ant.k)}: ${dinheiro(a)}</small>` : "";
  const outros = din.entrou - din.pacientes;
  const nums = `<div class="nums"><div class="linha-k">
      <div class="k"><span>Recebi</span><b class="pos">${dinheiro(din.entrou)}</b>${contra(din.entrou, normal.entrou, true)}${vsAnt(din.entrou, F.ant.entrou)}${din.pacientes > 0.005 ? `<small>${dinheiro(din.pacientes)} de pacientes${outros > 0.005 ? `, ${dinheiro(outros)} de outras entradas` : ""}</small>` : ""}</div>
      <div class="k"><span>Gastei</span><b>${dinheiro(din.saiu)}</b>${contra(din.saiu, normal.saiu, false)}${vsAnt(din.saiu, F.ant.saiu)}${din.entrou > 0.005 ? `<small>${Math.round(din.saiu / din.entrou * 100)}% do que recebi</small>` : ""}</div>
      <div class="k destaque"><span>Sobrou</span><b class="${din.sobra < -0.005 ? "neg" : "pos"}">${sinalDin(din.sobra)}</b>${contra(din.sobra, normal.sobra, true)}${din.aportes > 0.005 || din.resgates > 0.005 ? `<small>ajustado pela reserva</small>` : ""}</div>
    </div></div>`;

  const alertas = alertasFechamento(F);
  const listaAlertas = alertas.length
    ? `<ul class="fe-al">${alertas.map(([t, txt]) => `<li class="${t}"><i></i><span>${escH(txt)}</span></li>`).join("")}</ul>`
    : `<p class="vazio" style="padding:0">Nada fugiu do normal em ${nomeMes(k)}.</p>`;

  const linhaCat = x => `<li class="${x.fora ? (x.dif > 0 ? "warn" : "pos") : ""}"><span class="n">${escH(comPonto(nomeCat(x.c)))}</span><b>${dinheiro(x.v)}</b>
    <small>${x.m < 0.005 ? "novo" : Math.abs(x.dif) < 0.5 ? "no normal" : `${x.dif > 0 ? "+" : "−"} ${dinheiro(Math.abs(x.dif))}`}</small></li>`;
  const tabelaCats = (cats, vazio) => cats.length ? `<ul class="fe-cat">${cats.map(linhaCat).join("")}</ul>` : `<p class="vazio">${vazio}</p>`;

  const [p1, p2] = livro.casa.pessoas;
  const casa = F.compras ? `<div class="stats duas-col" style="margin-bottom:12px">
      <div class="stat"><span>Total da casa</span><b>${dinheiro(F.casa.total)}</b><small>${F.compras} compra${F.compras === 1 ? "" : "s"}</small></div>
      <div class="stat"><span>Média</span><b>${F.mc.media === null ? "—" : dinheiro(F.mc.media)}</b><small>${F.mc.media === null ? "sem mês fechado antes" : F.mc.meses.length === 1 ? "1 mês fechado" : `últimos ${F.mc.meses.length} meses fechados`}</small></div>
      <div class="stat"><span>${escH(primeiro(p1))} pagou</span><b>${dinheiro(F.casa.pagou[p1])}</b></div>
      <div class="stat"><span>${escH(primeiro(p2))} pagou</span><b>${dinheiro(F.casa.pagou[p2])}</b></div>
    </div><p class="nota" style="margin:0 0 10px">Balança: ${escH(balanca(F.casa, p1, p2))}.</p>
