<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Único</title>
<meta name="description" content="Controle Único: dinheiro, casa, clínica e carteira num lugar só, guardados no Google Drive de quem usa.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237030A0'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3ECU%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f1f0f4; --surface:#ffffff; --line:#d8d5e0;
  --text:#1a1920; --muted:#57545f;
  --accent:#7030A0; --accent-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161519; --surface:#1f1e24; --line:#38353f;
  --text:#eceaf0; --muted:#a8a4b1;
  --accent:#c8a4f2; --accent-ink:#1a1420;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161519; --surface:#1f1e24; --line:#38353f;
  --text:#eceaf0; --muted:#a8a4b1;
  --accent:#c8a4f2; --accent-ink:#1a1420;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column;
}
header{
  flex:none; background:var(--surface); border-bottom:1px solid var(--line);
  padding:8px 14px; padding-top:calc(8px + env(safe-area-inset-top,0px));
  display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
}
.marca{display:flex; align-items:center; gap:9px; font-weight:600}
.selo{width:28px; height:28px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-size:13px; font-weight:700; flex:none}
nav{display:flex; gap:2px; overflow-x:auto; flex:1 1 auto; scrollbar-width:thin}
nav button{
  border:0; background:transparent; color:var(--muted); font:inherit; font-size:14px;
  padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
nav button:hover{color:var(--text)}
nav button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.dir{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.bt{border:1px solid var(--line); background:transparent; color:var(--muted); font:inherit; font-size:13px;
  padding:6px 11px; border-radius:99px; cursor:pointer; text-decoration:none}
.bt:hover{color:var(--text)}
.bt.p{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.nuvem{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:0}
.nuvem-ponto{width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none}
.nuvem-ponto.ok{background:#2f9e5b} .nuvem-ponto.indo{background:#d49a1c} .nuvem-ponto.erro{background:#d0453a}
.hidden{display:none !important}
.palco{flex:1 1 auto; position:relative; min-height:0}
.palco iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg)}
@media (max-width:560px){
  .marca span{display:none}
  nav{order:3; flex-basis:100%}
  nav button{padding:8px 11px; font-size:13.5px}
  .dir{margin-left:auto}
}
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="nuvem.js"></script>
</head>
<body>
<header>
  <div class="marca"><div class="selo">CU</div><span>Controle Único</span></div>
  <nav id="abas" aria-label="Módulos">
    <button data-p="tudo" aria-pressed="true">Tudo</button>
    <button data-p="dinheiro" aria-pressed="false">Dinheiro</button>
    <button data-p="casa" aria-pressed="false">Casa</button>
    <button data-p="clinica" aria-pressed="false">Clínica</button>
    <button data-p="carteira" aria-pressed="false">Carteira</button>
  </nav>
  <div class="dir">
    <p class="nuvem"><span class="nuvem-ponto" id="nuvem-ponto"></span><span id="nuvem-texto" class="hidden"></span>
      <button class="bt p" id="nuvem-entrar" type="button">Entrar com o Google</button></p>
    <button class="bt" id="tema" type="button" title="Tema claro ou escuro">Tema</button>
    <a class="bt" href="privacidade.html">Privacidade</a>
  </div>
</header>

<main class="palco" id="palco"></main>

<script>
// Cada módulo é uma página própria, carregada dentro desta casca. Tudo, Dinheiro e Casa
// dividem o app.html e trocam de tela pelo endereço, sem recarregar os cadernos.
// Quem entra com o Google em qualquer uma passa o acesso para as outras (nuvem.js).
var PAGINAS = {
  tudo:     { quadro:"app",      src:"app.html#tudo" },
  dinheiro: { quadro:"app",      src:"app.html#dinheiro" },
  casa:     { quadro:"app",      src:"app.html#casa" },
  clinica:  { quadro:"clinica",  src:"clinica.html" },
  carteira: { quadro:"carteira", src:"carteira.html" }
};
var NOMES = { tudo:"Tudo", dinheiro:"Dinheiro", casa:"Casa", clinica:"Clínica", carteira:"Carteira" };

var palco = document.getElementById("palco");
var quadros = {};
var atual = null;

function quadro(k, src){
  if (quadros[k]) return quadros[k];
  var f = document.createElement("iframe");
  f.id = "q-" + k; f.title = k; f.src = src; f.hidden = true;
  palco.appendChild(f);
  quadros[k] = f;
  return f;
}

function mostrar(p){
  var cfg = PAGINAS[p]; if (!cfg) return;
  var novo = !quadros[cfg.quadro];
  var f = quadro(cfg.quadro, cfg.src);
  if (!novo && cfg.quadro === "app"){
    try { f.contentWindow.location.hash = p; } catch(e){ f.src = cfg.src; }
  }
  for (var q in quadros) quadros[q].hidden = (q !== cfg.quadro);
  f.title = NOMES[p];
  atual = p;
  // voltou para um módulo já aberto: ele confere se o Drive mudou em outro aparelho
  if (!novo) { try { f.contentWindow.Nuvem.aoMostrar(); } catch(e){} }
  var b = document.querySelectorAll("#abas button");
  for (var i = 0; i < b.length; i++) b[i].setAttribute("aria-pressed", String(b[i].dataset.p === p));
  try { localStorage.setItem("cu-painel-aba", p); } catch(e){}
  try { history.replaceState(null, "", "#" + p); } catch(e){}
}

document.getElementById("abas").addEventListener("click", function(e){
  var b = e.target.closest("button[data-p]");
  if (b) mostrar(b.dataset.p);
});

/* o tema escolhido aqui vale para a casca e para os módulos abertos */
function aplicarTema(v){
  document.documentElement.dataset.theme = v;
  for (var q in quadros) { try { quadros[q].contentDocument.documentElement.setAttribute("data-theme", v); } catch(e){} }
}
document.getElementById("tema").addEventListener("click", function(){
  var r = document.documentElement;
  var escuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  var v = escuro ? "light" : "dark";
  aplicarTema(v);
  try { localStorage.setItem("cu-painel-tema", v); localStorage.setItem("cu-tema", v); } catch(e){}
});
try { var t = localStorage.getItem("cu-painel-tema"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
palco.addEventListener("load", function(e){
  var t = document.documentElement.dataset.theme;
  if (t && e.target.tagName === "IFRAME") { try { e.target.contentDocument.documentElement.setAttribute("data-theme", t); } catch(err){} }
}, true);

var inicial = (location.hash || "").replace("#", "");
if (!PAGINAS[inicial]) { try { inicial = localStorage.getItem("cu-painel-aba") || "tudo"; } catch(e){ inicial = "tudo"; } }
if (!PAGINAS[inicial]) inicial = "tudo";
mostrar(inicial);
// A aba Tudo pergunta os números do mês à Clínica: ela abre junto, escondida, desde o começo.
quadro("clinica", PAGINAS.clinica.src).addEventListener("load", function(){
  try { quadros.app && quadros.app.contentWindow.desenhar(); } catch(e){}
});

Nuvem.iniciar();
</script>
</body>
</html>
